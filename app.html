/**
 * Zeigt an einem Knopf, dass seine Handlung laeuft - bis das Versprechen
 * erfuellt ist.
 *
 * Bei Apps Script dauert fast jede Handlung ein bis drei Sekunden. Ohne
 * Zeichen wirkte ein Knopf wie tot, man tippte ein zweites Mal - und
 * loeste die Handlung doppelt aus. Jetzt ist er waehrenddessen gesperrt und
 * dreht einen kleinen Kreisel. Scheitert die Handlung und hat sie das nicht
 * selbst gemeldet, erscheint die Meldung; vorher passierte dann gar nichts.
 */
function beschaeftigt(knopf, versprechen) {
  if (!knopf || !versprechen || typeof versprechen.then !== 'function') return versprechen;
  knopf.classList.add('laeuft');
  knopf.setAttribute('aria-busy', 'true');
  if ('disabled' in knopf) knopf.disabled = true;
  const fertig = () => {
    knopf.classList.remove('laeuft');
    knopf.removeAttribute('aria-busy');
    if ('disabled' in knopf) knopf.disabled = false;
  };
  versprechen.then(fertig, fertig);
  return versprechen;
}

/*
 * Ein kurzes Antippen spueren - auf Android. iPhones erlauben Webseiten
 * keine Vibration; dort bleibt es beim sichtbaren Druck-Effekt (CSS).
 */
function tippen() {
  try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
}
document.addEventListener('pointerdown', ev => {
  const knopf = ev.target.closest && ev.target.closest('button, .btn, .lite, .iconbtn, [role=button]');
  if (knopf && !knopf.disabled) tippen();
}, { passive: true });

const el = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const k in a) {
    if (k === 'class') e.className = a[k];
    else if (k === 'html') e.innerHTML = a[k];
    else if (k === 'onclick') {
      // Liefert die Handlung ein Versprechen, zeigt der Knopf "laeuft".
      const handlung = a[k];
      e.addEventListener('click', function (ev) {
        if (e.classList.contains('laeuft')) return;   // laeuft schon
        const r = handlung.call(this, ev);
        if (r && typeof r.then === 'function') {
          beschaeftigt(e, r).catch(f => toast('Nicht möglich: ' + (f && f.message ? f.message : 'Fehler')));
        }
      });
    }
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), a[k]);
    else e.setAttribute(k, a[k]);

  c.flat().forEach(x => e.append(x && x.nodeType ? x : document.createTextNode(x ?? '')));

let toastT;

 * Jedes Fahrzeug bekommt eine eigene Farbe.
 *
 * Nicht zur Zierde: Bei mehreren Autos ist die Farbe der schnellste Weg,

 *

 * Ampel verwechselt werden kann – sonst wuerde die Fahrzeugfarbe die
 * Zustandsfarbe stoeren, und die ist wichtiger.
 */
const FAHRZEUGFARBEN = [
  { voll: '#2F73BE', hell: '#E4EDF7' },  /* Blau    */
  { voll: '#7B5EA7', hell: '#EDE8F5' },  /* Violett */

/* Die Fahrzeugarten. Ein Haushalt mit Auto, Anhaenger und Wohnmobil sieht in
   einer Liste sonst dreimal dasselbe – die Art muss auf einen Blick erkennbar
   sein, ohne dass man den Namen liest. */
const FAHRZEUGARTEN = [
  { wert: 'auto', name: 'Auto', zeichen: 'auto' },
  { wert: 'camper', name: 'Camper', zeichen: 'camper' },
  { wert: 'anhaenger', name: 'Anhänger', zeichen: 'anhaenger' },
  { wert: 'motorrad', name: 'Motorrad / Moped', zeichen: 'motorrad' }
];

// "wohnmobil" hiess der Camper frueher. Alte Datensaetze sollen deswegen
// nicht als Auto durchgehen.
const ALTE_ARTEN = { wohnmobil: 'camper' };
function fahrzeugArt(v) {
  let wert = (v && v.art) || 'auto';
  if (ALTE_ARTEN[wert]) wert = ALTE_ARTEN[wert];
  return FAHRZEUGARTEN.find(a => a.wert === wert) || FAHRZEUGARTEN[0];
}

/** Ist das Fahrzeug ein Camper? Auch fuer den alten Wert. */
function istCamper(v) {
  return fahrzeugArt(v).wert === 'camper';
}
function fahrzeugFarbe(id) {
  const t = String(id || '');
  let summe = 0;
  for (let i = 0; i < t.length; i++) summe = (summe * 31 + t.charCodeAt(i)) >>> 0;
  return FAHRZEUGFARBEN[summe % FAHRZEUGFARBEN.length];
}

/**
 * Liefert ein fertiges SVG-Element. Die Farbe kommt vom Text darum herum,
 * die Strichstaerke bleibt bei jeder Groesse gleich stark wahrnehmbar.
 */
function icon(name, groesse = 20) {
  const formen = FORMEN[name] || FORMEN.werkzeug;
  const huelle = document.createElement('div');
  huelle.innerHTML =
    '<svg viewBox="0 0 24 24" width="' + groesse + '" height="' + groesse + '" ' +
    'fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    formen + '</svg>';
  return huelle.firstChild;
}

/** Fuer Stellen, die das Symbol als Text brauchen – etwa in einem Knopf. */
function iconMit(name, text, groesse = 18) {
  const s = document.createElement('span');
  s.className = 'mit-ic';
  s.append(icon(name, groesse), document.createTextNode(text));
  return s;
}

/* ===== render-bus ===== */
/**
 * Zwei Handgriffe, die von ueberall ausgeloest werden, aber im Abschnitt app wohnen:
 * neu zeichnen und abmelden. Ueber diese Haken statt ueber Einfuhren – sonst
 * muessten die Ansichten den Abschnitt app laden, das sie selbst laedt.
 */

let renderFn = () => {};
function setRender(fn) { renderFn = fn; }
function triggerRender() { renderFn(); }

let abmeldenFn = () => {};
function setAbmelden(fn) { abmeldenFn = fn; }
function triggerAbmelden() { return abmeldenFn(); }

/* ===== rpc ===== */
/**
 * Verbindung zum Apps-Script-Server.
 *
 * Ersetzt die frueheren Bausteine supabase.js, sync.js und mapping.js. Der
 * Abgleich entfaellt vollstaendig: Es gibt nur noch eine Quelle, die Tabelle
 * auf dem Server. Damit verschwinden Aenderungsmarkierungen, Loeschprotokoll
 * und Feldnamen-Uebersetzung ersatzlos.
 */

/*
 * Die Sitzung wird im Geraet gemerkt (localStorage), nicht nur im Tab.
 *
 * Frueher lag sie in sessionStorage: Tab zu, Anmeldung weg - obwohl der
 * Server sie zwoelf Stunden gelten laesst. Jeder neue Aufruf der App hiess
 * damit Profil waehlen, Passwort tippen, warten. Jetzt bleibt man bis zum
 * Ablauf oder bis "abmelden" angemeldet. Laeuft die Sitzung ab, meldet der
 * Server das, und die App zeigt wieder die Anmeldung.
 */
let token = null;
function setToken(t) {
  token = t;
  try {
    t ? localStorage.setItem('fp_token', t) : localStorage.removeItem('fp_token');
  } catch (e) { /* privater Modus – dann eben ohne */ }
  try { sessionStorage.removeItem('fp_token'); } catch (e) {}
}
function getToken() {
  if (token) return token;
  try { token = localStorage.getItem('fp_token'); } catch (e) { token = null; }
  // Noch aus der Zeit, als der Schluessel nur im Tab lag.
  if (!token) { try { token = sessionStorage.getItem('fp_token'); } catch (e) {} }
  return token;
}

/**
 * Ruft eine Serverfunktion. In Apps Script laeuft das ueber google.script.run,
 * das mit Rueckruffunktionen arbeitet – hier in ein Versprechen verpackt,
 * damit der uebrige Code await benutzen kann.
 */
function rufe(funktion, daten) {
  return new Promise((erfuellen, ablehnen) => {
    if (!window.google || !google.script || !google.script.run) {
      ablehnen(new Error('Keine Verbindung zum Server.'));
      return;
    }
    google.script.run
      .withSuccessHandler(erfuellen)
      .withFailureHandler(f => ablehnen(new Error(f && f.message ? f.message : String(f))))
      [funktion](daten);
  });
}

/** Aufruf mit Sitzungsschluessel. */
function rufeAngemeldet(funktion, daten) {
  return rufe(funktion, Object.assign({}, daten || {}, { token: getToken() }));
}

/** Erkennt, ob die Anmeldung abgelaufen ist – dann muss die App zurueck zur Maske. */
function istAbgemeldet(fehler) {
  return /nicht angemeldet|abgelaufen|profil gibt es nicht/i.test(fehler.message || '');
}

/* ===== db ===== */
/**
 * Datenzugriff.
 *
 * Nach aussen dieselbe Schnittstelle wie die fruehere IndexedDB-Fassung –
 * STORES, all, get, put, del –, damit die Ansichten unveraendert bleiben.
 * Darunter liegt jetzt der Apps-Script-Server statt einer Datenbank im
 * Browser.
 *
 * Gelesen wird aus einem Zwischenspeicher, den holeAlles() in einem Rutsch
 * fuellt. Sonst waere jeder Listenaufbau ein Serverbesuch und die App zaeh.
 * Geschrieben wird immer sofort zum Server; erst danach gilt es als
 * gespeichert.
 */
const STORES = ['vehicles', 'intervals', 'events', 'docs', 'fixcosts',
                       'notes', 'kmlog', 'deadlines', 'tyres', 'shops'];

let speicher = {};
STORES.forEach(s => { speicher[s] = []; });

let profil = null;
const aktuellesProfil = () => profil;

const changeListeners = new Set();
function onDbChange(fn) { changeListeners.add(fn); return () => changeListeners.delete(fn); }
const melden = () => changeListeners.forEach(fn => { try { fn(); } catch (e) {} });

/** Holt den gesamten Bestand des angemeldeten Profils und fuellt den Speicher. */
/**
 * Holt den gesamten Bestand des angemeldeten Profils und fuellt den Speicher.
 *
 * @param {object} [vorhanden] Bereits geholte Daten. Beim Start hat die
 *   Anmeldung sie schon in der Hand - ein zweiter Serverbesuch dafuer waere
 *   reine Wartezeit.
 */
async function ladeAlles(vorhanden) {
  const daten = vorhanden || await rufeAngemeldet('holeAlles');
  profil = daten.profil || null;
  STORES.forEach(s => { speicher[s] = daten[s] || []; });
  return daten;
}

/**
 * Der Zwischenspeicher, wie er gerade ist.
 *
 * put() und del() halten ihn bereits auf Stand - es gibt keinen Grund, nach
 * jedem Speichern den ganzen Bestand erneut vom Server zu holen.
 */
const alles = () => speicher;

/**
 * Traegt einen Datensatz in den Zwischenspeicher ein, der nicht ueber put()
 * gelaufen ist.
 *
 * Das Hochladen eines Belegs geht einen eigenen Weg – der Server legt die
 * Datei in Drive ab und gibt den fertigen Eintrag zurueck. Frueher fiel das
 * nicht auf, weil danach ohnehin der ganze Bestand neu geholt wurde. Ohne
 * diesen Eintrag fehlte der Beleg in der Ablage, bis man die Seite neu lud.
 */
function uebernimmSatz(bestand, satz) {
  if (!satz || !satz.id) return satz;
  const liste = speicher[bestand] || (speicher[bestand] = []);
  const i = liste.findIndex(x => x.id === satz.id);
  if (i === -1) liste.push(satz); else liste[i] = satz;
  melden();
  return satz;
}
const open = async () => true;   // gibt es nicht mehr, bleibt der Form halber
const all = async s => (speicher[s] || []).slice();
const get = async (s, id) => (speicher[s] || []).find(o => o.id === id) || null;

/**
 * Schreibt zum Server und zieht den Zwischenspeicher nach. Die Kennung
 * vergibt der Server, wenn keine mitkommt – deshalb wird sein Ergebnis
 * uebernommen und nicht die eingeschickte Fassung.
 */
async function put(s, o) {
  const gespeichert = await rufeAngemeldet('speichere', { bestand: s, datensatz: o });
  const liste = speicher[s] || (speicher[s] = []);
  const i = liste.findIndex(x => x.id === gespeichert.id);
  if (i === -1) liste.push(gespeichert); else liste[i] = gespeichert;

  // Ein neuer Kilometerstand wird am Fahrzeug nachgetragen – das macht der
  // Server. Damit die Ansicht das sofort zeigt, wird hier nachgezogen.
  if (s === 'kmlog' && gespeichert.km) {
    const f = (speicher.vehicles || []).find(v => v.id === gespeichert.vehicleId);
    if (f && (!f.kmDate || String(gespeichert.date) >= String(f.kmDate))) {
      f.km = gespeichert.km;
      f.kmDate = gespeichert.date;
    }
  }
  melden();
  return gespeichert;
}
async function del(s, id) {
  await rufeAngemeldet('loesche', { bestand: s, id });
  speicher[s] = (speicher[s] || []).filter(o => o.id !== id);

  // Wird ein Fahrzeug geloescht, verschwindet auf dem Server alles, was daran
  // haengt. Der Zwischenspeicher muss dasselbe tun, sonst zeigen Listen
  // Eintraege ohne Fahrzeug.
  if (s === 'vehicles') {
    STORES.forEach(bestand => {
      if (bestand === 'vehicles') return;
      speicher[bestand] = (speicher[bestand] || []).filter(o => o.vehicleId !== id);
    });
  }
  melden();
}

 * Nach jedem Speichern stand bisher ein reload(), und das holte den ganzen
 * Bestand neu: eine zweite Ausfuehrung auf Googles Servern, die alle elf

/* ===== interval-status ===== */
/* Wie lange vorher eine Erinnerung als "bald faellig" gilt, wenn an ihr
   nichts anderes eingestellt ist. Dieselbe Zahl benutzt der taegliche
   Mailauftrag auf dem Server – sie steht bewusst an beiden Stellen als
   feste Vorgabe, damit Ansicht und Mail nicht auseinanderlaufen koennen. */
const VORWARNUNG_STANDARD = 30;
const VORWARNUNG_KM = 1000;   // ebenso in Code.gs (Erinnerungsmail)

/** Vorwarnzeit einer Erinnerung in Tagen. */
function vorwarnung(satz) {
  const eigen = satz && satz.leadDays;
  return (eigen === '' || eigen == null) ? VORWARNUNG_STANDARD : +eigen;
}
function intStatus(iv) {
  const v = vehById(iv.vehicleId);

  // Ein fest eingetragener Termin geht vor. Fuer den TUEV steht das Datum
  // auf der Plakette – es aus "zuletzt erledigt plus Abstand" zurueckzurechnen
  // waere ein Umweg, der bei jedem verschobenen Termin falsch liegt.
  const dueDate = iv.dueDate ? parseD(iv.dueDate)
    : (iv.lastDate && iv.intervalMonths) ? addMonths(parseD(iv.lastDate), +iv.intervalMonths)
    : null;

  const dueKm = (iv.lastKm != null && iv.lastKm !== '' && iv.intervalKm) ? (+iv.lastKm + +iv.intervalKm) : null;
  const days = dueDate ? Math.round((dueDate - new Date()) / 86400000) : null;
  const kmLeft = (dueKm != null && v && v.km != null && v.km !== '') ? (dueKm - +v.km) : null;
  const vorwarn = vorwarnung(iv);

  let st = 'na';
  if (dueDate != null || dueKm != null) {
    if ((days != null && days < 0) || (kmLeft != null && kmLeft < 0)) st = 'over';
    else if ((days != null && days <= vorwarn) || (kmLeft != null && kmLeft <= VORWARNUNG_KM)) st = 'soon';
    else st = 'ok';
  }
  return { dueDate, dueKm, days, kmLeft, st, vorwarn };
}

/**
 * Fristen sind einzelne Stichtage ohne Wiederholung – Versicherungswechsel,
 * Garantieende, Leasingende. Sie liefern dieselbe Form wie intStatus, damit
 * beide gemeinsam in einer Liste stehen koennen.
 */
function fristStatus(fr) {
  const dueDate = parseD(fr.date);
  const days = dueDate ? Math.round((dueDate - new Date()) / 86400000) : null;
  const vorwarn = vorwarnung(fr);
  let st = 'na';
  if (days != null) st = days < 0 ? 'over' : (days <= vorwarn ? 'soon' : 'ok');
  return { dueDate, dueKm: null, days, kmLeft: null, st, vorwarn };
}

// "na" heisst: nicht berechenbar, weil "zuletzt erledigt" oder der Abstand
// fehlt. Das ist kein Zustand, sondern eine offene Aufgabe – entsprechend
// benannt, damit klar ist, was zu tun ist.
const stLabel = { over: 'Überfällig', soon: 'Bald fällig', ok: 'OK', na: 'Angabe fehlt' };
const rank = st => ({ over: 0, soon: 1, ok: 2, na: 3 }[st] ?? 3);

/**
 * Waehlt das gezeichnete Symbol zur Wartungsart. Frueher standen hier Emoji –
 * die zeichnet das Betriebssystem, also sah dasselbe Zeichen auf jedem Geraet
 * anders aus.
 */
function kindName(k) {
  k = (k || '').toLowerCase();
  if (/t[üu]v|hu|au|unters/.test(k)) return 'schild';
  if (/öl|oil/.test(k)) return 'tropfen';
  if (/zahnriemen|riemen|kette/.test(k)) return 'riemen';
  if (/brems/.test(k)) return 'bremse';
  if (/luft|pollen|innenraum|kraftstoff|filter/.test(k)) return 'filter';
  if (/reifen|räder|rad/.test(k)) return 'reifen';
  if (/batterie|akku/.test(k)) return 'batterie';
  if (/klima|kühl/.test(k)) return 'schnee';
  if (/versicher|vertrag|garantie|leasing/.test(k)) return 'vertrag';
  if (/frist|wechsel|termin/.test(k)) return 'kalender';
  return 'werkzeug';
}
function kindIcon(k, groesse) {
  return icon(kindName(k), groesse || 18);
}

/** Die Vorlagen zur Fahrzeugart. */
function vorlagenFuer(fahrzeug) {
  var art = (fahrzeug && fahrzeug.art) || 'auto';
  if (art === 'wohnmobil') art = 'camper';
  if (art === 'anhaenger') return VORLAGEN_ANHAENGER;
  if (art === 'camper') return VORLAGEN_CAMPER.concat(VORLAGEN);
  if (art === 'motorrad') return VORLAGEN_MOTORRAD;
  return VORLAGEN;
}
function passtZuFahrzeug(vorlage, fahrzeug) {
  const kraftstoff = (fahrzeug?.fuelType || '').toLowerCase();
  if (vorlage.kind === 'Zündkerzen' && /diesel|elektro/.test(kraftstoff)) return false;
  if (vorlage.kind === 'Kraftstofffilter' && /elektro/.test(kraftstoff)) return false;
  if (/elektro/.test(kraftstoff) && ['Ölwechsel', 'Ölfilter', 'Zahnriemen'].includes(vorlage.kind)) return false;
  return true;
}

/**
 * Kopfzeile eines Bereichs. "art" waehlt die Knopfstufe: ohne Angabe der

 * die sollen nicht so laut sein wie "+ Eintrag hinzufügen".
 */
function headBar(eyebrow, title, actionLabel, actionFn, art) {
  return el('div', { class: 'head' },
    el('div', {}, el('div', { class: 'eyebrow' }, eyebrow), el('h1', {}, title)),
    actionLabel ? el('button', { class: 'btn' + (art ? ' ' + art : ''), onclick: actionFn }, actionLabel) : null);

function table(cols) {
  const wrap = el('div', { class: 'tblwrap' });
  const t = el('table');
  const thead = el('thead');
  const tr = el('tr');
  cols.forEach(c => tr.append(el('th', {}, c)));
  thead.append(tr);
  const tBody = el('tbody');
  t.append(thead, tBody);
  wrap.append(t);
  return { wrap, t, tBody };
}
/**
 * Schreibt an jede Tabellenzelle, zu welcher Spalte sie gehoert.
 *
 * Auf dem Handy werden Tabellen zu Karten (styles: "Tabellen werden zu
 * Karten"); dort fehlt die Kopfzeile, also muss jede Zelle ihre
 * Bezeichnung selbst tragen. Die erste benannte Textspalte wird zur
 * Ueberschrift der Karte.
 */
function beschrifteTabellen(wurzel) {
  (wurzel || document).querySelectorAll('.tblwrap table').forEach(t => {
    const koepfe = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => {
      let titel = false;
      [...tr.children].forEach((zelle, i) => {
        const name = koepfe[i] || '';
        if (zelle.dataset.label !== name) zelle.dataset.label = name;
        if (!titel && name && !zelle.classList.contains('num')) {
          zelle.classList.add('tz');
          titel = true;
        }
      });
    });
  });
}
// Tabellen entstehen in vielen Ansichten und Dialogen - statt jede Stelle
// einzeln anzupassen, wird nach jeder Aenderung am Inhalt nachgezogen.
(() => {
  let geplant = false;
  new MutationObserver(() => {
    if (geplant) return;
    geplant = true;
    requestAnimationFrame(() => { geplant = false; beschrifteTabellen(); });
  }).observe(document.body, { childList: true, subtree: true });
})();
const td = (txt, cls) => el('td', { class: cls || '' }, txt);
const tdEl = (node) => { const d = el('td'); d.append(node); return d; };

/* ---------------- form field builders ---------------- */
/**
 * Ein Eingabefeld.
 *
 * Zahlenfelder bekommen von sich aus min="0": Ein negativer Kilometerstand
 * oder ein negativer Rechnungsbetrag ist in dieser App immer ein Vertipper,
 * und der Browser weist ihn dann schon beim Tippen ab. Geprueft wird
 * trotzdem noch einmal beim Speichern - auf das Wohlwollen des Browsers
 * allein darf sich nichts verlassen.
 */
function f(label, name, val, type = 'text', ph = '', zusatz) {
  const eigenschaften = Object.assign({ name, type, placeholder: ph }, zusatz || {});
  if (type === 'number' && eigenschaften.min === undefined) eigenschaften.min = '0';
  const inp = type === 'textarea'
    ? el('textarea', { name, rows: '2', placeholder: ph })
    : el('input', eigenschaften);
  if (val != null && val !== '') inp.value = val;
  return el('div', { class: 'field' }, el('label', {}, label), inp);
}
function selField(label, name, val, opts) {
  const s = el('select', { name });
  s.append(el('option', { value: '' }, '– wählen –'));
  opts.forEach(o => { const op = el('option', { value: o }, o); if (o === val) op.selected = true; s.append(op); });
  return el('div', { class: 'field' }, el('label', {}, label), s);
}
function row2(a, b) { return el('div', { class: 'row2' }, a, b); }
function vehPick(val) {
  const s = el('select', { name: 'vehicleId' });
  S.vehicles.forEach(v => { const op = el('option', { value: v.id }, v.name); if (v.id === val) op.selected = true; s.append(op); });
  return el('div', { class: 'field' }, el('label', {}, 'Fahrzeug'), s);
}

/* ---------------- modal engine ---------------- */
/**
 * Dialog.
 *
 * @param {object} [optionen]
 * @param {boolean} [optionen.nurSchliessen] Ohne Speichern-Knopf – fuer Fenster,
 *   die nur etwas zeigen, etwa die Suche.
 * @param {Array} [optionen.knoepfe] Eigener Fuss. Der letzte Knopf steht rechts
 *   und ist der betonte – dort sucht ihn die Hand zuerst.
 */
function modal(title, fields, onSave, optionen) {
  const o = optionen || {};
  const mod = $('#modal');
  mod.innerHTML = '';
  const body = el('div', { class: 'body' });
  fields.filter(Boolean).forEach(x => body.append(x));
  const save = el('button', { class: 'btn' }, 'Speichern');
  mod.append(
    el('header', {}, el('h3', {}, title), el('button', { class: 'x', onclick: closeModal }, '×')),
    body,
    o.knoepfe
      ? el('footer', {}, ...o.knoepfe)
      : o.nurSchliessen
        ? el('footer', {}, el('span'), el('button', { class: 'btn ghost', onclick: closeModal }, 'Schließen'))
        : el('footer', {}, el('button', { class: 'btn ghost', onclick: closeModal }, 'Abbrechen'), save)
  );
  // Fehler beim Speichern muessen hier heraus.
  //
  // Frueher lief onSave ungefangen: Sagte der Server nein, blieb der Dialog
  // einfach stehen - kein Hinweis, keine Meldung, nichts. Es sah aus, als
  // reagiere der Knopf nicht, und niemand konnte erraten, woran es lag.
  const fehlerfeld = el('div', { class: 'dialog-fehler' });
  save.onclick = async () => {
    fehlerfeld.textContent = '';
    fehlerfeld.classList.remove('an');
    const data = {};
    body.querySelectorAll('[name]').forEach(i => { let v = i.value; if (i.type === 'number') v = v === '' ? '' : +v; data[i.name] = v; });
    save.disabled = true;
    save.classList.add('laeuft');
    try {
      const r = await onSave(data);
      if (r !== false) { closeModal(); triggerRender(); }
    } catch (fehler) {
      fehlerfeld.textContent = 'Nicht gespeichert: ' + (fehler && fehler.message ? fehler.message : 'unbekannter Fehler');
      fehlerfeld.classList.add('an');
      fehlerfeld.scrollIntoView({ block: 'nearest' });
    } finally {
      save.disabled = false;
      save.classList.remove('laeuft');
    }
  };
  body.append(fehlerfeld);
  $('#overlay').classList.add('show');
}
function closeModal() { $('#overlay').classList.remove('show'); }

/**
 * Belege.
 *
 * Frueher lagen sie als Blob in der Datenbank im Browser und wurden zu
 * Supabase hochgeladen. Jetzt liegen sie in Drive; der Browser haelt keine
 * Datei mehr vor.
 *
 * Nach aussen bleibt datei() dieselbe Funktion wie bisher, damit
 * Abschnitt views/documents unveraendert weiterlaeuft.
 */



/**
 * Laedt einen Beleg vom Server und gibt ihn als Blob zurueck.
 * Die Datei kommt als Base64 – anders geht es ueber google.script.run nicht.
 */
async function datei(docId) {
  const antwort = await rufeAngemeldet('holeBeleg', { id: docId });
  const roh = atob(antwort.base64);
  const puffer = new Uint8Array(roh.length);
  for (let i = 0; i < roh.length; i++) puffer[i] = roh.charCodeAt(i);
  return new Blob([puffer], { type: antwort.mime || 'application/octet-stream' });
}

/* Dieselbe Grenze wie auf dem Server (MAX_BYTES). Hier vorab geprueft, damit
   statt einer unverstaendlichen Apps-Script-Meldung ein klarer Satz kommt. */
const MAX_BELEG_BYTES = 25 * 1024 * 1024;
// Dieselbe Grenze wie KI_MAX_BYTES auf dem Server.
const KI_MAX_BYTES = 14 * 1024 * 1024;
const ZU_GROSS = 'Das Dokument ist zu groß. Bitte weniger Seiten scannen oder die Scanqualität reduzieren.';

/** Legt eine Datei ab und liefert den fertigen Dokumenteintrag. */
async function belegAblegen({ vehicleId, file, title, date, category, kiAuswerten }) {
  const klein = await verkleinereBild(file);
  if (klein.size > MAX_BELEG_BYTES) throw new Error(ZU_GROSS);
  const base64 = await alsBase64(klein);
  const dok = await rufeAngemeldet('ladeBelegHoch', {
    vehicleId, base64, mime: klein.type, name: klein.name,
    title: title || klein.name, date: date || '', category: category || 'Beleg',
    kiAuswerten: !!kiAuswerten
  });
  // Dieser Weg geht an put() vorbei – der Zwischenspeicher muss den Eintrag
  // trotzdem kennen, sonst fehlt der Beleg bis zum naechsten Neuladen.
  return uebernimmSatz('docs', dok);
}
function alsBase64(file) {
  return new Promise((res, rej) => {
    const leser = new FileReader();
    leser.onload = () => {
      const s = String(leser.result);
      res(s.slice(s.indexOf(',') + 1));
    };
    leser.onerror = () => rej(new Error('Datei konnte nicht gelesen werden.'));
    leser.readAsDataURL(file);
  });
}

/**
 * Verkleinert Fotos vor dem Hochladen auf 1600 Pixel laengste Kante. Ein
 * Handyfoto hat schnell 5 MB; als Beleg genuegt ein Bruchteil davon. Formate,
 * die der Browser nicht entschluesseln kann – etwa HEIC –, gehen unveraendert
 * durch, statt die Ablage scheitern zu lassen.
 */
function verkleinereBild(file, maxKante = 1600) {
  return new Promise(res => {
    if (!/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return res(file);
    const url = URL.createObjectURL(file);
    const bild = new Image();
    bild.onload = () => {
      const { naturalWidth: b, naturalHeight: h } = bild;
      if (Math.max(b, h) <= maxKante) { URL.revokeObjectURL(url); return res(file); }
      const faktor = maxKante / Math.max(b, h);
      const flaeche = document.createElement('canvas');
      flaeche.width = Math.round(b * faktor);
      flaeche.height = Math.round(h * faktor);
      flaeche.getContext('2d').drawImage(bild, 0, 0, flaeche.width, flaeche.height);
      flaeche.toBlob(klein => {
        URL.revokeObjectURL(url);
        res(klein ? new File([klein], file.name.replace(/\.\w+$/, '') + '.jpg',
                             { type: 'image/jpeg' }) : file);
      }, 'image/jpeg', 0.82);
    };
    bild.onerror = () => { URL.revokeObjectURL(url); res(file); };
    bild.src = url;
  });
}

/**
 * Belegerkennung.
 *
 * Die Auswertung laeuft auf dem Server: Die Zugangsschluessel liegen in den
 * Skripteigenschaften und nie im Browser. Frueher stand der Schluessel in der
 * Datenbank des Browsers – jeder mit Zugriff auf das Geraet haette ihn lesen
 * koennen.
 *
 * Wer den Beleg liest – Claude oder Gemini – entscheidet der Server. Hier
 * steht nur, dass ueberhaupt jemand bereitsteht.
 */


/*
 * Die Antwort aendert sich nur, wenn jemand im Skripteditor einen Schluessel
 * hinterlegt - also nie waehrend einer Sitzung. Sie wird deshalb einmal
 * geholt und gemerkt. Vorher fragte jeder Dialog mit Dateifeld neu nach,
 * und jede dieser Fragen ist bei Apps Script eine eigene Ausfuehrung auf
 * Googles Servern: Der Dialog ging spuerbar spaeter auf.
 */
let gemerkterStand = null;

/** Hinterlegt werden die Schluessel im Skripteditor, nicht hier. */
async function verfuegbar() {
  return !!(await stand()).aktiv;
}

/** Fuer die Einstellungen: welcher Dienst liest, und wer sonst noch bereitsteht. */
async function stand() {
  if (gemerkterStand) return gemerkterStand;
  try {
    gemerkterStand = await rufeAngemeldet('erkennungStand');
  } catch (e) {
    // Aeltere Bereitstellungen kennen den neuen Namen noch nicht.
    try {
      const da = await rufeAngemeldet('geminiVorhanden');
      gemerkterStand = { claude: false, gemini: !!da, aktiv: da ? 'gemini' : null, zweit: null };
    } catch (e2) {
      gemerkterStand = { claude: false, gemini: false, aktiv: null, zweit: null };
    }
  }
  return gemerkterStand;
}

// Bleiben nur, damit Abschnitt views/settings unveraendert laeuft.
const schluesselLesen = async () => null;
const schluesselSetzen = async () => {
  throw new Error('Der Schlüssel wird im Skripteditor hinterlegt: setzeClaudeSchluessel("…")');
};
const modellLesen = async () => '';
const modellSetzen = async () => {};

/**
 * Schickt den Beleg zum Server, der ihn auslesen laesst. Das Ergebnis ist
 * ausdruecklich nur ein Vorschlag – die App zeigt es zur Kontrolle, bevor
 * etwas gespeichert wird.
 */
async function analysiereMitGemini(dateien, onStatus) {
  const liste = Array.isArray(dateien) ? dateien : [dateien];
  if (onStatus) onStatus('Beleg wird vorbereitet …');

  const seiten = [];
  let gesamt = 0;
  for (const d of liste) {
    const klein = await verkleinereBild(d);
    gesamt += klein.size;
    // Vor dem Senden pruefen: Gemini nimmt eingebettete Dateien nur bis etwa
    // 20 MB je Anfrage an, als Base64 um ein Drittel groesser. Ohne diese
    // Pruefung kam eine unverstaendliche Fehlermeldung zurueck.
    if (gesamt > KI_MAX_BYTES) {
      throw new Error('Das Dokument ist für die automatische Auswertung zu groß (über '
        + Math.round(KI_MAX_BYTES / 1024 / 1024) + ' MB).');
    }
    seiten.push({ base64: await alsBase64(klein), mime: klein.type });
  }

  if (onStatus) {
    onStatus(seiten.length > 1
      ? seiten.length + ' Seiten werden ausgelesen – das dauert einen Moment …'
      : 'Beleg wird ausgelesen – das dauert einen Moment …');
  }
  // base64/mime bleiben fuer aeltere Bereitstellungen dabei, die nur eine
  // Seite kennen; der Server nimmt "seiten", wenn er damit umgehen kann.
  const erkannt = await rufeAngemeldet('erkenneBeleg', {
    seiten, base64: seiten[0].base64, mime: seiten[0].mime
  });

  if (onStatus) onStatus('');
  return erkannt || {};
}

/**
 * Liest einen gespeicherten Beleg aus - der Server holt ihn selbst aus Drive.
 *
 * Wirft nicht, wenn nur die Erkennung scheitert: Dann kommt { fehler }
 * zurueck, und der Beleg bleibt, wie er ist. Nur eine abgelaufene Anmeldung
 * geht als Fehler weiter, damit die App zur Anmeldung zurueckkehrt.
 *
 * @returns {Promise<{dok: object|null, ergebnis: object|null, fehler: string|null}>}
 */
async function kiAuslesen(docId) {
  try {
    const antwort = await rufeAngemeldet('liesBelegAus', { id: docId });
    if (antwort && antwort.dok) uebernimmSatz('docs', antwort.dok);
    return antwort || { dok: null, ergebnis: null, fehler: 'Keine Antwort.' };
  } catch (e) {
    if (istAbgemeldet(e)) throw e;
    return { dok: null, ergebnis: null, fehler: e.message || 'Fehler' };
  }
}

/* ---------------- document analysis (local, regelbasiert) ---------------- */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error('Bibliothek nicht ladbar – Internet nötig'));
    document.head.append(s);
  });
}
/**
 * Laedt pdf.js nach und oeffnet ein PDF. Auch die Belegansicht benutzt das:
 * Im Apps-Script-Rahmen ist der PDF-Betrachter des Browsers nicht erreichbar,
 * also wird selbst gezeichnet.
 */
async function ladePdf(puffer) {
  await loadScript(PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  // isEvalSupported: false schliesst CVE-2024-4367 - in pdf.js 3.x konnte
  // ein praepariertes PDF sonst beim Anzeigen eigenes JavaScript ausfuehren.
  return pdfjsLib.getDocument({ data: puffer, isEvalSupported: false }).promise;
}

async function pdfPageImage(pdf, n) {
  const pg = await pdf.getPage(n);
  const vp = pg.getViewport({ scale: 2 });
  const cv = document.createElement('canvas');
  cv.width = vp.width; cv.height = vp.height;
  await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  return cv.toDataURL('image/png');
}
async function ocr(src, onStatus) {
  await loadScript(TESS);
  onStatus && onStatus('Texterkennung läuft (kann etwas dauern) …');
  const { data } = await Tesseract.recognize(src, 'deu');
  return data.text || '';
}
async function analyzeFile(file, onStatus) {
  let text = '';
  if (file.type === 'application/pdf') {
    onStatus && onStatus('Lese PDF …');
    const pdf = await ladePdf(await file.arrayBuffer());
    for (let i = 1; i <= Math.min(pdf.numPages, 6); i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      text += '\n' + tc.items.map(it => it.str).join(' ');
    }
    if (text.replace(/\s/g, '').length < 20) {
      // Gescanntes PDF ohne Textebene: alle Seiten erkennen, nicht nur die
      // erste - bei mehrseitigen Rechnungen steht die Summe meist am Ende.
      // Dieselbe Obergrenze wie oben; jede Seite dauert einige Sekunden.
      const bis = Math.min(pdf.numPages, 6);
      text = '';
      for (let i = 1; i <= bis; i++) {
        onStatus && onStatus('Kein Text im PDF – Texterkennung Seite ' + i + ' von ' + bis + ' …');
        text += '\n' + await ocr(await pdfPageImage(pdf, i));
      }
    }
  } else if (file.type.startsWith('image/')) {
    text = await ocr(file, onStatus);
  } else {
    throw new Error('Format nicht unterstützt');
  }
  return parseInvoice(text);
}
function parseInvoice(text) {
  const t = text.replace(/ /g, ' ');
  const low = t.toLowerCase();
  const dISO = (d, m, y) => { y = +y; if (y < 100) y += 2000; return y + '-' + String(+m).padStart(2, '0') + '-' + String(+d).padStart(2, '0'); };
  let date = null;
  const dRe = /(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})|(\d{4})-(\d{2})-(\d{2})/g;
  const di = low.indexOf('datum');
  let m, best = null, bestDist = 1e9;
  while ((m = dRe.exec(t))) {
    const iso = m[4] ? dISO(m[6], m[5], m[4]) : dISO(m[1], m[2], m[3]);
    const dist = di >= 0 ? Math.abs(m.index - di) : m.index;
    if (dist < bestDist) { bestDist = dist; best = iso; }
  }
  date = best;

  const kwRe = /(gesamt|summe|brutto|rechnungsbetrag|zu zahlen|endbetrag|zahlbetrag|total|betrag)/gi;
  const amtRe = /(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+,\d{2})/g;
  const toNum = s => parseFloat(s.replace(/[.\s]/g, '').replace(',', '.'));
  let cost = null, kwCost = null, maxCost = null, amtM;
  while ((amtM = amtRe.exec(t))) { const v = toNum(amtM[1]); if (maxCost == null || v > maxCost) maxCost = v; }
  let kw;
  while ((kw = kwRe.exec(low))) {
    const win = t.slice(kw.index, kw.index + 40);
    const a = win.match(/(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+,\d{2})/);
    if (a) { const v = toNum(a[1]); if (kwCost == null || v > kwCost) kwCost = v; }
  }
  cost = kwCost != null ? kwCost : maxCost;

  let kmv = null;
  const kmM = t.match(/(\d{1,3}(?:[.\s]\d{3})+|\d{2,7})\s*km\b/i) || t.match(/kilometerstand[^\d]{0,10}(\d{1,3}(?:[.\s]\d{3})+|\d{2,7})/i);
  if (kmM) kmv = parseInt(kmM[1].replace(/[.\s]/g, ''), 10);

  let category = null;
  if (/hauptuntersuchung|hu\/au|\bhu\b|\bau\b|tüv|dekra|gtü/i.test(low)) category = 'HU/AU-Bericht';
  else if (/versicherung|police|kfz-versicherung/i.test(low)) category = 'Versicherung';
  else if (/rechnung|betrag|werkstatt/i.test(low)) category = 'Rechnung';

  return { date, cost: (cost != null ? cost : null), km: (kmv != null ? kmv : null), category };
}
function setIfEmpty(body, name, val) {
  const i = body && body.querySelector('[name="' + name + '"]');
  if (i && (i.value == null || i.value === '') && val != null && val !== '') i.value = val;
}

    } catch (err) {

  });
}

/* ===== pdf-bauen ===== */
/**
 * Mehrere Seiten zu einem PDF zusammensetzen.
 *
 * Eine Werkstattrechnung hat selten eine Seite. Bisher landete jedes Foto als
 * eigener Beleg in der Ablage – drei Bilder, drei Eintraege, und beim Suchen
 * weiss niemand mehr, welche zusammengehoeren. Hier entsteht daraus ein
 * einziges PDF mit sprechendem Namen.
 *
 * Gebaut wird im Browser, nicht auf dem Server: Die Bilder sind ohnehin schon
 * dort, und ein Rundweg ueber Apps Script waere bei drei Handyfotos eine
 * spuerbare Wartezeit.
 */

const PDFLIB = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';

/* A4 in der Einheit, die PDF benutzt: 72 Punkt je Zoll. */
const A4 = { breite: 595.28, hoehe: 841.89 };
const RAND = 18;

/**
 * Wandelt ein Bild in JPEG um und begrenzt die Kantenlaenge.
 *
 * PDF kann JPEG und PNG einbetten, aber nicht HEIC und nicht das, was manche
 * Kameras sonst liefern. Der Umweg ueber die Zeichenflaeche macht aus allem,
 * was der Browser anzeigen kann, ein JPEG – und verkleinert nebenbei: Ein
 * Handyfoto mit 12 Megapixeln macht das PDF unnoetig schwer, lesbar ist eine
 * Rechnung auch mit 1600 Pixeln Kantenlaenge - und jedes Kilobyte weniger
 * ist beim Hochladen ueber Apps Script spuerbar.
 */
function alsJpeg(datei, maxKante = 1600) {
  return new Promise((erfuellen, ablehnen) => {
    const url = URL.createObjectURL(datei);
    const bild = new Image();
    bild.onload = () => {
      const { naturalWidth: b, naturalHeight: h } = bild;
      const faktor = Math.min(1, maxKante / Math.max(b, h));
      const flaeche = document.createElement('canvas');
      flaeche.width = Math.round(b * faktor);
      flaeche.height = Math.round(h * faktor);
      flaeche.getContext('2d').drawImage(bild, 0, 0, flaeche.width, flaeche.height);
      flaeche.toBlob(klein => {
        URL.revokeObjectURL(url);
        klein ? erfuellen(klein) : ablehnen(new Error('Bild nicht lesbar: ' + datei.name));
      }, 'image/jpeg', 0.82);
    };
    bild.onerror = () => {
      URL.revokeObjectURL(url);
      ablehnen(new Error('Bild nicht lesbar: ' + datei.name));
    };
    bild.src = url;
  });
}

/** Setzt ein Bild mittig und moeglichst gross auf eine A4-Seite. */
async function bildSeite(doc, datei) {
  const jpeg = await alsJpeg(datei);
  const eingebettet = await doc.embedJpg(await jpeg.arrayBuffer());

  // Hochkant oder quer – die Seite dreht sich mit, damit ein quer
  // fotografierter Beleg nicht winzig in der Mitte klebt.
  const quer = eingebettet.width > eingebettet.height;
  const seite = doc.addPage(quer ? [A4.hoehe, A4.breite] : [A4.breite, A4.hoehe]);

  const platzB = seite.getWidth() - 2 * RAND;
  const platzH = seite.getHeight() - 2 * RAND;
  const faktor = Math.min(platzB / eingebettet.width, platzH / eingebettet.height);
  const b = eingebettet.width * faktor;
  const h = eingebettet.height * faktor;

  seite.drawImage(eingebettet, {
    x: (seite.getWidth() - b) / 2,
    y: (seite.getHeight() - h) / 2,
    width: b, height: h
  });
}

/** Haengt alle Seiten eines vorhandenen PDF an. */
async function pdfAnhaengen(doc, datei) {
  const quelle = await PDFLib.PDFDocument.load(await datei.arrayBuffer(),
    { ignoreEncryption: true });
  const seiten = await doc.copyPages(quelle, quelle.getPageIndices());
  seiten.forEach(s => doc.addPage(s));
}

/**
 * Baut aus Bildern und PDF-Dateien ein einziges PDF – in der Reihenfolge,
 * in der sie uebergeben werden.
 *
 * @param {File[]} seiten
 * @param {string} name Dateiname des Ergebnisses
 * @param {function} [onStatus] Fortschritt zum Anzeigen
 * @returns {Promise<File>}
 */
async function baueBelegPdf(seiten, name, onStatus) {
  if (!seiten.length) throw new Error('Keine Seiten ausgewählt.');

  // Eine einzelne PDF-Datei bleibt, wie sie ist: neu zu bauen wuerde nur
  // Text in Bilder verwandeln und die Durchsuchbarkeit kosten.
  if (seiten.length === 1 && seiten[0].type === 'application/pdf') {
    return new File([seiten[0]], name, { type: 'application/pdf' });
  }

  if (onStatus) onStatus('PDF-Werkzeug wird geladen …');
  await loadScript(PDFLIB);

  const doc = await PDFLib.PDFDocument.create();
  doc.setTitle(name.replace(/\.pdf$/i, ''));
  doc.setCreator('Fuhrpark');
  doc.setCreationDate(new Date());

  for (let i = 0; i < seiten.length; i++) {
    if (onStatus) onStatus('Seite ' + (i + 1) + ' von ' + seiten.length + ' …');
    const d = seiten[i];
    if (d.type === 'application/pdf') await pdfAnhaengen(doc, d);
    else await bildSeite(doc, d);
  }

  const bytes = await doc.save();
  return new File([bytes], name, { type: 'application/pdf' });
}

/* Zeichen, die in Dateinamen Aerger machen – unter Windows genauso wie in
   Drive. Sie fliegen raus, statt den Namen abzulehnen. */
const VERBOTEN = /[\\/:*?"<>|\u0000-\u001f]/g;

/**
 * Baut einen sprechenden Dateinamen aus dem, was erkannt wurde.
 *
 * Datum zuerst: So liegen die Belege in jeder Ordneransicht von selbst in
 * zeitlicher Reihenfolge, ohne dass jemand sortieren muss.
 */
function belegName(daten, ersatz = 'Beleg') {
  const teile = [];
  if (daten.date) teile.push(String(daten.date));
  const was = [daten.shop, daten.title || daten.desc].filter(Boolean).join(' – ');
  teile.push(was || ersatz);

  let name = teile.join(' ').replace(VERBOTEN, '').replace(/\s+/g, ' ').trim();
  if (name.length > 90) name = name.slice(0, 90).trim();
  return (name || ersatz) + '.pdf';
}

/**
 * Wandelt alle Seiten in verkleinerte Bilder – so geht die Erkennung an den
 * ganzen Beleg, ohne dass Megabytes ueber die Leitung muessen.
 *
 * Nur die erste Seite zu schicken waere ein Trugschluss: Bei einer
 * mehrseitigen Werkstattrechnung steht die Summe meist am Ende, und auf
 * Seite zwei eines TUEV-Berichts stehen die Maengel. Was zaehlt, ist die
 * Groesse je Seite, nicht die Zahl der Seiten - ein gescanntes Blatt mit
 * 1,4 MB wird als JPEG zu einem Bruchteil davon, lesbar bleibt es.
 *
 * @param {File[]} dateien Bilder und/oder PDF
 * @param {object} [optionen] maxKante, maxSeiten, onStatus
 * @returns {Promise<File[]>}
 */
async function seitenAlsBilder(dateien, optionen = {}) {
  try {
    return await seitenZeichnen(dateien, optionen);
  } catch (e) {
    // Zeichnen kann haengen, wenn der Tab im Hintergrund liegt: pdf.js
    // wartet auf den Bildtakt, den der Browser dann anhaelt. Lieber die
    // Dateien unveraendert schicken als gar nichts zu erkennen.
    return dateien;
  }
}

async function seitenZeichnen(dateien, optionen) {
  const maxKante = optionen.maxKante || 1500;
  const maxSeiten = optionen.maxSeiten || 12;
  const melde = optionen.onStatus || (() => {});
  const grenze = (versprechen, ms) => Promise.race([
    versprechen,
    new Promise((_, ab) => setTimeout(() => ab(new Error('Zeichnen dauert zu lange')), ms))
  ]);
  const raus = [];

  for (const datei of dateien) {
    if (raus.length >= maxSeiten) break;

    if (!/pdf/i.test(datei.type)) {
      melde('Seite ' + (raus.length + 1) + ' wird vorbereitet …');
      const jpeg = await alsJpeg(datei, maxKante);
      raus.push(new File([jpeg], 'seite' + (raus.length + 1) + '.jpg', { type: 'image/jpeg' }));
      continue;
    }

    const pdf = await grenze(ladePdf(await datei.arrayBuffer()), 20000);
    const bis = Math.min(pdf.numPages, maxSeiten - raus.length);
    for (let i = 1; i <= bis; i++) {
      melde('Seite ' + (raus.length + 1) + ' von ' + pdf.numPages + ' wird vorbereitet …');
      const seite = await pdf.getPage(i);
      const roh = seite.getViewport({ scale: 1 });
      const masse = seite.getViewport({ scale: maxKante / Math.max(roh.width, roh.height) });

      const flaeche = document.createElement('canvas');
      flaeche.width = Math.round(masse.width);
      flaeche.height = Math.round(masse.height);
      const stift = flaeche.getContext('2d');
      stift.fillStyle = '#fff';               // sonst bleibt Papier durchsichtig
      stift.fillRect(0, 0, flaeche.width, flaeche.height);
      await grenze(seite.render({ canvasContext: stift, viewport: masse }).promise, 20000);

      const blob = await new Promise(r => flaeche.toBlob(r, 'image/jpeg', 0.78));
      raus.push(new File([blob], 'seite' + (raus.length + 1) + '.jpg', { type: 'image/jpeg' }));
    }
  }
  return raus;
}

/* ===== seiten-feld ===== */
/**
 * Ein Feld zum Sammeln von Seiten – fotografieren oder Dateien waehlen.
 *
 * Steckt sowohl im Belegscanner als auch im Notizdialog. Eine Notiz ohne
 * Bild ist oft die Haelfte der Geschichte: der Kratzer, das Angebot, der
 * Zettel von der Werkstatt. Mehrere Seiten werden zu einem PDF.
 */


/**
 * @param {object} [optionen]
 * @param {string} [optionen.hinweis] Text unter der Liste.
 * @param {function} [optionen.beiAenderung] Wird gerufen, wenn sich die Anzahl aendert.
 * @returns {{feld: HTMLElement, seiten: function, anzahl: function, aufraeumen: function}}
 */
function seitenFeld(optionen = {}) {
  const gesammelt = [];          // { datei, url }
  const liste = el('div', { class: 'seiten-liste' });

  // Zwei getrennte Wege: Die Kamera liefert ein Bild nach dem anderen, die
  // Dateiauswahl mehrere auf einmal. Ein einziger Knopf koennte nur eines
  // von beidem.
  const kamera = el('input', {
    type: 'file', accept: 'image/*', capture: 'environment',
    style: 'display:none', onchange: ev => aufnehmen(ev.target)
  });
  const auswahl = el('input', {
    type: 'file', accept: 'application/pdf,image/*', multiple: 'multiple',
    style: 'display:none', onchange: ev => aufnehmen(ev.target)
  });

  function aufnehmen(feldchen) {
    [...feldchen.files].forEach(d => {
      if (d.size > 25 * 1024 * 1024) {
        toast('„' + d.name + '" ist größer als 25 MB und wird übersprungen.');
        return;
      }
      gesammelt.push({ datei: d, url: /^image\//.test(d.type) ? URL.createObjectURL(d) : null });
    });
    feldchen.value = '';         // dieselbe Datei soll erneut waehlbar sein
    zeichne();
  }

  function verschiebe(i, um) {
    const ziel = i + um;
    if (ziel < 0 || ziel >= gesammelt.length) return;
    const [x] = gesammelt.splice(i, 1);
    gesammelt.splice(ziel, 0, x);
    zeichne();
  }

  function entferne(i) {
    if (gesammelt[i].url) URL.revokeObjectURL(gesammelt[i].url);
    gesammelt.splice(i, 1);
    zeichne();
  }

  /*
   * Ein Knopf mit Pfeil.
   *
   * Das Attribut "disabled" darf nur gesetzt werden, wenn es auch gelten
   * soll: el() reicht jeden Wert an setAttribute weiter, und ein
   * disabled="null" sperrt den Knopf genauso wie disabled="disabled".
   * Damit waren alle Pfeile tot und die Reihenfolge liess sich nicht
   * aendern - ohne dass irgendetwas danach aussah.
   */
  function pfeil(titel, zeichen, gesperrt, beiKlick) {
    const eigenschaften = { class: 'iconbtn', type: 'button', title: titel, onclick: beiKlick };
    if (gesperrt) eigenschaften.disabled = 'disabled';
    return el('button', eigenschaften, zeichen);
  }

  function zeichne() {
    liste.innerHTML = '';
    if (!gesammelt.length) {
      liste.append(el('div', { class: 'seiten-leer' },
        optionen.hinweis || 'Noch keine Seite. Fotografieren oder Dateien wählen – '
          + 'mehrere Seiten werden zu einem PDF zusammengefasst.'));
    } else {
      gesammelt.forEach((s, i) => liste.append(el('div', { class: 'seite' },
        el('span', { class: 'seite-nr' }, String(i + 1)),
        s.url ? el('img', { class: 'seite-bild', src: s.url, alt: '' })
              : el('span', { class: 'seite-bild pdf' }, icon('beleg', 20)),
        el('span', { class: 'seite-name' }, s.datei.name),
        el('div', { class: 'seite-akt' },
          pfeil('nach oben', '↑', i === 0, () => verschiebe(i, -1)),
          pfeil('nach unten', '↓', i === gesammelt.length - 1, () => verschiebe(i, 1)),
          el('button', { class: 'iconbtn del', type: 'button', title: 'entfernen',
            onclick: () => entferne(i) }, '✕')))));
    }
    if (optionen.beiAenderung) optionen.beiAenderung(gesammelt.length);
  }

  const feld = el('div', { class: 'seiten-feld' },
    el('div', { class: 'scan-knoepfe' },
      el('button', { class: 'btn ghost', type: 'button', onclick: () => kamera.click() },
        iconMit('kamera', ' Fotografieren')),
      el('button', { class: 'btn ghost', type: 'button', onclick: () => auswahl.click() },
        iconMit('beleg', ' Dateien wählen'))),
    kamera, auswahl, liste);

  zeichne();

  return {
    feld,
    seiten: () => gesammelt.map(s => s.datei),
    anzahl: () => gesammelt.length,
    aufraeumen: () => gesammelt.forEach(s => s.url && URL.revokeObjectURL(s.url))
  };
}

/* ===== auth ===== */
/**
 * Anmeldung am Apps-Script-Server.
 *
 * Google verbirgt bei "Ausfuehren als: Ich" die Identitaet des Besuchers –
 * dafuer braucht niemand ein Google-Konto. Die Trennung nach Personen macht
 * deshalb die App selbst: Profil waehlen, Passwort eingeben.
 *
 * Wichtig ist, dass die Pruefung bei JEDEM Serveraufruf stattfindet, nicht nur
 * beim Anmelden. Der Browser laeuft auf fremden Rechnern und laesst sich
 * veraendern; nur der Server darf entscheiden, wessen Daten er herausgibt.
 */
let currentUser = null;
function setCurrentUser(p) { currentUser = p; }

/** Liste der Profile fuer die Anmeldemaske – nur Namen und Farben. */
/**
 * Die Profilliste steckt schon in der Seite - doGet() legt sie hinein. Das
 * spart beim Anmelden einen ganzen Serverbesuch. Nur wenn sie fehlt, etwa
 * bei einer aelteren Bereitstellung, wird gefragt.
 */
async function profilListe() {
  if (Array.isArray(window.__fpProfile)) return window.__fpProfile;
  return rufe('profilListe');
}
/**
 * Meldet an. Der Server liefert den Bestand gleich mit - bisher folgte auf
 * die Anmeldung ein eigener Aufruf nur fuer die Daten.
 *
 * @returns {Promise<object|null>} Der Bestand, falls mitgeliefert.
 */
async function signIn(profilId, passwort) {
  const antwort = await rufe('anmelden', { profilId, passwort });
  setToken(antwort.token);
  currentUser = antwort.profil;
  return antwort.daten || null;
}
async function signOut() {
  const alt = getToken();
  setToken(null);
  currentUser = null;
  // Der Server soll die Sitzung ebenfalls vergessen – sonst bliebe der
  // Schluessel bis zum Ablauf gueltig, auch wenn ihn jemand mitgelesen hat.
  try { await rufe('abmelden', alt); } catch (e) {}
}

/**
 * Stellt eine gemerkte Sitzung wieder her. Ob sie einen Seitenwechsel
 * ueberlebt, ist bei Apps Script nicht garantiert: Die Seite laeuft in einem
 * Rahmen, dessen Adresse Google wechseln kann. Schlaegt es fehl, erscheint
 * einfach wieder die Anmeldemaske.
 */
/**
 * Stellt eine gemerkte Sitzung wieder her - und gibt den Bestand gleich mit.
 *
 * Frueher holte diese Funktion mit holeAlles den gesamten Bestand, behielt
 * davon nur das Profil und warf den Rest weg; unmittelbar danach holte der
 * Start dieselben Daten ein zweites Mal. Jeder dieser Aufrufe ist bei Apps
 * Script eine eigene Ausfuehrung auf Googles Servern, mit eigenem Anlauf -
 * der Start hat also doppelt so lange gedauert wie noetig.
 *
 * @returns {null|{profil: object, daten: object}}
 */
async function initAuth() {
  if (!getToken()) return null;
  try {
    const daten = await rufeAngemeldet('holeAlles');
    currentUser = daten.profil;
    return { profil: currentUser, daten };
  } catch (e) {
    setToken(null);
    currentUser = null;
    return null;
  }
}

/* ===== views/login ===== */
/**
 * Anmeldung in zwei Schritten: Profil waehlen, Passwort eingeben.
 *
 * Die Profilliste ist auch ohne Anmeldung sichtbar – sie enthaelt nur
 * Anzeigenamen und Farben. Alles Weitere gibt der Server erst nach gueltigem
 * Passwort heraus.
 */
function renderLogin(onDone) {
  // Das Geruest der App wird verborgen, nicht geloescht.
  //
  // Frueher stand hier document.body.innerHTML = '' und nach dem Anmelden ein
  // location.reload(). Bei Apps Script laeuft die Seite in einem Rahmen, dessen
  // Adresse Google vergibt – ein Neuladen von innen endet dort in einer leeren
  // weissen Seite. Und weil das Geruest vorher weg war, blieb nichts uebrig.
  // Jetzt bleibt alles stehen und die App zeichnet sich an Ort und Stelle.
  const geruest = document.querySelector('.app');
  if (geruest) geruest.style.display = 'none';
  document.querySelectorAll('.login-wrap').forEach(x => x.remove());

  const karte = el('div', { class: 'login-card' });
  const huelle = el('div', { class: 'login-wrap' }, karte);
  document.body.append(huelle);

  function fertig(daten) {
    huelle.remove();
    if (geruest) geruest.style.display = '';
    onDone(daten || undefined);
  }

  zeigeProfile();

  function kopf() {
    return el('div', { class: 'brand' },
      el('span', { class: 'mark' }, 'FP'),
      el('span', { class: 'brand-name' }, 'Fuhrpark'));
  }

  function zeigeProfile() {
    karte.innerHTML = '';
    karte.append(kopf(), el('div', { class: 'login-sub' }, 'Wer bist du?'));

    const liste = el('div', { class: 'profil-wahl' }, el('div', { class: 'mini' }, 'Lädt …'));
    karte.append(liste);

    profilListe().then(profile => {
      liste.innerHTML = '';
      if (!profile.length) {
        liste.append(el('div', { class: 'login-msg err' },
          'Es gibt noch kein Profil. Lege im Skripteditor eines an:'),
          el('div', { class: 'mini', style: 'font-family:var(--mono);word-break:break-all;margin-top:6px' },
            'legeProfilAn("Name", "mail@…", "Passwort", "verwalter")'));
        return;
      }
      profile.forEach(p => {
        liste.append(el('button', { class: 'profil', onclick: () => zeigePasswort(p) },
          el('span', { class: 'profil-bild', style: 'background:' + (p.farbe || 'var(--a500)') },
            String(p.name || '?').slice(0, 1).toUpperCase()),
          el('span', { class: 'profil-name' }, p.name)));
      });
    }).catch(fehler => {
      liste.innerHTML = '';
      liste.append(el('div', { class: 'login-msg err' }, 'Server antwortet nicht: ' + fehler.message));
    });
  }

  function zeigePasswort(p) {
    karte.innerHTML = '';
    const feld = el('input', { type: 'password', placeholder: 'Passwort',
      autocomplete: 'current-password', 'aria-label': 'Passwort für ' + p.name });
    const meldung = el('div', { class: 'login-msg' });
    const knopf = el('button', { class: 'btn', style: 'width:100%' }, 'Anmelden');

    function absenden() {
      // Frueher passierte hier gar nichts, und eine alte Fehlermeldung blieb
      // stehen - das sah aus wie eine erneute Ablehnung.
      if (!feld.value) {
        meldung.className = 'login-msg err';
        meldung.textContent = 'Bitte das Passwort eingeben.';
        feld.focus();
        return;
      }
      meldung.className = 'login-msg';
      meldung.textContent = '';
      knopf.disabled = true;
      knopf.textContent = 'Prüft …';
      knopf.classList.add('laeuft');
      signIn(p.id, feld.value)
        .then(daten => fertig(daten))
        .catch(fehler => {
          knopf.disabled = false;
          knopf.classList.remove('laeuft');
          knopf.textContent = 'Anmelden';
          meldung.className = 'login-msg err';
          meldung.textContent = fehler.message;
          feld.value = '';
          feld.focus();
        });
    }

    knopf.onclick = absenden;
    feld.onkeydown = e => { if (e.key === 'Enter') absenden(); };

    karte.append(
      el('div', { class: 'profil-gross' },
        el('span', { class: 'profil-bild', style: 'background:' + (p.farbe || 'var(--a500)') },
          String(p.name || '?').slice(0, 1).toUpperCase()),
        el('span', { class: 'profil-name gross' }, p.name)),
      el('div', { class: 'field' }, feld),
      meldung,
      el('div', { class: 'login-btns' }, knopf),
      el('button', { class: 'lite', onclick: zeigeProfile }, '← Anderes Profil'));

    feld.focus();
  }
}

/* ===== views/intervals ===== */
/* Dialog fuer eine Erinnerung. Die Darstellung liegt in Abschnitt views/vehicle.

   Zwei Dinge lassen sich hier einstellen, die vorher festverdrahtet waren:

   WANN faellig. Bisher ging das nur ueber "zuletzt erledigt plus Abstand".
   Fuer den TUEV steht das Datum aber auf der Plakette – es zurueckzurechnen
   ist ein Umweg, der bei jedem verschobenen Termin danebenliegt. Deshalb
   jetzt wahlweise ein fester Termin.

   WIE FRUEH gewarnt wird. Ein Zahnriemen darf ein Vierteljahr vorher
   auftauchen, ein Ölwechsel eine Woche. Eine einzige Zahl fuer alles hiess:
   entweder steht staendig etwas auf der Liste, oder es kommt zu spaet. */

const VORWARNZEITEN = [
  ['', 'Standard (' + VORWARNUNG_STANDARD + ' Tage)'],
  ['7', '1 Woche vorher'],
  ['14', '2 Wochen vorher'],
  ['30', '1 Monat vorher'],
  ['60', '2 Monate vorher'],
  ['90', '3 Monate vorher'],
  ['180', '6 Monate vorher']
];
function intervalModal(iv) {
  const e = iv || { id: uid(), vehicleId: curVeh !== 'all' ? curVeh : S.vehicles[0]?.id };

  // Welche Art der Faelligkeit gilt: fester Termin oder gerechnet.
  const artWahl = el('select', { name: 'art' });
  [['termin', 'Fester Termin'], ['intervall', 'Aus dem letzten Mal berechnen']]
    .forEach(([wert, text]) => {
      const o = el('option', { value: wert }, text);
      if ((e.dueDate ? 'termin' : 'intervall') === wert) o.selected = true;
      artWahl.append(o);
    });

  const gruppeTermin = el('div', { class: 'wahlgruppe' },
    f('Fällig am', 'dueDate', e.dueDate, 'date'),
    el('p', { class: 'dialog-hinweis' },
      'Beim Abhaken wird der Termin um den Abstand unten weitergesetzt. '
      + 'Ohne Abstand gilt er einmalig.'));

  const gruppeIntervall = el('div', { class: 'wahlgruppe' },
    row2(f('Zuletzt am', 'lastDate', e.lastDate, 'date'),
      f('Zuletzt bei km', 'lastKm', e.lastKm, 'number')));

  function umschalten() {
    const termin = artWahl.value === 'termin';
    gruppeTermin.style.display = termin ? '' : 'none';
    gruppeIntervall.style.display = termin ? 'none' : '';
  }
  artWahl.onchange = umschalten;
  setTimeout(umschalten, 0);

  const vorwarn = el('select', { name: 'leadDays' });
  VORWARNZEITEN.forEach(([wert, text]) => {
    const o = el('option', { value: wert }, text);
    if (String(e.leadDays ?? '') === wert) o.selected = true;
    vorwarn.append(o);
  });

  const loeschen = iv ? el('div', { class: 'loeschzeile' },
    el('button', {
      class: 'btn ghost del',
      onclick: () => confirmDel('intervals', e.id, 'Diese Erinnerung löschen?')
    }, 'Erinnerung löschen')) : null;

  modal(iv ? 'Erinnerung bearbeiten' : 'Erinnerung anlegen', [
    vehPick(e.vehicleId),
    f('Wartungsart', 'kind', e.kind, 'text', 'z. B. Ölwechsel, Zahnriemen, TÜV / HU-AU'),

    el('div', { class: 'field' }, el('label', {}, 'Wann ist es fällig?'), artWahl),
    gruppeTermin,
    gruppeIntervall,

    el('div', { class: 'feldgruppe' },
      el('span', { class: 'marke' }, 'Abstand bis zum nächsten Mal'),
      row2(f('alle … Monate', 'intervalMonths', e.intervalMonths, 'number', 'z. B. 12'),
        f('oder alle … km', 'intervalKm', e.intervalKm, 'number', 'z. B. 15000')),
      el('p', { class: 'dialog-hinweis' },
        'Sind beide gefüllt, zählt das, was zuerst eintritt.')),

    el('div', { class: 'field' },
      el('label', {}, 'Erinnern ab'), vorwarn),

    f('Notiz', 'note', e.note, 'text', 'optional'),
    loeschen
  ], async (data) => {
    const grund = ersteMeldung([
      [leer(data.kind), 'Bitte eine Wartungsart angeben.'],
      [zuLang(data.kind, GRENZE.text), 'Die Wartungsart darf höchstens ' + GRENZE.text + ' Zeichen haben.'],
      [istNegativ(data.intervalMonths) || zuGross(data.intervalMonths, GRENZE.monate), 'Der Abstand in Monaten wirkt nicht plausibel.'],
      [istNegativ(data.intervalKm) || zuGross(data.intervalKm, GRENZE.km), 'Der Abstand in Kilometern wirkt nicht plausibel.'],
      [istNegativ(data.lastKm) || zuGross(data.lastKm, GRENZE.km), 'Der letzte km-Stand wirkt nicht plausibel.']
    ]);
    if (grund) { toast(grund); return false; }
    if (data.art === 'termin' && !data.dueDate) {
      toast('Bitte den Termin eintragen.'); return false;
    }
    if (data.art === 'intervall' && !data.intervalMonths && !data.intervalKm) {
      toast('Bitte einen Abstand in Monaten oder Kilometern angeben.'); return false;
    }

    // Was nicht zur gewaehlten Art gehoert, wird geleert – sonst bliebe eine
    // alte Angabe im Datensatz stehen und wuerde spaeter wieder greifen.
    const satz = { ...e, ...data };
    delete satz.art;
    if (data.art === 'termin') { satz.lastDate = ''; satz.lastKm = ''; }
    else satz.dueDate = '';

    await put('intervals', satz);
    aktualisiere();
    toast('Erinnerung gespeichert');
  });
}

/* ===== views/aufgaben ===== */
/* =====================================================================
   Aufgaben abhaken und anlegen

   Eine Aufgabe ist entweder eine wiederkehrende Wartung (intervals) oder
   eine einmalige Frist (deadlines). Beides steht auf dem Dashboard in
   derselben Liste, also muss sich auch beides von dort aus erledigen
   lassen – ohne Umweg ueber die Fahrzeugseite.
   ===================================================================== */

/**
 * Addiert Monate und bleibt im Zielmonat. Das eingebaute setMonth laesst den
 * Tag ueberlaufen – 31. Januar plus ein Monat ergaebe den 3. Maerz.
 */
function plusMonate(isoDatum, monate) {
  const d = parseD(isoDatum);
  if (!d) return isoDatum;
  const tag = d.getDate();
  const ziel = new Date(d.getTime());
  ziel.setDate(1);
  ziel.setMonth(ziel.getMonth() + monate);
  const letzter = new Date(ziel.getFullYear(), ziel.getMonth() + 1, 0).getDate();
  ziel.setDate(Math.min(tag, letzter));
  return ziel.getFullYear() + '-'
    + String(ziel.getMonth() + 1).padStart(2, '0') + '-'
    + String(ziel.getDate()).padStart(2, '0');
}

/** Ereignisart zur Wartungsart – dieselben Begriffe wie im Historie-Dialog. */
function artFuer(kind) {
  const k = (kind || '').toLowerCase();
  if (/t[üu]v|hu|au|unters/.test(k)) return 'TÜV/AU';
  if (/reifen|räder|rad/.test(k)) return 'Reifen';
  if (/versicher|garantie|leasing|vertrag|frist/.test(k)) return 'Sonstiges';
  if (/repar|defekt|schaden|wechsel.*teil/.test(k)) return 'Reparatur';
  return 'Wartung';
}

/**
 * Der Haken hinter einer Aufgabe. Er tut drei Dinge auf einmal, weil sie
 * zusammengehoeren: er schreibt den Eintrag in die Historie, er setzt den
 * naechsten Termin, und er nimmt die Zeile aus der Liste.
 *
 * @param {'intervals'|'deadlines'} art
 * @param {object} satz Der Datensatz hinter der Zeile.
 */
function erledigtModal(art, satz) {
  const fahrzeug = vehById(satz.vehicleId);
  const istFrist = art === 'deadlines';

  let datei = null;
  const chip = el('div', { class: 'filechip' }, 'Keine Datei');
  const belegfeld = el('div', { class: 'field' },
    el('label', {}, 'Beleg (PDF oder Bild, optional)'),
    el('input', {
      type: 'file', accept: 'application/pdf,image/*',
      onchange: ev => {
        datei = ev.target.files[0] || null;
        chip.textContent = datei ? 'Ausgewählt: ' + datei.name : 'Keine Datei';
      }
    }));
  belegfeld.append(chip);

  // Bei einer Frist ist nicht selbstverstaendlich, was danach passiert:
  // manche wiederholen sich jaehrlich, andere sind ein fuer alle Mal erledigt.
  // Statt das zu raten, fragt der Dialog danach.
  const hinweis = el('p', { class: 'dialog-hinweis' },
    'Leer lassen, wenn die Frist damit erledigt ist – sie wird dann entfernt.');

  modal('Erledigt: ' + (satz.kind || 'Aufgabe'), [
    el('p', { class: 'dialog-hinweis' },
      (fahrzeug ? fahrzeug.name || fahrzeug.plate : 'Fahrzeug')
      + ' · wird als Eintrag in der Wartungshistorie gespeichert'),
    f('Erledigt am', 'date', todayISO(), 'date'),
    row2(f('km-Stand', 'km', fahrzeug && fahrzeug.km != null ? fahrzeug.km : '', 'number'),
      f('Kosten (€)', 'cost', '', 'number')),
    f('Werkstatt / Ort', 'shop', '', 'text', 'z. B. Eigenbau oder Werkstattname'),
    belegfeld,
    istFrist ? f('Nächste Fälligkeit', 'next', '', 'date') : null,
    istFrist ? hinweis : null
  ], async (data) => {
    if (!data.date) { toast('Bitte ein Datum angeben.'); return false; }

    let docId = null;
    if (datei) {
      toast('Beleg wird abgelegt …');
      const d = await belegAblegen({
        vehicleId: satz.vehicleId, file: datei,
        title: satz.kind || 'Beleg', date: data.date,
        category: artFuer(satz.kind) === 'TÜV/AU' ? 'HU/AU-Bericht' : 'Rechnung'
      });
      docId = d.id;
    }

    await put('events', {
      id: uid(), vehicleId: satz.vehicleId, date: data.date,
      type: artFuer(satz.kind), desc: satz.kind || 'Erledigt',
      km: data.km, cost: data.cost, shop: data.shop, docId
    });

    if (art === 'intervals') {
      const neu = {
        ...satz, lastDate: data.date,
        lastKm: data.km !== '' && data.km != null ? data.km : satz.lastKm
      };
      // Bei einem fest eingetragenen Termin wird dieser um den Abstand
      // weitergesetzt. Ihn auf "zuletzt erledigt plus Abstand" umzustellen
      // waere falsch: Wer den TUEV zwei Wochen zu spaet macht, hat ihn
      // trotzdem wieder im selben Monat wie zuvor.
      if (satz.dueDate && satz.intervalMonths) {
        neu.dueDate = plusMonate(satz.dueDate, +satz.intervalMonths);
        await put('intervals', neu);
      } else if (satz.dueDate && !satz.intervalMonths) {
        // Einmaliger Termin: Er kehrt nicht wieder. Frueher blieb er mit
        // leerem Datum stehen und galt dann als "Angabe fehlt" - eine
        // erledigte Aufgabe, die dauerhaft wie eine offene aussah. Was
        // passiert ist, steht in der Wartungshistorie.
        await del('intervals', satz.id);
      } else {
        await put('intervals', neu);
      }
    } else if (data.next) {
      await put('deadlines', { ...satz, date: data.next });
    } else {
      await del('deadlines', satz.id);
    }

    aktualisiere();
    toast((satz.kind || 'Aufgabe') + ' erledigt');
  });
}

/**
 * Dialog fuer eine Notiz. Die Darstellung liegt in Abschnitt views/vehicle.

 * der Zettel von der Werkstatt. Ohne Bild ist eine Notiz oft die Haelfte

function noteModal(n) {
  const e = n || { id: uid(), vehicleId: curVeh !== 'all' ? curVeh : S.vehicles[0]?.id, date: todayISO() };
  const vorhandener = e.docId ? S.docs.find(d => d.id === e.docId) : null;

  const zaehler = el('span', { class: 'mini' });
  const sammler = seitenFeld({
    hinweis: vorhandener
      ? 'Neue Seiten ersetzen den bisherigen Beleg.'
      : 'Foto, Angebot, Schriftwechsel – mehrere Seiten werden zu einem PDF.',
    beiAenderung: anz => {
      zaehler.textContent = anz ? anz + (anz === 1 ? ' Seite' : ' Seiten') : '';
    }
  });

  const belegzeile = vorhandener ? el('div', { class: 'lese-beleg' },
    el('span', { class: 'marke' }, 'Hinterlegt'),
    el('button', { class: 'iconbtn', type: 'button',
      onclick: () => openDoc(vorhandener.id) }, vorhandener.name || 'Beleg öffnen')) : null;

  modal(n ? 'Notiz bearbeiten' : 'Notiz hinzufügen', [
    vehPick(e.vehicleId),
    f('Datum', 'date', e.date, 'date'),
    f('Notiz', 'text', e.text, 'textarea'),
    el('div', { class: 'feldgruppe' },
      el('span', { class: 'marke' }, 'Beleg zur Notiz'),
      belegzeile,
      sammler.feld,
      zaehler)
  ], async (data) => {
    if (!data.text || !data.text.trim()) { toast('Bitte einen Text eingeben.'); return false; }

    let docId = e.docId || null;
    if (sammler.anzahl()) {
      toast('Seiten werden zusammengefasst …');
      // Der Name entsteht aus Datum und den ersten Worten der Notiz, damit
      // der Beleg auch in Drive erkennbar bleibt.
      const anfang = data.text.trim().split(/\s+/).slice(0, 6).join(' ');
      const pdf = await baueBelegPdf(sammler.seiten(),
        belegName({ date: data.date, title: anfang }, 'Notiz'));
      const dok = await belegAblegen({
        vehicleId: data.vehicleId, file: pdf,
        title: anfang || 'Notiz', date: data.date, category: 'Sonstiges'
      });
      docId = dok.id;
    }

    await put('notes', { ...e, ...data, docId });
    sammler.aufraeumen();
    aktualisiere();
    toast('Notiz gespeichert');
  });
}

    if (neu && vorlageOeffnen) {
      setCurVeh(gespeichert.id);

   bei einer Kontrolle, beim Verkauf, nach einem Unfall. Sie stehen deshalb
   oben und nicht irgendwo in einer nach Datum sortierten Liste. */

];

const ALTE_KATEGORIEN = {
  'Versicherung': 'Versicherungsnachweis',

};

function kategorieVon(d) {

}
function vDocs(m) {

  if (!alle.length) {
    m.append(el('div', { class: 'card empty' },
      'Noch keine Dokumente. Hier gehören Fahrzeugschein, Versicherungsnachweis, '
      + 'HU-Bericht, Kaufvertrag und alles andere hin, was man im Ernstfall '
      + 'schnell zur Hand haben will.',
      el('div', {}, el('button', { class: 'btn', onclick: () => {
        if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; }
        docModal();
      } }, '+ Erstes Dokument hochladen'))));
    return;
  }

  // Nach Fahrzeug gruppiert. Bei mehreren Fahrzeugen ist die erste Frage
  // immer "zu welchem Auto", nicht "von wann".
  const fahrzeuge = curVeh === 'all' ? S.vehicles : S.vehicles.filter(v => v.id === curVeh);
  fahrzeuge.forEach(v => {
    const meine = alle.filter(d => d.vehicleId === v.id);
    if (!meine.length) return;
    m.append(fahrzeugAblage(v, meine));
  });

  // Dokumente ohne gueltiges Fahrzeug gingen sonst verloren.
  const waisen = alle.filter(d => !vehById(d.vehicleId));
  if (waisen.length) {
    m.append(el('section', { class: 'block' },
      el('h2', {}, 'Ohne Fahrzeug'),
      el('div', { class: 'dok-karte' }, ...waisen.map(dokZeile))));
  }
}

function fahrzeugAblage(v, meine) {
  const art = fahrzeugArt(v);
  const blk = el('section', { class: 'block' });

  blk.append(el('div', { class: 'abschnitt-kopf' },
    el('h2', {},
      el('span', { class: 'art-zeichen', title: art.name }, icon(art.zeichen, 18)),
      v.name || v.plate || 'Fahrzeug'),
    el('button', { class: 'btn ghost sm',
      onclick: () => docModal(null, v.id) }, '+ Dokument')));

  const karte = el('div', { class: 'dok-karte' });

  // Wichtige Papiere zuerst, in fester Reihenfolge – so steht der
  // Fahrzeugschein immer an derselben Stelle.
  const papiere = PAPIERE
    .map(k => ({ k, treffer: meine.filter(d => kategorieVon(d) === k) }))
    .filter(x => x.treffer.length);

  if (papiere.length) {
    karte.append(el('div', { class: 'dok-kopf' }, 'Wichtige Papiere'));
    papiere.forEach(({ k, treffer }) => {
      treffer.sort((a, b) => (parseD(b.date) || 0) - (parseD(a.date) || 0));
      treffer.forEach((d, i) => karte.append(dokZeile(d, i === 0 ? k : '')));
    });
  }

  const rest = meine.filter(d => !PAPIERE.includes(kategorieVon(d)))
    .sort((a, b) => (parseD(b.date) || 0) - (parseD(a.date) || 0));
  if (rest.length) {
    karte.append(el('div', { class: 'dok-kopf' }, 'Weitere Unterlagen'));
    rest.forEach(d => karte.append(dokZeile(d)));
  }

  // Fehlt ein wichtiges Papier, ist das eine Information für sich.
  const fehlend = PAPIERE.filter(k =>
    !meine.some(d => kategorieVon(d) === k) && k !== 'Kaufvertrag');
  if (fehlend.length) {
    karte.append(el('div', { class: 'dok-fehlt' },
      el('span', {}, 'Nicht hinterlegt: ' + fehlend.join(' · ')),
      el('button', { class: 'iconbtn', onclick: () => docModal(null, v.id, fehlend[0]) },
        'Ergänzen')));
  }

  blk.append(karte);
  return blk;
}

/* Stand der KI-Auswertung, wie er in der Zeile erscheint. "fertig" und

const KI_TEXT = { ausstehend: 'KI: noch nicht ausgelesen', fehlgeschlagen: 'KI: Auswertung fehlgeschlagen' };

function docModal(dd, vehicleId, kategorie) {

  const chip = el('div', { class: 'filechip' }, e.name ? ('Aktuell: ' + e.name) : 'Keine Datei');

        KATEGORIEN.concat(
          // Eine alte Bezeichnung, die es in der Liste nicht mehr gibt, bleibt
          // waehlbar – sonst aendert ein Speichern sie stillschweigend.
          (e.category && !KATEGORIEN.includes(kategorieVon(e))) ? [e.category] : []))),
    f('Titel', 'title', e.title, 'text', 'z. B. Zulassungsbescheinigung Teil I'),
    fileField,
    f('Notiz', 'note', e.note, 'textarea'),
    // Auch aeltere Belege lassen sich nachtraeglich auslesen - die Datei
    // liegt ja schon in Drive.
    (dd && dd.driveId) ? el('div', {},
      el('button', { class: 'btn ghost sm', type: 'button',
        onclick: () => erneutAuslesen(dd.id) }, iconMit('lupe', ' Gespeicherten Beleg mit KI auslesen'))) : null,
    dd ? el('div', { class: 'loeschzeile' },
      el('button', { class: 'btn ghost del',
        onclick: () => confirmDel('docs', e.id, 'Dieses Dokument löschen?') },
        'Dokument löschen')) : null
  ], async (data) => {
    const rec = { ...e, ...data };
    if (!pickedFile && !rec.driveId) { toast('Bitte eine Datei auswählen.'); return false; }

    if (pickedFile) {
      // Neue Datei: erst ablegen, der Server liefert den fertigen Eintrag
      // mitsamt Drive-Kennung zurueck.
      toast('Beleg wird abgelegt …');
      const dok = await belegAblegen({
        vehicleId: rec.vehicleId, file: pickedFile,
        title: rec.title, date: rec.date, category: rec.category
      });
      // Die uebrigen Eingaben aus dem Dialog nachtragen

                          category: rec.category, note: rec.note });
    } else {
      await put('docs', rec);
    }
    aktualisiere();
    toast('Dokument gespeichert');
  });
}

/**
 * Oeffnet einen Beleg – im Fenster der App, nicht in einem neuen Tab.
 *
 * Der frueher benutzte Weg, window.open() auf eine blob-Adresse, geht bei
 * Apps Script nicht: Die Seite laeuft dort in einem Rahmen mit
 * eingeschraenkten Rechten. Neue Fenster und Downloads sind darin gesperrt,
 * und zwar lautlos – der Beleg waere einfach nicht aufgegangen.
 *
 * Deshalb wird hier alles im Dokument selbst gezeigt: Bilder unmittelbar,
 * PDF ueber pdf.js auf eine Zeichenflaeche. Damit braucht es weder ein
 * zweites Fenster noch den PDF-Betrachter des Browsers.
 */
async function openDoc(id) {
  const d = await get('docs', id);
  if (!d) { toast('Dokument nicht gefunden.'); return; }

  toast('Beleg wird geladen …');
  let blob;
  try { blob = await datei(id); }
  catch (e) { toast('Beleg konnte nicht geladen werden: ' + (e.message || 'Fehler')); return; }

  const buehne = el('div', { class: 'beleg-buehne' },
    el('div', { class: 'mini' }, 'Wird angezeigt …'));
  const titel = d.title || d.name || 'Beleg';
  modal(titel, [buehne], async () => {}, { nurSchliessen: true });

  const art = blob.type || d.mime || '';
  const url = URL.createObjectURL(blob);
  // Der Dialog kann geschlossen werden, bevor das Bild fertig ist.
  setTimeout(() => URL.revokeObjectURL(url), 300000);

  try {
    if (/^image\//.test(art)) {
      buehne.innerHTML = '';
      buehne.append(el('img', { src: url, alt: titel, class: 'beleg-bild' }));
    } else if (/pdf/.test(art)) {
      await zeigePdf(blob, buehne);
    } else {
      buehne.innerHTML = '';
      buehne.append(el('div', { class: 'mini' },
        'Diese Dateiart kann die App nicht anzeigen (' + (art || 'unbekannt') + '). '
        + 'Die Datei liegt in deinem Drive-Belegordner.'));
    }
  } catch (e) {
    buehne.innerHTML = '';
    buehne.append(el('div', { class: 'mini' },
      'Anzeigen nicht möglich: ' + (e.message || 'Fehler')
      + '. Die Datei liegt in deinem Drive-Belegordner.'));
  }
}

/**
 * Zeichnet die Seiten eines PDF – ohne den Betrachter des Browsers.
 *
 * Mit Zeitgrenze: pdf.js zeichnet im Takt des Bildaufbaus. Liegt das Fenster
 * im Hintergrund oder ist die Datei beschaedigt, kommt der Takt nie – ohne
 * Grenze stuende hier auf Dauer "Wird angezeigt …" und niemand wuesste,
 * woran es liegt.
 */
async function zeigePdf(blob, buehne) {
  const grenze = (versprechen, ms, was) => Promise.race([
    versprechen,
    new Promise((_, ab) => setTimeout(() => ab(new Error(was + ' dauert zu lange')), ms))
  ]);

  const pdf = await grenze(ladePdf(await blob.arrayBuffer()), 20000, 'Das Lesen');
  buehne.innerHTML = '';
  const seiten = Math.min(pdf.numPages, 10);
  for (let i = 1; i <= seiten; i++) {
    const seite = await grenze(pdf.getPage(i), 15000, 'Die Seite');
    const masse = seite.getViewport({ scale: 2 });
    const flaeche = document.createElement('canvas');
    flaeche.className = 'beleg-seite';
    flaeche.width = masse.width;
    flaeche.height = masse.height;
    buehne.append(flaeche);
    await grenze(
      seite.render({ canvasContext: flaeche.getContext('2d'), viewport: masse }).promise,
      15000, 'Das Zeichnen');
  }
  if (pdf.numPages > seiten) {
    buehne.append(el('div', { class: 'mini' },
      'Weitere ' + (pdf.numPages - seiten) + ' Seiten nicht angezeigt.'));
  }
}

/* ===== views/werkstaetten ===== */
/* =====================================================================
   Werkstätten

   Die Werkstatt stand bisher als freier Text in jedem Eintrag. Damit liess
   sich weder nachsehen, was eine Werkstatt insgesamt gekostet hat, noch
   festhalten, dass die eine bei Bremsen gut und bei Elektrik schlecht ist.

   Der Name bleibt trotzdem der Schluessel: Alte Eintraege haben keine
   Kennung, und sie nachtraeglich zuzuordnen waere Arbeit ohne Gewinn. Die
   Uebersicht gruppiert deshalb ueber den Namen, und der Bestand haelt nur
   das, was dazukommt – Ort, Telefon, Erfahrungen.
   ===================================================================== */

const schluessel = name => String(name || '').trim().toLowerCase();

/** Alle in Einträgen genannten Werkstätten, mit Zahlen und hinterlegter Notiz. */
function werkstattUebersicht() {
  const nachName = new Map();

  S.events.forEach(e => {
    if (!e.shop || !String(e.shop).trim()) return;
    const k = schluessel(e.shop);
    if (!nachName.has(k)) {
      nachName.set(k, { name: String(e.shop).trim(), besuche: [], summe: 0 });
    }
    const w = nachName.get(k);
    w.besuche.push(e);
    w.summe += (+e.cost || 0);
  });

  // Werkstaetten, zu denen es nur einen Stammsatz gibt, gehoeren auch dazu.
  (S.shops || []).forEach(s => {
    const k = schluessel(s.name);
    if (!nachName.has(k)) nachName.set(k, { name: s.name, besuche: [], summe: 0 });
  });

  return [...nachName.values()].map(w => ({
    ...w,
    satz: (S.shops || []).find(s => schluessel(s.name) === schluessel(w.name)) || null,
    letzter: w.besuche.map(e => parseD(e.date)).filter(Boolean)
      .sort((a, b) => b - a)[0] || null
  })).sort((a, b) => b.summe - a.summe);
}

/** Namen für das Vorschlagsfeld im Eintragsdialog. */
function werkstattNamen() {
  return werkstattUebersicht().map(w => w.name);
}
function werkstattModal(vorhanden, nameVorschlag) {
  const e = vorhanden || { id: uid(), name: nameVorschlag || '' };

        'Diese Werkstatt löschen? Die Einträge bleiben erhalten.') },

  modal(vorhanden ? 'Werkstatt bearbeiten' : 'Werkstatt anlegen', [

      'Der Name verbindet die Werkstatt mit den Einträgen. Schreibt man ihn '
      + 'anders als dort, zählt sie als zweite Werkstatt.'),

  ], async (data) => {

/** Der Abschnitt für die Einstellungen oder eine eigene Ansicht. */
function werkstattBlock() {
  const blk = el('section', { class: 'block' });
  blk.append(el('div', { class: 'abschnitt-kopf' },

function werkstattKarte(w) {

  return el('article', { class: 'wst-karte' },
    el('div', { class: 'wst-kopf' },
      el('div', { class: 'wst-titel' },
        el('h3', {}, w.name),
        el('span', { class: 'wst-sub' },
          [w.satz && w.satz.ort, w.satz && w.satz.phone].filter(Boolean).join(' · ')
          || (w.besuche.length ? 'keine Anschrift hinterlegt' : ''))),
      el('button', { class: 'iconbtn',
        onclick: () => werkstattModal(w.satz, w.name) },
        w.satz ? 'Bearbeiten' : 'Ergänzen')),

    el('div', { class: 'sd-raster' },
      el('div', { class: 'sd-feld' },
        el('span', { class: 'sd-label' }, 'Besuche'),
        el('span', { class: 'sd-wert' }, String(w.besuche.length))),
      el('div', { class: 'sd-feld' },
        el('span', { class: 'sd-label' }, 'Summe'),
        el('span', { class: 'sd-wert' }, eur(w.summe))),
      el('div', { class: 'sd-feld' },
        el('span', { class: 'sd-label' }, 'Zuletzt'),
        el('span', { class: 'sd-wert' },
          w.letzter ? fmtD(w.letzter.toISOString().slice(0, 10)) : '–'))),

    w.satz && w.satz.note
      ? el('div', { class: 'wst-notiz' }, w.satz.note) : null,

    letzte.length ? el('div', { class: 'wst-besuche' },
      ...letzte.map(e => {
        const v = vehById(e.vehicleId);
        return el('div', { class: 'wst-zeile' },
          el('span', { class: 'wst-datum' }, fmtD(e.date)),
          el('span', { class: 'wst-was' },
            [e.desc || e.type, v && (v.name || v.plate)].filter(Boolean).join(' · ')),
          e.cost ? el('span', { class: 'wst-betrag' }, eur(e.cost)) : el('span'));
      })) : null);
}

/* ===== views/suche ===== */
/**
