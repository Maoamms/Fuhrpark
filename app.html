        [td(v.name), td(eur(jj), 'num'), td(eur(lf), 'num'), td(eur(jj + lf), 'num'), td(eur(gesamt), 'num')],
        5, () => fahrzeugDetails(v, jahr)));
    });
    b2.append(t.wrap); m.append(b2);
  }

  // Nach Art: beantwortet Fragen wie "was hat der Ausbau bisher gekostet".
  // Eine Summe ueber alles sagt das nicht, und die Jahresliste auch nicht.
  const nachArt = new Map();
  evs.forEach(e => {
    if (!+e.cost) return;
    const art = e.type || 'Ohne Art';
    if (!nachArt.has(art)) nachArt.set(art, { summe: 0, liste: [] });
    const a = nachArt.get(art);
    a.summe += +e.cost;
    a.liste.push(e);
  });
  if (nachArt.size > 1) {
    const b4 = el('section', { class: 'block' }, el('h2', {}, 'Nach Art'));
    const t = table(['Art', 'Einträge', 'Kosten']);
    [...nachArt.entries()].sort((a, b) => b[1].summe - a[1].summe)
      .forEach(([art, a]) => t.tBody.append(zeileAuf('art:' + art,
        [tdEl(el('span', { class: 'tag ' + tagKlasse(art) }, art)),
          td(String(a.liste.length), 'num'), td(eur(a.summe), 'num')],
        3, () => belegListe(a.liste))));
    b4.append(t.wrap); m.append(b4);
  }

  // Kosten je Jahr aus dem Verlauf – aufklappbar bis zur einzelnen Rechnung
  const jahre = {};
  evs.forEach(e => { const d = parseD(e.date); if (d) jahre[d.getFullYear()] = (jahre[d.getFullYear()] || 0) + (+e.cost || 0); });
  const jahresListe = Object.keys(jahre).sort((a, b) => b - a);
  if (jahresListe.length > 1) {
    const b3 = el('section', { class: 'block' }, el('h2', {}, 'Werkstattkosten je Jahr'));
    const t = table(['Jahr', 'Kosten']);
    jahresListe.forEach(j => t.tBody.append(zeileAuf('jahr:' + j,
      [td(j, 'num'), td(eur(jahre[j]), 'num')], 2,
      () => belegListe(evs.filter(e => {
        const d = parseD(e.date); return d && String(d.getFullYear()) === String(j);
      })))));
    b3.append(t.wrap); m.append(b3);
  }
}

/** Dieselben Farben wie die Marken in der Wartungshistorie. */
function tagKlasse(art) {
  return {
    'Wartung': 'a-wartung', 'Reparatur': 'a-reparatur', 'TÜV/AU': 'a-tuev',
    'Reifen': 'a-reifen', 'Ausbau': 'a-ausbau'
  }[art] || 'a-sonst';
}

/* Eine Tabellenzeile, die sich aufklappt. Der aufgeklappte Teil steht als
   eigene Zeile darunter und ueber die volle Breite – ein eingeklemmtes Feld
   in einer Spalte waere nicht zu lesen. */
function zeileAuf(schluessel, zellen, spalten, inhaltFn) {
  const auf = offen === schluessel;
  const tr = el('tr', {
    class: 'anklickbar' + (auf ? ' auf' : ''),
    title: auf ? 'Zuklappen' : 'Aufklappen',
    onclick: () => { offen = auf ? null : schluessel; triggerRender(); }
  }, ...zellen);
  if (!auf) return tr;

  const raus = document.createDocumentFragment();
  raus.append(tr, el('tr', { class: 'auf-inhalt' },
    el('td', { colspan: String(spalten) }, inhaltFn())));
  return raus;
}

/** Was ein Fahrzeug gekostet hat: Rechnungen und laufende Posten. */
function fahrzeugDetails(v, jahr) {
  const ve = S.events.filter(e => e.vehicleId === v.id && +e.cost)
    .filter(e => { const d = parseD(e.date); return d && d.getFullYear() === jahr; });
  const lf = S.fixcosts.filter(fc => fc.vehicleId === v.id);

  const teil = (titel, zeilen) => zeilen.length
    ? el('div', { class: 'det-teil' }, el('span', { class: 'marke' }, titel),
      el('div', { class: 'det-liste' }, ...zeilen))
    : null;

  return el('div', { class: 'det-innen' },
    teil('Werkstatt ' + jahr, belegZeilen(ve)),
    teil('Laufende Posten', lf.map(fc => el('button', {
      class: 'det-zeile anklickbar', type: 'button',
      onclick: ev => { ev.stopPropagation(); fixcostModal(fc); }
    },
      el('span', { class: 'det-links' }, fc.kind),
      el('span', { class: 'det-mitte' }, eur(fc.amount) + ' ' + (fc.interval || '')),
      el('span', { class: 'det-rechts' }, eur(yearlyAmount(fc)))))),
    (!ve.length && !lf.length)
      ? el('div', { class: 'det-leer' }, 'Für dieses Fahrzeug ist nichts erfasst.') : null);
}

function belegListe(liste) {
  const zeilen = belegZeilen(liste);
  return el('div', { class: 'det-innen' },
    zeilen.length ? el('div', { class: 'det-liste' }, ...zeilen)
      : el('div', { class: 'det-leer' }, 'Keine Rechnungen erfasst.'));
}

/** Einzelne Rechnungen – ein Klick oeffnet den Eintrag zum Nachsehen. */
function belegZeilen(liste) {
  return liste.filter(e => +e.cost)
    .sort((a, b) => (parseD(b.date) || 0) - (parseD(a.date) || 0))
    .map(e => {
      const v = vehById(e.vehicleId);
      return el('button', {
        class: 'det-zeile anklickbar', type: 'button',
        title: 'Eintrag ansehen',
        onclick: ev => { ev.stopPropagation(); eventAnsicht(e); }
      },
        el('span', { class: 'det-links' }, fmtD(e.date)),
        el('span', { class: 'det-mitte' },
          [e.desc || e.type, v && (v.name || v.plate), e.shop].filter(Boolean).join(' · ')),
        el('span', { class: 'det-rechts' }, eur(e.cost)));
    });
}

/* Welche Kachel gerade aufgeklappt ist. Das ist eine Frage der Ansicht,
   nicht der Daten – deshalb lebt es hier im Modul. */
let offen = null;

// Die Gesamtsumme bekommt die Sandflaeche – dieselbe Kachel wie die
// Kostenkachel auf dem Dashboard, damit dieselbe Zahl gleich aussieht.
const kachel = (schluessel, wert, label, hervor) => el('button', {

/** Der aufgeklappte Teil unter den Kacheln – was die Summe ausmacht. */
const KACHELN = ['gesamt', 'werkstatt', 'laufend', 'seitbeginn'];

function detailFeld(jahr, jahrEvents, alleEvents, werkstattJahr, laufendJahr) {
  // Aufgeklappte Tabellenzeilen benutzen denselben Merker, gehoeren aber
  // nicht hierher – sonst stuende hier ein leerer Kasten.
  if (!KACHELN.includes(offen)) return null;
  const laufend = forVeh(S.fixcosts);

  const zeile = (links, mitte, rechts) => el('div', { class: 'det-zeile' },
    el('span', { class: 'det-links' }, links),
    el('span', { class: 'det-mitte' }, mitte || ''),
    el('span', { class: 'det-rechts' }, rechts));

  const nachDatum = liste => liste.slice()
    .sort((a, b) => (parseD(b.date) || 0) - (parseD(a.date) || 0));

  let titel = '';
  let zeilen = [];
  let fuss = null;

  if (offen === 'gesamt') {
    titel = 'Woraus sich die Summe ergibt';
    zeilen = [
      zeile('Werkstatt ' + jahr, jahrEvents.length + (jahrEvents.length === 1 ? ' Eintrag' : ' Einträge'), eur(werkstattJahr)),
      zeile('Laufende Posten', laufend.length + (laufend.length === 1 ? ' Posten' : ' Posten'), eur(laufendJahr))
    ];
    fuss = zeile('Zusammen', '', eur(werkstattJahr + laufendJahr));
  } else if (offen === 'werkstatt' || offen === 'seitbeginn') {
    const liste = offen === 'werkstatt' ? jahrEvents : alleEvents;
    titel = offen === 'werkstatt' ? 'Werkstattkosten ' + jahr : 'Alle Werkstattkosten';
    zeilen = belegZeilen(liste);
    if (!zeilen.length) zeilen = [zeile('–', 'Noch keine Werkstattkosten erfasst.', '')];
  } else if (offen === 'laufend') {
    titel = 'Laufende Posten, auf ein Jahr gerechnet';
    zeilen = laufend.slice()
      .sort((a, b) => yearlyAmount(b) - yearlyAmount(a))
      .map(fc => {
        const v = vehById(fc.vehicleId);
        return el('button', { class: 'det-zeile anklickbar', type: 'button',
          onclick: () => fixcostModal(fc) },
          el('span', { class: 'det-links' }, fc.kind),
          el('span', { class: 'det-mitte' },
            [v && (v.name || v.plate), eur(fc.amount) + ' ' + (fc.interval || '')].filter(Boolean).join(' · ')),
          el('span', { class: 'det-rechts' }, eur(yearlyAmount(fc))));
      });
    if (!zeilen.length) zeilen = [zeile('–', 'Noch keine laufenden Posten erfasst.', '')];
  }

  return el('div', { class: 'det-feld' },
    el('span', { class: 'marke' }, titel),
    el('div', { class: 'det-liste' }, ...zeilen),
    fuss ? el('div', { class: 'det-summe' }, fuss) : null);
}

/**
 * Der gesamte Bestand als Text – ohne die Belege selbst.
 *
 * Ein Download ueber ein <a download> reicht hier nicht: Bei Apps Script
 * laeuft die Seite in einem Rahmen mit eingeschraenkten Rechten, in dem
 * Downloads gesperrt sind. Und zwar lautlos – frueher meldete die App
 * "Sicherung heruntergeladen", und es lag nichts im Ordner.
 *
 * Deshalb steht der Text hier sichtbar da. Der Knopf zum Herunterladen wird
 * trotzdem angeboten; wo er geht, geht er.
 */
function exportieren() {
  const daten = {
    erzeugt: new Date().toISOString(),
    profil: currentUser ? currentUser.name : null,
    hinweis: 'Belege sind nicht enthalten – die liegen im Drive-Ordner.',
    daten: {}
  };
  Object.keys(S).forEach(s => { daten.daten[s] = S[s]; });
  const text = JSON.stringify(daten, null, 2);
  const dateiname = 'fuhrpark-sicherung-' + todayISO() + '.json';

  const feld = el('textarea', { class: 'sicherung-feld', rows: '12', readonly: 'readonly' });
  feld.value = text;

  const meldung = el('div', { class: 'mini' },
    Math.round(text.length / 1024) + ' KB · alles markieren mit Strg+A, dann Strg+C');

  const kopieren = el('button', { class: 'btn ghost', onclick: async () => {
    feld.focus();
    feld.select();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) { try { ok = document.execCommand('copy'); } catch (e2) {} }
    meldung.textContent = ok ? 'In die Zwischenablage kopiert.'
      : 'Kopieren hat der Browser nicht erlaubt – bitte Strg+A, Strg+C.';
  } }, 'Kopieren');

  const laden = el('button', { class: 'btn', onclick: () => {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: dateiname });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    meldung.textContent = 'Wenn nichts im Download-Ordner liegt, hat der Rahmen '
      + 'es gesperrt – dann den Text oben kopieren.';
  } }, 'Als Datei speichern');

  modal('Sicherung', [
    el('p', { class: 'dialog-hinweis' },
      'Fahrzeuge, Termine, Einträge, Kosten und Notizen als Text. Die Belege '
      + 'selbst sind nicht dabei – die liegen in deinem Drive-Ordner.'),
    feld, meldung
  ], async () => {}, { knoepfe: [kopieren, laden] });

  setTimeout(() => { feld.focus(); feld.select(); }, 60);
}

/* ===== scan ===== */
/* Ein Beleg, ein Vorgang: Datei waehlen -> auslesen -> pruefen -> es entstehen
   in einem Rutsch Dokument, Ereignis, Wartungstermin und aktueller km-Stand. */

const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');

const MONATE = ['januar','februar','märz','april','mai','juni',
                'juli','august','september','oktober','november','dezember'];

/**
 * Macht aus einer Terminangabe ein vollstaendiges Datum.
 *
 * Auf der TUEV-Plakette steht nur Monat und Jahr - im Bericht als
 * "Nächste HU: Januar 2027". Unser Schema verlangt aber einen Tag, und die
 * Erkennung soll ausdruecklich nichts raten. Also liess sie das Feld weg,
 * und die App bekam gar keinen Termin.
 *
 * Fehlt der Tag, wird der LETZTE des Monats genommen: Bis dahin muss das
 * Fahrzeug vorgefuehrt sein, frueher ist erlaubt.
 */
function vollesDatum(wert) {
  const t = String(wert || '').trim();
  if (!t) return '';

  const letzterTag = (jahr, monat) => {
    const d = new Date(jahr, monat, 0);          // Tag 0 = letzter des Vormonats
    return jahr + '-' + String(monat).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');

  m = t.match(/^(\d{4})[-\/.](\d{1,2})$/);                    // 2027-01
  if (m) return letzterTag(+m[1], +m[2]);

  m = t.match(/^(\d{1,2})[-\/.](\d{4})$/);                    // 01/2027
  if (m) return letzterTag(+m[2], +m[1]);

  m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);             // 23.01.2025
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');

  m = t.toLowerCase().match(/^([a-zäöü]+)\s+(\d{4})$/);        // Januar 2027
  if (m) {
    const i = MONATE.indexOf(m[1]);
    if (i >= 0) return letzterTag(+m[2], i + 1);
  }
  return t;
}
/* "hu" steckt auch in "Huber" und "Schuh" - deshalb nur als eigenes Wort
   oder in der Paarung HU/AU. Sonst haelt die App die Rechnung vom
   Abschleppdienst Huber fuer eine Hauptuntersuchung.

   Hier stand zuvor ein echtes Steuerzeichen statt der Wortgrenze - aus
   einem misslungenen Bearbeitungsschritt. Die Pruefung traf damit nie
   auf "HU", nur noch auf "TUEV". */
const istTuev = k => /t[üu]v|hauptunters|\bhu\s*[/-]?\s*au\b|\bhu\b/i.test(k || '');

/**
 * Sucht den vorhandenen Termin zu einer erkannten Wartungsart.
 *
 * Ein Namensvergleich allein reicht nicht: Der Termin heisst "TÜV / HU-AU",
 * auf dem Bericht steht "Hauptuntersuchung", und die KI schreibt mal das
 * eine, mal das andere. Ohne diese Bruecke entstand ein zweiter Termin
 * daneben, waehrend der eigentliche leer blieb - genau der Fall, in dem das
 * Dashboard weiter "Datum fehlt noch" zeigte.
 */
function passenderTermin(vehicleId, art) {
  const meine = S.intervals.filter(iv => iv.vehicleId === vehicleId);
  const genau = meine.find(iv => norm(iv.kind) === norm(art));
  if (genau) return genau;
  if (istTuev(art)) return meine.find(iv => istTuev(iv.kind));
  // Teilwort in beide Richtungen: "Ölwechsel" trifft "Ölwechsel + Filter".
  const a = norm(art);
  return meine.find(iv => {
    const b = norm(iv.kind);
    return b && a && (b.includes(a) || a.includes(b));
  });
}

// Welches Fahrzeug ist gemeint? Kennzeichen schlaegt Modellhinweis, sonst das
// aktuell gewaehlte bzw. das einzige vorhandene.
function fahrzeugRaten(r, ersatzId) {
  if (r.plate) {
    const p = norm(r.plate);
    const treffer = S.vehicles.find(v => v.plate && norm(v.plate) === p);
    if (treffer) return treffer;
  }
  if (r.vehicleHint) {
    const h = norm(r.vehicleHint);
    const treffer = S.vehicles.find(v => (v.model && norm(v.model).includes(h)) || (v.name && h.includes(norm(v.name))));
    if (treffer) return treffer;
  }
  // Der Beleg ist schon einem Fahrzeug zugeordnet - das gilt, solange das
  // Kennzeichen nichts anderes sagt.
  if (ersatzId && vehById(ersatzId)) return vehById(ersatzId);
  if (curVeh !== 'all') return S.vehicles.find(v => v.id === curVeh) || S.vehicles[0];
  return S.vehicles[0];
}

/**
 * Beleg scannen: Seiten sammeln, ordnen, zu einem PDF machen, SPEICHERN -
 * und erst danach auslesen lassen.
 *
 * Eine Werkstattrechnung hat selten nur eine Seite. Bisher nahm die App genau
 * eine Datei entgegen; wer drei Seiten hatte, bekam drei Eintraege in der
 * Ablage und wusste spaeter nicht mehr, welche zusammengehoeren. Jetzt
 * entsteht ein PDF mit sprechendem Namen.
 *
 * Gespeichert wird vor der Erkennung: Frueher lag der Scan bis zum Klick auf
 * "Eintragen" nur im Browser. Wer den Dialog schloss oder dessen Handy die
 * Seite im Hintergrund beendete, hatte nichts. Die Erkennung ist jetzt ein
 * nachgelagerter Schritt - faellt sie aus, bleibt der Beleg trotzdem da.
 */
async function belegScannen() {
  if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; }
  // Ohne Schluessel wird trotzdem gescannt und gespeichert - nur das
  // Auslesen entfaellt, die Angaben traegt man dann selbst ein.
  const mitKI = await verfuegbar();

  const zaehler = el('span', { class: 'mini' });
  const fahrzeugFeld = vehPick(curVeh !== 'all' ? curVeh : S.vehicles[0].id);

  // Der Knopf muss VOR der Seitensammlung entstehen: Die ruft beim Aufbau
  // sofort beiAenderung() auf, und ein const, das noch nicht zugewiesen ist,
  // wirft beim Zugriff. In einer async-Funktion faellt das lautlos aus -
  // der Knopf "Beleg scannen" tat dann schlicht nichts.
  const weiter = el('button', { class: 'btn', disabled: 'disabled', onclick: async () => {
    weiter.disabled = true;
    // Der Dialog mit den gesammelten Seiten wird gleich durch die
    // Fortschrittsanzeige ersetzt. Scheitert etwas VOR dem Speichern, kommt
    // er unveraendert zurueck - die Seiten muessen nicht neu fotografiert
    // werden.
    const mod = $('#modal');
    const vorher = [...mod.childNodes];
    try {
      await verarbeiten(sammler.seiten(), fahrzeugFeld.querySelector('select').value, mitKI);
    } catch (e) {
      mod.innerHTML = '';
      mod.append(...vorher);
      $('#overlay').classList.add('show');
      weiter.disabled = false;
      toast(e.message || 'Fehler');
    }
  } }, mitKI ? 'Speichern & auslesen' : 'Speichern');

  const sammler = seitenFeld({
    hinweis: 'Noch keine Seite. Fotografiere den Beleg oder wähle Dateien – '
      + 'mehrere Seiten werden zu einem PDF zusammengefasst.',
    beiAenderung: n => {
      weiter.disabled = !n;
      zaehler.textContent = n ? n + (n === 1 ? ' Seite' : ' Seiten') : '';
    }
  });

  modal('Beleg scannen', [
    fahrzeugFeld,
    sammler.feld,
    el('p', { class: 'dialog-hinweis' },
      'Die Reihenfolge der Seiten bestimmt die Reihenfolge im PDF. Der Beleg wird '
      + 'zuerst in der Ablage gespeichert. '
      + (mitKI ? 'Danach liest die KI alle Seiten aus – du prüfst das Ergebnis, bevor etwas eingetragen wird.'
               : 'Für das automatische Auslesen ist kein Schlüssel hinterlegt – die Angaben trägst du selbst ein.'))
  ], async () => {}, { knoepfe: [zaehler,
    el('button', { class: 'btn ghost', onclick: closeModal }, 'Abbrechen'), weiter] });
}

/**
 * PDF bauen, speichern, dann auslesen.
 *
 * Wirft nur, solange noch nichts gespeichert ist - dann bekommt der Aufrufer
 * die Seiten zurueck. Ab dem Speichern geht nichts mehr verloren: Ein
 * Fehler beim Auslesen fuehrt zum Pruefdialog mit leeren Feldern und einem
 * Hinweis, nicht zu "Scan fehlgeschlagen".
 */
async function verarbeiten(seiten, vehicleId, mitKI) {
  ladeAnzeige('Seiten werden zusammengefasst …');
  let pdf;
  try {
    pdf = await baueBelegPdf(seiten, belegName({ date: todayISO() }, 'Beleg'), t => ladeAnzeige(t));
  } catch (e) {
    throw new Error('PDF konnte nicht gebaut werden: ' + (e.message || 'Fehler'));
  }
  if (pdf.size > MAX_BELEG_BYTES) throw new Error(ZU_GROSS);

  ladeAnzeige('Beleg wird in der Ablage gespeichert …');
  let dok;
  try {
    dok = await belegAblegen({
      vehicleId, file: pdf, title: 'Gescannter Beleg', date: todayISO(),
      category: 'Rechnung', kiAuswerten: mitKI
    });
  } catch (e) {
    throw new Error('Speichern nicht möglich: ' + (e.message || 'Fehler'));
  }
  aktualisiere();

  // --- Ab hier ist der Scan sicher in Drive. ---
  let r = {}, hinweis = null;
  if (mitKI) {
    ladeAnzeige('Gespeichert. Die KI liest alle Seiten aus – das dauert einen Moment …');
    const aus = await kiAuslesen(dok.id);
    aktualisiere();   // sonst zeigt die Ablage noch den Stand vor dem Auslesen
    if (aus.dok) dok = aus.dok;
    if (aus.ergebnis) r = aus.ergebnis;
    if (aus.fehler) hinweis = aus.fehler;
  }
  bestaetigen(dok, r, seiten.length, hinweis);
}

/**
 * Einen gespeicherten Beleg erneut auslesen - ohne neu zu fotografieren.
 * Der Server nimmt die Datei aus Drive.
 */
async function erneutAuslesen(docId) {
  if (!await verfuegbar()) {
    toast('Für das automatische Auslesen ist kein Schlüssel hinterlegt.');
    return;
  }
  ladeAnzeige('Die KI liest den Beleg aus – das dauert einen Moment …');
  const aus = await kiAuslesen(docId);
  aktualisiere();
  if (!aus.ergebnis) {
    closeModal();
    triggerRender();
    toast('Auslesen nicht möglich: ' + (aus.fehler || 'Fehler') + ' Der Beleg bleibt gespeichert.');
    return;
  }
  bestaetigen(aus.dok || await get('docs', docId), aus.ergebnis, null, null);
}

function ladeAnzeige(text) {
  const mod = $('#modal');
  mod.innerHTML = '';
  mod.append(
    el('header', {}, el('h3', {}, 'Beleg scannen')),
    el('div', { class: 'body' }, el('div', { style: 'padding:18px 0;text-align:center;color:var(--muted)' }, text)));
  $('#overlay').classList.add('show');
}

// Exportiert, damit der Pruefdialog ohne Dateiauswahl darstellbar ist.
/**
 * Pruefdialog fuer einen bereits gespeicherten Beleg.
 *
 * @param {object} dok Der gespeicherte Dokumenteintrag.
 * @param {object} r Was die Erkennung gelesen hat - leer, wenn sie nicht lief.
 * @param {number} [seitenzahl]
 * @param {string} [hinweis] Warum die Erkennung nichts liefern konnte.
 */
function bestaetigen(dok, r, seitenzahl, hinweis) {
  r = r || {};
  const fahrzeug = fahrzeugRaten(r, dok.vehicleId);
  const gelesen = Object.keys(r).length > 0;
  const mod = $('#modal');
  mod.innerHTML = '';

  const fahrzeugWahl = el('select', { name: 'vehicleId' });
  S.vehicles.forEach(v => {
    const op = el('option', { value: v.id }, v.name);
    if (fahrzeug && v.id === fahrzeug.id) op.selected = true;
    fahrzeugWahl.append(op);
  });

  const fDatum = el('input', { type: 'date', value: r.date || todayISO() });
  const fTitel = el('input', { type: 'text',
    value: r.title || (dok.title && dok.title !== 'Gescannter Beleg' ? dok.title : '') });
  // Die Arten haengen an der Fahrzeugart – beim Camper gehoert "Ausbau" dazu.
  const fTyp = el('select');
  function typenFuellen(vehicleId) {
    const gewaehlt = fTyp.value || r.type || r.eventType || 'Wartung';
    const arten = ereignisarten(S.vehicles.find(v => v.id === vehicleId));
    fTyp.innerHTML = '';
    (arten.includes(gewaehlt) ? arten : arten.concat([gewaehlt])).forEach(t => {
      const op = el('option', { value: t }, t);
      if (t === gewaehlt) op.selected = true;
      fTyp.append(op);
    });
  }
  typenFuellen(fahrzeugWahl.value);
  fahrzeugWahl.addEventListener('change', () => typenFuellen(fahrzeugWahl.value));
  // Die einzelnen Arbeiten stehen bei mehrseitigen Rechnungen oft erst auf
  // Seite zwei oder drei - sie fuellen die Beschreibung, wenn die KI keine
  // Zusammenfassung geliefert hat.
  const arbeiten = (r.workPerformed || []).filter(Boolean);
  const fBeschreibung = el('input', { type: 'text',
    value: r.desc || arbeiten.join(', ') || r.title || '' });
  const fKosten = el('input', { type: 'number', step: '0.01', value: r.cost != null ? r.cost : '' });
  const fKm = el('input', { type: 'number', value: r.km != null ? r.km : '' });
  const fWerkstatt = el('input', { type: 'text', value: r.shop || '' });
  // Rechnungsnummer und Betraege haben kein eigenes Feld - in der Notiz
  // sind sie spaeter auffindbar, etwa bei einer Garantiefrage.
  const notizTeile = [];
  if (r.invoiceNumber) notizTeile.push('Rechnung Nr. ' + r.invoiceNumber);
  if (r.netAmount != null) notizTeile.push('Netto ' + eur(r.netAmount));
  if (r.vatAmount != null) notizTeile.push('MwSt. ' + eur(r.vatAmount));
  if (arbeiten.length > 1) notizTeile.push('Arbeiten: ' + arbeiten.join('; '));
  const fNotiz = el('textarea', { rows: '2', placeholder: 'Optional' });
  fNotiz.value = notizTeile.join('\n');

  // Der Dateiname entsteht aus dem Erkannten: Datum zuerst, damit die Belege
  // in jeder Ordneransicht von selbst in zeitlicher Reihenfolge liegen.
  // Aus dem Erkannten benennen - nur aus tatsaechlich Gelesenem. Ohne
  // Ergebnis bleibt der vorlaeufige Name ("Datum Beleg.pdf").
  const fDateiname = el('input', { type: 'text',
    value: (r.date || r.shop || r.title) ? belegName(r) : (dok.name || belegName({}, 'Beleg')) });
  const nameNachziehen = () => {
    if (fDateiname.dataset.geaendert) return;   // von Hand geaendert: in Ruhe lassen
    fDateiname.value = belegName({
      date: fDatum.value, shop: fWerkstatt.value, title: fTitel.value
    });
  };
  fDateiname.addEventListener('input', () => { fDateiname.dataset.geaendert = '1'; });
  [fDatum, fTitel, fWerkstatt].forEach(f => f.addEventListener('input', nameNachziehen));

  // Dieselbe Liste wie in der Dokumentenablage – zwei Listen laufen sonst
  // auseinander, und gescannte Belege landen unter Kategorien, die es in der
  // Ablage gar nicht mehr gibt.
  const fKategorie = el('select');
  KATEGORIEN.forEach(k => {
    const op = el('option', { value: k }, k);
    if (k === (r.category || 'Rechnung')) op.selected = true;
    fKategorie.append(op);
  });

  // Auch die Zusatzwirkungen sind aenderbar: Was die KI hier falsch oder gar
  // nicht erkannt hat, laesst sich hier korrigieren, ergaenzen oder leeren.
  // Bei einem HU-Bericht die Hauptuntersuchung von vornherein hineinschreiben,
  // damit im Dialog sichtbar ist, welcher Termin gleich weiterrueckt.
  const arten = (r.maintenanceKinds || []).filter(Boolean);
  if ([r.type, r.category, r.title, r.desc].some(istTuev) && !arten.some(istTuev)) {
    const vorhandener = S.intervals.find(iv =>
      iv.vehicleId === (fahrzeug && fahrzeug.id) && istTuev(iv.kind));
    arten.unshift(vorhandener ? vorhandener.kind : 'TÜV / HU-AU');
  }
  const fWartungen = el('input', { type: 'text', value: arten.join(', '),
    placeholder: 'z. B. Ölwechsel, Luftfilter – leer lassen für keine' });
  // Durch vollesDatum(), sonst verschluckt das Datumsfeld eine Angabe wie
  // "2027-01" oder "Januar 2027" stillschweigend - und der Termin waere
  // weg, obwohl er auf dem Bericht steht.
  const fNaechste = el('input', { type: 'date', value: vollesDatum(r.nextDue) });
  const fKmUebernehmen = el('input', { type: 'checkbox' });
  fKmUebernehmen.checked = r.km != null && fahrzeug && (fahrzeug.km == null || fahrzeug.km === '' || +r.km > +fahrzeug.km);

  const feld = (label, eingabe, hinweis) => el('div', { class: 'field' },
    el('label', {}, label), eingabe,
    hinweis ? el('div', { style: 'font-size:11.5px;color:var(--muted);margin-top:4px' }, hinweis) : null);

  const kmZeile = el('label', { style: 'display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer' },
    fKmUebernehmen, 'km-Stand des Fahrzeugs auf diesen Wert setzen');

  const body = el('div', { class: 'body' },
    el('div', { style: 'font-size:13px;color:var(--muted)' },
      gelesen
        ? 'Der Beleg ist gespeichert. Diese Angaben hat die KI gelesen – bitte prüfen und bei Bedarf korrigieren. Mit „Eintragen" entsteht der Werkstatteintrag.'
        : 'Der Beleg ist gespeichert. Trage die Angaben ein – mit „Eintragen" entsteht der Werkstatteintrag.'),
    hinweis ? el('div', { class: 'filechip', style: 'color:var(--over)' },
      hinweis + ' Wiederholen lässt sich das später in der Ablage mit „Erneut mit KI auslesen".') : null,
    feld('Fahrzeug', fahrzeugWahl),
    el('div', { class: 'row2' }, feld('Datum', fDatum), feld('Typ', fTyp)),
    feld('Titel', fTitel),
    feld('Beschreibung', fBeschreibung),
    el('div', { class: 'row2' }, feld('Kosten (€)', fKosten), feld('km-Stand', fKm)),
    feld('Werkstatt / Ort', fWerkstatt),
    feld('Kategorie des Dokuments', fKategorie),
    feld('Dateiname', fDateiname,
      'Unter diesem Namen liegt der Beleg in der Ablage und in Drive.'),
    feld('Notiz', fNotiz),
    el('div', { class: 'filechip' },
      (seitenzahl && seitenzahl > 1 ? seitenzahl + ' Seiten zu einem PDF zusammengefasst · ' : '')
      + Math.max(1, Math.round((+dok.size || 0) / 1024)) + ' KB · in der Ablage gespeichert'),
    el('div', { style: 'border-top:1px solid var(--line);padding-top:14px;display:grid;gap:14px' },
      el('div', { style: 'font-weight:700;font-size:13px' }, 'Wartung & Fälligkeit'),
      feld('Wartungsarten', fWartungen, 'Mehrere durch Komma trennen. Diese Termine werden angelegt oder aktualisiert.'),
      feld('Nächste Fälligkeit', fNaechste, 'Falls im Beleg genannt – daraus wird der Wartungsabstand berechnet.'),
      kmZeile)
  );

  const speichern = el('button', { class: 'btn' }, 'Eintragen');
  speichern.onclick = async () => {
    speichern.disabled = true;
    speichern.classList.add('laeuft');
    try {
      await anlegen(dok, r, {
        vehicleId: fahrzeugWahl.value,
        date: fDatum.value || todayISO(),
        type: fTyp.value,
        title: fTitel.value,
        desc: fBeschreibung.value,
        cost: fKosten.value === '' ? '' : +fKosten.value,
        km: fKm.value === '' ? '' : +fKm.value,
        shop: fWerkstatt.value,
        category: fKategorie.value,
        dateiname: fDateiname.value.trim(),
        note: fNotiz.value,
        maintenanceKinds: fWartungen.value.split(',').map(s => s.trim()).filter(Boolean),
        nextDue: fNaechste.value || null,
        kmUebernehmen: fKmUebernehmen.checked
      });
      closeModal();
      triggerRender();
    } catch (e) {
      speichern.disabled = false;
      speichern.classList.remove('laeuft');
      toast('Speichern fehlgeschlagen: ' + (e.message || 'Fehler'));
    }
  };

  // Schliessen verwirft nichts: Der Beleg liegt schon in der Ablage.
  const spaeter = () => { closeModal(); triggerRender(); toast('Der Beleg liegt in der Ablage.'); };
  mod.append(
    el('header', {}, el('h3', {}, 'Beleg übernehmen'), el('button', { class: 'x', onclick: spaeter }, '×')),
    body,
    el('footer', {}, el('button', { class: 'btn ghost', onclick: spaeter }, 'Nur Beleg behalten'), speichern));
  $('#overlay').classList.add('show');
}

// Uebernimmt ausschliesslich die im Pruefdialog bestaetigten Werte – die
// Rohdaten der KI dienen nur als Vorbelegung.
async function anlegen(dok, r, w) {
  const angelegt = [];

  // 1. Der Beleg liegt schon in Drive - hier bekommt er nur die geprueften
  //    Angaben. Ein geaenderter Name wird auf dem Server auch in Drive
  //    nachgezogen.
  let name = w.dateiname || dok.name;
  if (name && dok.mime === 'application/pdf' && !/\.pdf$/i.test(name)) name += '.pdf';
  const gespeichert = await put('docs', {
    ...dok, vehicleId: w.vehicleId, title: w.title, date: w.date, name,
    category: w.category || r.category || 'Rechnung'
  });
  const docId = gespeichert.id;
  angelegt.push('Dokument');

  // 2. Ereignis, mit dem Beleg verknuepft
  await put('events', {
    id: uid(), vehicleId: w.vehicleId, date: w.date, type: w.type,
    desc: w.desc, km: w.km, shop: w.shop, cost: w.cost, note: w.note || '', docId
  });
  angelegt.push('Ereignis');

  aktualisiere();

  // 3. Wartungstermine: vorhandene aktualisieren, fehlende anlegen
  const wartungen = (w.maintenanceKinds !== undefined ? w.maintenanceKinds : (r.maintenanceKinds || [])).filter(Boolean);

  // Ein HU-Bericht IST die Hauptuntersuchung - darauf muss sich niemand
  // verlassen, dass die KI das auch in die Liste der Wartungsarten
  // geschrieben hat. Blieb sie leer, passierte bisher gar nichts: Der
  // Bericht lag in der Ablage, der Termin blieb unberuehrt.
  // Erkannt wird an allem, was der Beleg hergibt - nicht an einer exakt
  // geschriebenen Typbezeichnung. Stand im Feld "Typ" etwas anderes als
  // genau "TÜV/AU", griff die Regel vorher gar nicht.
  const istHuBeleg = [w.type, w.category, w.title, w.desc].some(istTuev);
  if (istHuBeleg && !wartungen.some(istTuev)) {
    const vorhandener = S.intervals.find(iv => iv.vehicleId === w.vehicleId && istTuev(iv.kind));
    wartungen.push(vorhandener ? vorhandener.kind : 'TÜV / HU-AU');
  }
  const naechste = vollesDatum(w.nextDue !== undefined ? w.nextDue : r.nextDue);
  for (const art of wartungen) {
    const vorhanden = passenderTermin(w.vehicleId, art);
    if (vorhanden) {
      const neu = { ...vorhanden, lastDate: w.date, lastKm: w.km !== '' ? w.km : vorhanden.lastKm };

      // Der naechste Termin wird IMMER gesetzt, nicht nur ausgerechnet.
      //
      // Frueher diente das erkannte Datum nur dazu, den Abstand abzuleiten.
      // Stand am Termin schon ein festes Datum - beim TUEV die Regel, es
      // kommt von der Plakette -, blieb das alte stehen und gewann. Und war
      // am Termin gar kein Abstand hinterlegt, rechnete die App ueberhaupt
      // nichts aus: Der Bericht lag in der Ablage, das Dashboard zeigte
      // weiter "Datum fehlt noch".
      //
      // Eine bestandene HU heisst zwei Jahre, das muss niemand einstellen.
      const abstand = naechste ? 0
        : (+vorhanden.intervalMonths || (istTuev(vorhanden.kind) || istTuev(art) ? 24 : 0));
      if (naechste) {
        const monate = monateZwischen(w.date, naechste);
        if (monate > 0) neu.intervalMonths = monate;
        neu.dueDate = naechste;
      } else if (abstand > 0) {
        // Gerechnet wird ab dem Pruefdatum, nicht ab dem alten Termin. Wer
        // die HU verspaetet macht, bekommt die neue Frist ab der Pruefung -
        // die alte wird nicht nachgeholt.
        neu.dueDate = plusMonate(w.date, abstand);
        if (!vorhanden.intervalMonths) neu.intervalMonths = abstand;
      }

      await put('intervals', neu);
      angelegt.push('Wartung „' + vorhanden.kind + '" aktualisiert');
    } else {
      const monate = istTuev(art) ? 24 : null;
      const neu = {
        id: uid(), vehicleId: w.vehicleId, kind: art,
        intervalKm: null, intervalMonths: monate,
        lastDate: w.date, lastKm: w.km !== '' ? w.km : null,
        dueDate: naechste || (monate ? plusMonate(w.date, monate) : '')
      };
      if (naechste) {
        const abgeleitet = monateZwischen(w.date, naechste);
        if (abgeleitet > 0) neu.intervalMonths = abgeleitet;
      }
      await put('intervals', neu);
      angelegt.push('Wartung „' + art + '" angelegt');
    }
  }

  // 4. km-Stand nachziehen – nur wenn im Dialog bestaetigt.
  //
  // Geschrieben wird in den km-Verlauf, nicht direkt ans Fahrzeug: Der Server
  // traegt von dort den juengsten Stand am Fahrzeug nach. Ein direkt gesetzter
  // Wert wuerde beim naechsten Verlaufseintrag stillschweigend ueberschrieben.
  if (w.km !== '' && w.km != null && w.kmUebernehmen !== false) {
    await put('kmlog', {
      id: uid(), vehicleId: w.vehicleId, date: w.date, km: +w.km,
      note: 'Aus Beleg: ' + (w.title || w.desc || 'Werkstattbesuch')
    });
    angelegt.push('km-Stand aktualisiert');
  }

  aktualisiere();
  toast(angelegt.join(' · '));
}

function monateZwischen(von, bis) {
  const a = parseD(von), b = parseD(bis);
  if (!a || !b) return 0;
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  // Auf den naechstliegenden ueblichen Rhythmus runden (12/24/36 Monate)
  if (m > 0 && Math.abs(m - 24) <= 2) m = 24;
  else if (m > 0 && Math.abs(m - 12) <= 2) m = 12;
  else if (m > 0 && Math.abs(m - 36) <= 2) m = 36;
  return m;
}

/* ===== app ===== */
/* ---------------- Navigation ----------------
   Je Punkt zwei Beschriftungen: die ausgeschriebene fuer die Seitenleiste,
   eine kurze fuer die Leiste am unteren Rand des Handys. Dort stehen sechs
   Punkte nebeneinander – "Wartungshistorie" waere abgeschnitten, und ein
   angeschnittenes Wort ist schlechter zu erkennen als ein kurzes. */
const NAV = [
  ['dashboard', 'tacho', 'Dashboard', 'Start'],
  ['vehicle', 'auto', 'Mein Fahrzeug', 'Fahrzeug'],
  ['events', 'uhr', 'Wartungshistorie', 'Wartung'],
  ['costs', 'euro', 'Kosten', 'Kosten'],
  ['docs', 'beleg', 'Dokumente', 'Belege'],
  ['settings', 'regler', 'Einstellungen', 'Mehr']
];

/* Die sechs Punkte zerfallen in zwei Gruppen: was man taeglich braucht, und
   was man selten anfasst. Zwei kleine Ueberschriften ordnen die Liste, ohne
   eine weitere Linie zu ziehen. */
const NAV_GRUPPEN = { dashboard: 'Start', docs: 'Weiteres' };

function renderNav() {
  const n = $('#nav');
  n.innerHTML = '';
  NAV.forEach(([k, ic, lang, kurz]) => {
    if (NAV_GRUPPEN[k]) n.append(el('div', { class: 'nav-gruppe' }, NAV_GRUPPEN[k]));
    n.append(el('button', {
      class: 'nav-btn' + (view === k ? ' active' : ''),
      title: lang,
      onclick: () => { setView(k); render(); }
    },
      el('span', { class: 'ic' }, icon(ic, 18)),
      el('span', { class: 'lang' }, lang),
      el('span', { class: 'kurz' }, kurz)));
  });
}

/* ---------------- Fahrzeugwahl ----------------
   Selbst gezeichnet statt <select>: Ein Auswahlmenue des Betriebssystems
   laesst sich nicht gestalten, es sieht auf jedem Rechner anders aus und
   hier wie ein Fremdkoerper. Das Schild bleibt ein Schild, auch wenn es
   aufgeklappt ist. */
function plateSchild(text, klasse) {
  return el('div', { class: 'plate ' + (klasse || '') },
    el('span', { class: 'plate-eu' }, el('span', { class: 'plate-d' }, 'D')),
    el('span', { class: 'plate-txt' }, text));
}

function renderPicker() {
  const p = $('#vehPicker');
  p.innerHTML = '';

  const eintraege = [];
  if (S.vehicles.length > 1) eintraege.push({ id: 'all', text: 'ALLE', sub: 'Alle Fahrzeuge' });
  S.vehicles.forEach(v => eintraege.push({
    id: v.id, text: v.plate || v.name, sub: v.plate ? v.name : null,
    art: fahrzeugArt(v)
  }));
  if (!eintraege.length) {
    p.append(plateSchild('– kein Fahrzeug –', 'leer'));
    return;
  }

  const aktuell = eintraege.find(e => e.id === curVeh) || eintraege[0];
  const liste = el('div', { class: 'plate-liste', role: 'listbox' });
  const knopf = el('button', {
    class: 'plate-knopf', type: 'button',
    'aria-haspopup': 'listbox', 'aria-expanded': 'false',
    onclick: e => { e.stopPropagation(); auf(!p.classList.contains('offen')); }
  }, plateSchild(aktuell.text), chevronAb());

  function auf(zeigen) {
    p.classList.toggle('offen', zeigen);
    knopf.setAttribute('aria-expanded', String(zeigen));
  }

  // Nur eines kann offen sein, und ein Klick daneben schliesst es wieder –
  // sonst bleibt das Menue stehen, wenn man woanders hinfasst.
  if (!renderPicker.gebunden) {
    document.addEventListener('click', () => {
      const w = $('#vehPicker');
      if (w) w.classList.remove('offen');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') $('#vehPicker')?.classList.remove('offen');
    });
    renderPicker.gebunden = true;
  }

  eintraege.forEach(e => liste.append(el('button', {
    class: 'plate-eintrag' + (e.id === curVeh ? ' an' : ''),
    type: 'button', role: 'option', 'aria-selected': String(e.id === curVeh),
    onclick: ev => { ev.stopPropagation(); auf(false); setCurVeh(e.id); render(); }
  },
    // Das Zeichen der Fahrzeugart steht vor dem Schild: In einer Liste aus
    // Kennzeichen sieht man sonst viermal dasselbe.
    e.art ? el('span', { class: 'art-zeichen', title: e.art.name },
      icon(e.art.zeichen, 18)) : el('span', { style: 'width:18px' }),
    plateSchild(e.text, 'klein'),
    e.sub ? el('span', { class: 'plate-sub' }, e.sub) : null)));

  p.append(knopf, liste);
}

function chevronAb() {
  return el('span', { class: 'plate-pfeil' }, icon('chevron-ab', 14));
}

/** Zeigt, wer angemeldet ist, und bietet das Abmelden an. */
function renderProfil() {
  const box = $('#profilBox');
  if (!box) return;
  box.innerHTML = '';
  if (!currentUser) return;
  const anzahl = S.vehicles.length;
  box.append(
    // Das Profilbild traegt keine Statusfarbe – in dieser Oberflaeche bedeutet
    // Farbe Dringlichkeit, und ein Mensch ist nicht dringlich.
    el('span', { class: 'profil-bild klein' },
      String(currentUser.name || '?').slice(0, 1).toUpperCase()),
    el('span', { class: 'profil-text' },
      el('span', { class: 'st-on' }, currentUser.name),
      el('span', { class: 'st-sub' },
        anzahl + (anzahl === 1 ? ' Fahrzeug' : ' Fahrzeuge'))),
    el('button', { class: 'st-ab', title: 'Abmelden',
                   onclick: () => abmelden() }, 'abmelden'));
}

/* ---------------- Kopfleiste ----------------
   Suchen, eine Aufgabe anlegen und einen Beleg scannen sind auf jeder Seite
   dieselben drei Handgriffe. Sie stehen deshalb ueber dem Inhalt und nicht
   mehr am Fuss der Seitenleiste, wo sie am weitesten vom Blick weg sind. */
function renderKopfleiste() {
  const k = $('#kopfleiste');
  if (!k) return;
  k.innerHTML = '';

  const feld = el('input', {
    class: 'suchfeld-eingabe', type: 'search',
    placeholder: 'Fahrzeug, Aufgabe oder Beleg suchen',
    onkeydown: e => { if (e.key === 'Enter') zeigeSuche(feld.value); }
  });

  k.append(
    el('div', { class: 'suchfeld', onclick: () => feld.focus() },
      icon('lupe', 17), feld),
    el('button', { class: 'knopf-still', onclick: () => aufgabeAnlegen() },
      'Aufgabe anlegen'),
    el('button', { class: 'knopf-voll', onclick: () => belegScannen() },
      icon('kamera', 18), 'Beleg scannen'));
}

/* ---------------- Verlauf und Merken ----------------

   Zwei kleine Dinge, die auf dem Handy den Unterschied machen:

   Der Zurueck-Knopf fuehrte bisher aus der App heraus, weil ein
   Ansichtswechsel keinen Verlaufseintrag erzeugte. Jetzt legt jede Ansicht
   einen an - ueber history.pushState OHNE Adresse. Das ist wichtig: Die
   Adresse des Rahmens gehoert Google, ein Versuch sie zu aendern wuerde
   scheitern. Ein Eintrag nur mit Zustand ist erlaubt.

   Und nach einem Neuladen landete man immer wieder auf dem Dashboard. Die
   zuletzt gewaehlte Ansicht liegt jetzt im Sitzungsspeicher. */

const MERKER = 'fp_ansicht';
let ausDemVerlauf = false;
let zuletztGezeigt = '';

function merke() {
  try { sessionStorage.setItem(MERKER, JSON.stringify({ view, curVeh })); } catch (e) {}
}

function gemerktes() {
  try {
    const roh = sessionStorage.getItem(MERKER);
    return roh ? JSON.parse(roh) : null;
  } catch (e) { return null; }
}

function verlaufNachziehen() {
  const jetzt = view + '|' + curVeh;
  if (jetzt === zuletztGezeigt) return;
  const erster = zuletztGezeigt === '';
  zuletztGezeigt = jetzt;
  merke();
  if (ausDemVerlauf) { ausDemVerlauf = false; return; }
  try {
    // Ohne dritten Parameter bleibt die Adresse unberuehrt.
    if (erster) history.replaceState({ fp: true, view, curVeh }, '');
    else history.pushState({ fp: true, view, curVeh }, '');
  } catch (e) { /* kein Verlauf - dann eben ohne */ }
}

addEventListener('popstate', e => {
  if (!e.state || !e.state.fp) return;
  ausDemVerlauf = true;
  zuletztGezeigt = '';
  setView(e.state.view);
  setCurVeh(e.state.curVeh);
  render();
});

// Escape schliesst den Dialog - bisher ging das nur mit der Maus.
addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay')?.classList.contains('show')) closeModal();
});

/* ---------------- Zeichnen ---------------- */
function render() {
  renderNav();
  renderPicker();
  renderProfil();
  renderKopfleiste();
  const m = $('#main');
  m.innerHTML = '';
  ({ dashboard: vDash, vehicle: vFahrzeug, events: vEvents, costs: vKosten,
     docs: vDocs, settings: vSettings }[view])(m);
  verlaufNachziehen();
}
setRender(render);

/* ---------------- Start ----------------

   Hier wird bewusst nirgends neu geladen. Bei Apps Script steckt die Seite in
   einem Rahmen, dessen Adresse Google vergibt; ein location.reload() von innen
   endet dort in einer leeren weissen Seite. Anmelden und Abmelden wechseln
   deshalb nur, was auf dem Schirm steht. */

/* Wie lange der letzte Start gedauert hat. Sichtbar in den Einstellungen -
   ohne Zahl bleibt "das dauert lange" eine Vermutung. */
let startZeiten = { server: null, zeichnen: null };

/**
 * Holt die Daten und zeichnet die App – nach dem Anmelden und beim Start.
 *
 * @param {object} [vorabDaten] Bestand, den die Anmeldung schon geholt hat.
 */
async function starteApp(vorabDaten) {
  const t0 = performance.now();
  if (!vorabDaten) zeigeLaedt();
  try {
    await reload(vorabDaten);
  } catch (fehler) {
    const m = $('#main');
    const meldung = el('div', { style: 'padding:40px;max-width:520px' },
      el('h2', {}, 'Daten konnten nicht geladen werden'),
      el('p', {}, fehler.message),
      el('p', { style: 'color:var(--muted)' },
        'Prüfe im Skripteditor mit zeigeEinrichtung(), ob Tabelle und Profile '
        + 'angelegt sind.'));
    if (m) { m.innerHTML = ''; m.append(meldung); } else document.body.append(meldung);
    return;
  }

  // Bei genau einem Fahrzeug ist die Auswahl "ALLE" sinnlos.
  if (S.vehicles.length === 1) setCurVeh(S.vehicles[0].id);

  // Zuletzt gewaehlte Ansicht wiederherstellen - nur, wenn das Fahrzeug
  // noch existiert. Sonst zeigte die App auf etwas Geloeschtes.
  const alt = gemerktes();
  if (alt && alt.view) {
    setView(alt.view);
    if (alt.curVeh === 'all' || S.vehicles.some(v => v.id === alt.curVeh)) setCurVeh(alt.curVeh);
  }

  const t1 = performance.now();
  render();
  startZeiten = {
    server: Math.round(t1 - t0),
    zeichnen: Math.round(performance.now() - t1)
  };
}

/** Abmelden: Sitzung beenden, Bestand leeren, zurueck zur Maske. */
async function abmelden() {
  try { await signOut(); } catch (e) {}
  Object.keys(S).forEach(b => { S[b] = []; });
  setCurVeh('all');
  setView('dashboard');
  renderLogin(starteApp);
}
setAbmelden(abmelden);

/**
 * Zeigt sofort, dass etwas passiert.
 *
 * Der erste Serverbesuch dauert bei Apps Script ein bis drei Sekunden - die
 * Seite baut sich dort bei jedem Aufruf neu auf. Bisher sah man in dieser
 * Zeit ein leeres Geruest und wusste nicht, ob die App laedt oder haengt.
 */
function zeigeLaedt() {
  const m = $('#main');
  if (!m) return;
  m.innerHTML = '';
  m.append(el('div', { class: 'laedt' },
    el('span', { class: 'laedt-punkte' }, el('i'), el('i'), el('i')),
    el('span', { class: 'laedt-text' }, 'Daten werden geladen …'),
    el('span', { class: 'laedt-klein' },
      'Beim ersten Aufruf dauert das ein paar Sekunden.')));
}

(async function boot() {
  // Sagt der Selbstdiagnose in index.html, dass der Code angelaufen ist.
  // Bleibt sie aus, schreibt die Seite nach vier Sekunden hin, woran es lag,
  // statt als leeres Geruest dazustehen.
  window.__fpGestartet = true;

  // Gibt es eine gemerkte Sitzung, wird sie versucht. Ob sie einen
  // Seitenwechsel ueberlebt, ist bei Apps Script nicht garantiert – schlaegt
  // es fehl, erscheint einfach die Anmeldemaske.
  zeigeLaedt();
  const angemeldet = await initAuth();
  if (!angemeldet) { renderLogin(starteApp); return; }
  // initAuth hat den Bestand schon geholt - kein zweiter Serverbesuch.
  await starteApp(angemeldet.daten);
})();

})();
</script>
