 * Suche ueber alles – Fahrzeuge, Eintraege, Belege, Termine, Notizen.
 *
 * Mit mehreren Autos und einigen Jahren Historie ist das der einzige Weg,
 * "die Bremsenrechnung von damals" wiederzufinden. Bisher gab es gar keine.
 */
/**
 * @param {string} [start] Vorbelegung aus dem Suchfeld der Kopfleiste – wer
 *   dort schon getippt hat, soll nicht ein zweites Mal tippen muessen.
 */
function zeigeSuche(start) {
  const treffer = el('div', { class: 'such-treffer' });
  const feld = el('input', { type: 'search', autocomplete: 'off',
    placeholder: 'Werkstatt, Beschreibung, Betrag, Kennzeichen …', 'aria-label': 'Suchbegriff' });

  feld.oninput = () => {
    const q = feld.value.trim().toLowerCase();
    treffer.innerHTML = '';
    if (q.length < 2) {
      treffer.append(el('div', { class: 'mini' }, 'Mindestens zwei Zeichen.'));
      return;
    }
    const gefunden = suche(q);
    if (!gefunden.length) {
      treffer.append(el('div', { class: 'mini' }, 'Nichts gefunden.'));
      return;
    }
    gefunden.slice(0, 40).forEach(t => {
      treffer.append(el('button', { class: 'st-zeile', onclick: () => { closeModal(); t.oeffne(); } },
        el('span', { class: 'st-art' }, t.art),
        el('span', { class: 'st-mitte' },
          el('span', { class: 'st-titel' }, t.titel),
          t.sub ? el('span', { class: 'st-sub' }, t.sub) : null),
        t.rechts ? el('span', { class: 'st-rechts' }, t.rechts) : null));
    });
    if (gefunden.length > 40) {
      treffer.append(el('div', { class: 'mini' }, (gefunden.length - 40) + ' weitere …'));
    }
  };

  modal('Suchen', [
    el('div', { class: 'field' }, feld),
    treffer
  ], async () => {}, { nurSchliessen: true });

  if (start) { feld.value = start; feld.oninput(); }
  setTimeout(() => feld.focus(), 50);
}

function suche(q) {
  const raus = [];
  const passt = (...werte) => werte.some(w => w && String(w).toLowerCase().includes(q));

  S.vehicles.forEach(v => {
    if (passt(v.name, v.plate, v.model, v.vin, v.hsn, v.tsn, v.engineCode)) {
      raus.push({ art: 'Fahrzeug', titel: v.name || v.plate, sub: v.plate || v.model,
        oeffne: () => { setCurVeh(v.id); setView('vehicle'); triggerRender(); } });
    }
  });

  S.events.forEach(e => {
    if (passt(e.desc, e.shop, e.type, e.note, e.cost)) {
      const v = vehById(e.vehicleId);
      raus.push({ art: 'Eintrag', titel: e.desc || e.type,
        sub: [fmtD(e.date), e.shop, v ? (v.name || v.plate) : null].filter(Boolean).join(' · '),
        rechts: e.cost ? eur(e.cost) : '',
        // Wer sucht, will nachsehen – nicht in einem Formular landen.
        oeffne: () => eventAnsicht(e) });
    }
  });

  S.docs.forEach(d => {
    if (passt(d.title, d.name, d.category)) {
      raus.push({ art: 'Beleg', titel: d.title || d.name,
        sub: [d.category, d.date ? fmtD(d.date) : null].filter(Boolean).join(' · '),
        oeffne: () => openDoc(d.id) });
    }
  });

  S.intervals.forEach(iv => {
    if (passt(iv.kind, iv.note)) {
      const v = vehById(iv.vehicleId);
      raus.push({ art: 'Wartung', titel: iv.kind,
        sub: [iv.lastDate ? 'zuletzt ' + fmtD(iv.lastDate) : null,
              v ? (v.name || v.plate) : null].filter(Boolean).join(' · '),
        oeffne: () => { setCurVeh(iv.vehicleId); setView('vehicle'); triggerRender(); } });
    }
  });

  S.deadlines.forEach(fr => {
    if (passt(fr.kind, fr.note)) {
      raus.push({ art: 'Frist', titel: fr.kind, sub: fr.date ? fmtD(fr.date) : '',
        oeffne: () => { setCurVeh(fr.vehicleId); setView('vehicle'); triggerRender(); } });
    }
  });

  S.notes.forEach(n => {
    if (passt(n.text)) {
      raus.push({ art: 'Notiz', titel: String(n.text).slice(0, 80),
        oeffne: () => { setCurVeh(n.vehicleId); setView('vehicle'); triggerRender(); } });
    }
  });

  return raus;
}

/* ===== views/dashboard ===== */
function vDash(m) {
  // Ohne Fahrzeug hat das Dashboard nichts zu zeigen – dann klar zum ersten
  // Schritt fuehren, statt leere Bereiche und "Kein TUEV erfasst" anzuzeigen.
  if (!S.vehicles.length) {
    m.append(headBar('Übersicht', 'Dashboard'));
    m.append(el('div', { class: 'card empty' },
      el('div', { style: 'font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px' }, 'Noch nichts erfasst'),
      el('div', {}, 'Lege zuerst dein Fahrzeug an. Danach schlägt dir die App die üblichen Wartungsintervalle vor, und hier erscheinen TÜV-Termin und Wartungskacheln.'),
      el('div', {}, el('button', { class: 'btn', onclick: () => { setView('vehicle'); triggerRender(); } }, '+ Erstes Fahrzeug anlegen'))));
    return;
  }

  // Bei mehreren Fahrzeugen ist die Frage "welches Auto ist dran?" die erste,
  // die das Dashboard beantworten muss. Eine flache Liste aller Wartungen kann
  // das nicht: Dort steht der TÜV des Polo gleichrangig neben dem Luftfilter
  // des Jumper, und das Fahrzeug nur klein am Rand.
  if (curVeh === 'all' && S.vehicles.length > 1) { flotte(m); return; }

  m.append(headBar('Übersicht', vehById(curVeh)?.name || 'Dashboard'));
  einzelnesFahrzeug(m);
}

/* =====================================================================
   Flottenansicht – eine Karte je Fahrzeug
   ===================================================================== */

/** Alle Termine eines Fahrzeugs: Wartungen und Fristen gemeinsam. */
function termineVon(vId) {
  const w = S.intervals.filter(iv => iv.vehicleId === vId)
    .map(iv => ({ art: 'intervals', satz: iv, kind: iv.kind, ...intStatus(iv) }));
  const f = (S.deadlines || []).filter(fr => fr.vehicleId === vId)
    .map(fr => ({ art: 'deadlines', satz: fr, kind: fr.kind, ...fristStatus(fr) }));
  return w.concat(f).sort((a, b) => rank(a.st) - rank(b.st) || ((a.days ?? 9e9) - (b.days ?? 9e9)));
}

function istTuv(t) { return /t[üu]v|hu|hauptunters/i.test(t.kind || ''); }

function restText(t) {
  if (t.days == null) {
    if (t.kmLeft == null) return 'Angabe fehlt';
    return t.kmLeft < 0 ? km(Math.abs(t.kmLeft)) + ' über' : 'noch ' + km(t.kmLeft);
  }
  if (t.days < 0) return Math.abs(t.days) + ' Tage über';
  if (t.days === 0) return 'heute fällig';
  return 'in ' + t.days + ' Tagen';
}

/** Dieselbe Angabe, knapper – in der Fahrzeugkarte ist die Spalte schmal. */
function restKurz(t) {
  if (t.days == null) return restText(t);
  if (t.days < 0) return Math.abs(t.days) + ' T über';
  if (t.days === 0) return 'heute';
  return 'in ' + t.days + ' T';
}

/* Dringlichkeit ist die einzige Aussage, die auf dem Dashboard Farbe bekommt.
   Sie ist bewusst nicht dasselbe wie der Status aus intStatus(): der schaltet
   schon 30 Tage vorher auf "bald faellig", waehrend das Dashboard 90 Tage
   weit schaut. Beides nebeneinander stehen zu lassen waere widerspruechlich,
   deshalb rechnet das Dashboard seine Stufe selbst. */
const NAH = 90;
function stufe(t) {
  if (t.days != null) return t.days < 0 ? 'over' : (t.days <= NAH ? 'soon' : 'later');
  if (t.kmLeft != null) return t.kmLeft < 0 ? 'over' : 'later';
  return 'later';
}
const stufenRang = { over: 0, soon: 1, later: 2 };

/** Alle Termine aller Fahrzeuge in einer flachen Liste, mit Fahrzeug dabei. */
function alleTermine() {
  return S.vehicles.flatMap(v => termineVon(v.id).map(t => ({ ...t, v })));
}

/** Termin bearbeiten – Wartung oder Frist, je nachdem was dahintersteht. */
function bearbeiteTermin(t) {
  if (t.art === 'intervals') intervalModal(t.satz); else fristModal(t.satz);
}

/* Der Horizont der Liste "Naechste …". Er lebt im Modul, nicht im Zustand der
   App: es ist eine Frage der Ansicht, nicht der Daten. */
let horizont = NAH;

function flotte(m) {
  const heute = new Date();
  const yNow = heute.getFullYear();
  const termine = alleTermine();
  const ueber = termine.filter(t => stufe(t) === 'over')
    .sort((a, b) => (a.days ?? 0) - (b.days ?? 0));
  const naechste = termine.filter(t => stufe(t) !== 'over' && t.days != null && t.days <= horizont)
    .sort((a, b) => a.days - b.days);

  // ---- Titelzeile: was ansteht, seit wann, und wie weit wir schauen
  const datum = new Intl.DateTimeFormat('de-DE',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(heute);
  const zeitwahl = el('div', { class: 'zeitwahl' },
    ...[[NAH, '90 Tage'], [365, '12 Monate']].map(([wert, text]) =>
      el('button', { class: horizont === wert ? 'an' : '',
        onclick: () => { horizont = wert; triggerRender(); } }, text)));

  m.append(el('div', { class: 'ansteht' },
    el('div', {},
      el('h1', {}, 'Was ansteht'),
      el('p', { class: 'unter' }, datum + ' · ' + S.vehicles.length + ' Fahrzeuge · '
        + ueber.length + ' überfällig')),
    zeitwahl));

  // ---- Die Aufgabenkachel: ueberfaellig oben, danach der Ausblick
  m.append(el('div', { class: 'spalten' },
    el('div', { class: 'spalte-gross' },
      aufgabenKachel(ueber, naechste),
      zeitachse(termine),
      el('div', { class: 'fz-kopfzeile' },
        el('h2', {}, 'Fahrzeuge'),
        el('span', { class: 'anzahl' }, String(S.vehicles.length)),
        el('span', { class: 'verweis', onclick: () => { setView('vehicle'); triggerRender(); } },
          'alle verwalten ›')),
      fahrzeugRaster(yNow)),
    el('div', { class: 'spalte-klein' },
      kostenKachel(yNow),
      historieKachel(yNow),
      erfassenKachel())));

  m.append(el('div', { class: 'farblogik' },
    el('span', { class: 'marke' }, 'Farblogik'),
    ...[['var(--rot)', 'überfällig'], ['var(--gelb-punkt)', 'in 90 Tagen'],
        ['var(--gruen)', 'später']].map(([f, t]) =>
      el('div', { class: 'paar' },
        el('span', { class: 'probe', style: 'background:' + f }), t)),
    el('span', { class: 'satz' },
      'Farbe zeigt nur Dringlichkeit — nie das Fahrzeug, nie die Kategorie.')));
}

/* ---------------------------------------------------------------------
   Aufgabenkachel
   --------------------------------------------------------------------- */

/**
 * Eine Zeile im Aufgabenpanel. Der Knopf rechts ist die Handlung, die an
 * dieser Stelle naheliegt: bei Ueberfaelligem das Abhaken, beim Ausblick das
 * Festlegen eines Termins.
 */
function aufgabenZeile(t, ueberfaellig) {
  const st = stufe(t);
  const knopf = ueberfaellig
    ? el('button', { class: 'auf-knopf', onclick: () => erledigtModal(t.art, t.satz) },
      'Erledigt')
    : el('button', { class: 'auf-knopf', onclick: () => bearbeiteTermin(t) }, 'Termin');

  return el('div', { class: 'auf-zeile' },
    el('span', { class: 'auf-punkt' + (st === 'later' ? ' spaet' : '') }),
    el('div', { class: 'auf-mitte' },
      el('span', { class: 'auf-titel' }, t.kind || 'Termin'),
      el('span', { class: 'auf-meta' },
        (t.v ? t.v.name || t.v.plate : '') +
        (t.dueDate ? ' · ' + (t.days < 0 ? 'war ' : 'fällig ')
          + fmtD(t.dueDate.toISOString().slice(0, 10)) : ''))),
    el('span', { class: 'auf-wert' }, restText(t)),
    knopf);
}

function aufgabenKachel(ueber, naechste) {
  const karte = el('div', { class: 'aufgaben' });

  if (ueber.length) {
    const tage = ueber.map(t => Math.abs(t.days ?? 0));
    const von = Math.min(...tage), bis = Math.max(...tage);
    const abschnitt = el('div', { class: 'auf-over' },
      el('div', { class: 'auf-kopf' },
        el('span', { class: 'marke auf-marke' }, 'Überfällig'),
        el('span', { class: 'auf-zahl' }, String(ueber.length)),
        el('span', { class: 'auf-seit' },
          von === bis ? 'seit ' + von + ' Tagen offen'
            : 'seit ' + von + '–' + bis + ' Tagen offen')));
    ueber.forEach(t => abschnitt.append(aufgabenZeile(t, true)));
    karte.append(abschnitt);
  }

  const titel = horizont === NAH ? 'Nächste 90 Tage' : 'Nächste 12 Monate';
  const abschnitt = el('div', { class: 'auf-naechste' },
    el('div', { class: 'auf-kopf' },
      el('span', { class: 'marke' }, titel),
      el('span', { class: 'auf-zahl' }, String(naechste.length))));
  if (!naechste.length) {
    abschnitt.append(el('div', { class: 'auf-leer' },
      'In diesem Zeitraum steht nichts an.'));
  } else {
    naechste.forEach(t => abschnitt.append(aufgabenZeile(t, false)));
  }
  karte.append(abschnitt);
  return karte;
}

/* ---------------------------------------------------------------------
   Zeitachse: zwoelf Monate, ein Punkt je Termin
   --------------------------------------------------------------------- */

const MONATSBUCHSTABE = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];

function zeitachse(termine) {
  const heute = new Date();
  const start = new Date(heute.getFullYear(), heute.getMonth(), 1);
  const monate = Array.from({ length: 12 },
    (_, i) => new Date(start.getFullYear(), start.getMonth() + i, 1));

  const mitDatum = termine.filter(t => t.dueDate);
  const raster = el('div', { class: 'za-raster' }, el('span'));
  monate.forEach(d => raster.append(
    el('span', { class: 'za-monat' }, MONATSBUCHSTABE[d.getMonth()])));

  S.vehicles.forEach(v => {
    // Der Fahrzeugname fuehrt ins Fahrzeug – wer in der Zeile liest, will
    // oft dorthin.
    raster.append(el('button', { class: 'za-fz',
      title: 'Zu ' + (v.name || v.plate),
      onclick: () => { setCurVeh(v.id); setView('vehicle'); triggerRender(); } },
      v.name || v.plate || 'Fahrzeug'));

    monate.forEach(d => {
      const drin = mitDatum.filter(t => t.v.id === v.id
        && t.dueDate.getFullYear() === d.getFullYear()
        && t.dueDate.getMonth() === d.getMonth());
      if (!drin.length) { raster.append(el('span', { class: 'za-zelle' })); return; }
      const schlimmste = drin.map(stufe)
        .sort((a, b) => stufenRang[a] - stufenRang[b])[0];
      // Eine Zelle mit Terminen ist ein Knopf: Punkte allein kann man nur
      // anschauen, und ein Kalender, in dem man nichts oeffnen kann, ist
      // eine Abbildung, kein Werkzeug.
      const zelle = el('button', { class: 'za-zelle ' + schlimmste,
        title: drin.map(t => t.kind + ' ' + fmtD(t.dueDate.toISOString().slice(0, 10)))
          .join(' · ') + ' – zum Öffnen anklicken',
        onclick: () => monatsModal(v, d, drin) });
      drin.slice(0, 3).forEach(t =>
        zelle.append(el('span', { class: 'za-punkt ' + stufe(t) })));
      if (drin.length > 3) zelle.append(el('span', { class: 'za-mehr' }, '+'));
      raster.append(zelle);
    });
  });

  return el('details', { class: 'zeitachse' },
    el('summary', {},
      el('span', { class: 'marke' }, 'Termine 12 Monate'),
      el('span', { class: 'za-hinweis' },
        mitDatum.length + ' Termine · ein Punkt = ein Termin, Monat anklicken'),
      el('span', { class: 'za-pfeil' }, icon('chevron-ab', 13))),
    raster);
}

const MONATSNAME = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

/** Was in einem Monat ansteht, mit denselben Handgriffen wie im Aufgabenteil. */
function monatsModal(v, monat, termine) {
  const zeilen = termine
    .slice()
    .sort((a, b) => a.dueDate - b.dueDate)
    .map(t => {
      const st = stufe(t);
      return el('div', { class: 'auf-zeile monat-zeile ' + st },
        el('span', { class: 'auf-punkt' + (st === 'later' ? ' spaet' : '') }),
        el('div', { class: 'auf-mitte' },
          el('span', { class: 'auf-titel' }, t.kind || 'Termin'),
          el('span', { class: 'auf-meta' },
            fmtD(t.dueDate.toISOString().slice(0, 10)) + ' · ' + restText(t))),
        el('button', { class: 'auf-knopf', onclick: () => { closeModal(); erledigtModal(t.art, t.satz); } },
          'Erledigt'),
        el('button', { class: 'auf-knopf', onclick: () => { closeModal(); bearbeiteTermin(t); } },
          'Bearbeiten'));
    });

  modal((v.name || v.plate) + ' · ' + MONATSNAME[monat.getMonth()] + ' ' + monat.getFullYear(),
    [el('div', { class: 'monat-liste' }, ...zeilen)],
    async () => {}, { nurSchliessen: true });
}

/* ---------------------------------------------------------------------
   Fahrzeugkarten
   --------------------------------------------------------------------- */

function jahresKostenVon(vId, yNow) {
  return S.events
    .filter(e => e.vehicleId === vId && parseD(e.date) && parseD(e.date).getFullYear() === yNow)
    .reduce((s, e) => s + (+e.cost || 0), 0)
    + S.fixcosts.filter(fc => fc.vehicleId === vId)
      .reduce((s, fc) => s + yearlyAmount(fc), 0);
}

function fahrzeugRaster(yNow) {
  const karten = S.vehicles
    .map(v => ({ v, termine: termineVon(v.id) }))
    .sort((a, b) => {
      const sa = a.termine.length ? stufenRang[stufe(a.termine[0])] : 9;
      const sb = b.termine.length ? stufenRang[stufe(b.termine[0])] : 9;
      return sa - sb || ((a.termine[0]?.days ?? 9e9) - (b.termine[0]?.days ?? 9e9));
    });
  const raster = el('div', { class: 'fzraster' });
  karten.forEach(({ v, termine }) => raster.append(fahrzeugKarte(v, termine, yNow)));
  return raster;
}

function fahrzeugKarte(v, termine, yNow) {
  const tuv = termine.find(istTuv) || null;
  const rest = termine.filter(t => t !== tuv);
  const offen = termine.filter(t => stufe(t) === 'over').length;
  const bald = termine.filter(t => stufe(t) === 'soon').length;
  const hinein = () => { setCurVeh(v.id); setView('vehicle'); triggerRender(); };

  const marke = offen
    ? el('span', { class: 'fzk-marke over' }, offen + '× überfällig')
    : bald ? el('span', { class: 'fzk-marke soon' }, bald + '× in 90 Tagen')
      : el('span', { class: 'fzk-marke ok' }, 'alles aktuell');

  const art = fahrzeugArt(v);
  const kopf = el('div', { class: 'fzk-kopf' },
    el('span', { class: 'art-zeichen art-kreis', title: art.name },
      icon(art.zeichen, 18)),
    el('div', { class: 'fzk-titel' },
      el('h3', { class: 'fzk-name' }, v.name || v.plate || 'Fahrzeug'),
      v.plate ? el('span', { class: 'plate-anzeige' },
        el('span', { class: 'plate-eu' }, el('span', { class: 'plate-d' }, 'D')),
        el('span', { class: 'txt' }, v.plate)) : null),
    marke);

  const tuvBlock = el('div', { class: 'fzk-tuv' },
    plaketteKlein(tuv),
    el('div', { class: 'fzk-tuvtext' },
      el('span', { class: 'marke' }, 'TÜV / HU-AU'),
      el('span', { class: 'fzk-datum' },
        tuv && tuv.dueDate ? fmtD(tuv.dueDate.toISOString().slice(0, 10))
          : (tuv ? 'Datum fehlt' : 'nicht erfasst'))),
    el('span', { class: 'fzk-rest' + (tuv && stufe(tuv) === 'over' ? ' warn' : '') },
      tuv ? restText(tuv) : 'kein Termin'));

  const liste = el('div', { class: 'fzk-liste' });
  if (!rest.length) {
    liste.append(el('div', { class: 'fzk-leer' }, 'Keine weiteren Termine erfasst.'));
  } else {
    rest.slice(0, 4).forEach(t => liste.append(el('div', { class: 'fzz ' + stufe(t) },
      el('span', { class: 'ampel' }),
      el('span', { class: 'nm' }, t.kind),
      el('span', { class: 'rest' }, restKurz(t)))));
    if (rest.length > 4) {
      liste.append(el('div', { class: 'fzk-mehr' }, '+ ' + (rest.length - 4) + ' weitere'));
    }
  }

  const fuss = el('div', { class: 'fzk-fuss' },
    el('span', { class: 'betrag' }, eur(jahresKostenVon(v.id, yNow))),
    el('span', {}, 'in ' + yNow),
    el('span', { class: 'fzk-pfeil' }, 'Öffnen ›'));

  return el('article', {
    class: 'fzkarte' + (offen ? ' over' : bald ? ' soon' : ''),
    onclick: hinein, role: 'button', tabindex: '0',
    onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hinein(); } }
  },
    el('span', { class: 'fzk-band' }),
    el('div', { class: 'fzk-leib' }, kopf,
      v.model ? el('span', { class: 'fzk-modell' }, v.model) : null,
      tuvBlock, liste, fuss));
}

/* ---------------------------------------------------------------------
   Rechte Spalte
   --------------------------------------------------------------------- */

const MONATSKUERZEL = ['JAN', 'FEB', 'MRZ', 'APR', 'MAI', 'JUN',
  'JUL', 'AUG', 'SEP', 'OKT', 'NOV', 'DEZ'];

function kostenKachel(yNow) {
  const bisMonat = new Date().getMonth();           // 0-basiert
  const proMonat = Array(bisMonat + 1).fill(0);
  S.events.forEach(e => {
    const d = parseD(e.date);
    if (d && d.getFullYear() === yNow && d.getMonth() <= bisMonat) {
      proMonat[d.getMonth()] += (+e.cost || 0);
    }
  });
  const hoechster = Math.max(...proMonat, 0);
  const summe = proMonat.reduce((s, n) => s + n, 0)
    + S.fixcosts.reduce((s, fc) => s + yearlyAmount(fc), 0);

  const balken = el('div', { class: 'kosten-balken' });
  proMonat.forEach(betrag => {
    const anteil = hoechster ? Math.max(4, Math.round(betrag / hoechster * 100)) : 4;
    balken.append(el('span', {
      class: betrag && betrag === hoechster ? 'hoch' : '',
      style: 'height:' + anteil + '%',
      title: MONATSKUERZEL[proMonat.indexOf(betrag)] + ' ' + eur(betrag)
    }));
  });

  const achse = el('div', { class: 'kosten-achse' },
    el('span', {}, MONATSKUERZEL[0]),
    bisMonat >= 2 ? el('span', {}, MONATSKUERZEL[Math.floor(bisMonat / 2)]) : null,
    bisMonat >= 1 ? el('span', {}, MONATSKUERZEL[bisMonat]) : null);

  const jeFahrzeug = S.vehicles
    .map(v => ({ v, betrag: jahresKostenVon(v.id, yNow) }))
    .sort((a, b) => b.betrag - a.betrag);
  const groesster = Math.max(...jeFahrzeug.map(x => x.betrag), 0);
  const aufteilung = el('div', { class: 'kosten-je' });
  jeFahrzeug.slice(0, 4).forEach(({ v, betrag }) => aufteilung.append(
    el('div', { class: 'kosten-zeile' },
      el('span', { class: 'nm' }, v.name || v.plate),
      el('span', { class: 'bahn' },
        el('i', { style: 'width:' + (groesster ? Math.round(betrag / groesster * 100) : 0) + '%' })),
      el('span', { class: 'wert' }, eur(betrag)))));

  return el('div', { class: 'kosten-kachel', onclick: () => { setView('costs'); triggerRender(); },
    role: 'button', tabindex: '0' },
    el('div', { style: 'display:flex;align-items:center;gap:10px' },
      el('span', { class: 'marke' }, 'Kosten ' + yNow),
      el('span', { class: 'za-pfeil', style: 'background:rgba(74,67,56,.10)' }, '›')),
    el('div', { class: 'kosten-summe' }, eur(summe)),
    balken, achse, aufteilung);
}

function historieKachel(yNow) {
  const eintraege = S.events
    .filter(e => parseD(e.date))
    .sort((a, b) => parseD(b.date) - parseD(a.date));
  const imJahr = eintraege.filter(e => parseD(e.date).getFullYear() === yNow).length;

  const karte = el('div', { class: 'hist-kachel' },
    el('div', { class: 'hist-kopf' }, el('span', { class: 'marke' }, 'Erledigt · Historie')));

  if (!eintraege.length) {
    karte.append(el('div', { class: 'auf-leer' }, 'Noch nichts erfasst.'));
  } else {
    eintraege.slice(0, 4).forEach(e => {
      const v = vehById(e.vehicleId);
      const d = parseD(e.date);
      karte.append(el('div', { class: 'hist-zeile',
        title: 'Eintrag ansehen', onclick: () => eventAnsicht(e) },
        el('span', { class: 'hist-datum' },
          String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.'),
        el('div', { class: 'hist-mitte' },
          el('span', { class: 'hist-titel' }, e.desc || e.type || 'Eintrag'),
          el('span', { class: 'hist-meta' },
            [v && (v.name || v.plate), e.shop].filter(Boolean).join(' · '))),
        e.cost ? el('span', { class: 'hist-betrag' }, eur(e.cost)) : el('span')));
    });
  }

  karte.append(el('div', { class: 'hist-fuss' },
    el('span', {}, imJahr + (imJahr === 1 ? ' Eintrag ' : ' Einträge ') + yNow),
    el('span', { class: 'verweis', onclick: () => { setView('events'); triggerRender(); } },
      'Alle ansehen ›')));
  return karte;
}

function erfassenKachel() {
  return el('div', { class: 'erfassen' },
    el('span', { class: 'marke' }, 'Schnell erfassen'),
    el('p', {}, 'Beleg fotografieren — Datum, Betrag und Fahrzeug werden '
      + 'vorgeschlagen, du bestätigst nur.'),
    el('div', { class: 'reihe' },
      el('button', { class: 'knopf-voll', onclick: () => belegScannen() }, 'Beleg scannen'),
      el('button', { class: 'zweit', onclick: () => { setView('events'); triggerRender(); } },
        'Manuell')));
}

/* =====================================================================
   Einzelansicht – unveraendert, wie bisher
   ===================================================================== */

function einzelnesFahrzeug(m) {
  const ivs = forVeh(S.intervals).map(iv => ({ iv, ...intStatus(iv) }));
  const counts = { over: 0, soon: 0, ok: 0 };
  ivs.forEach(x => { if (counts[x.st] != null) counts[x.st]++; });
  const tuv = ivs.filter(x => /t[üu]v|hu|hauptunters/i.test(x.iv.kind)).sort((a, b) => (a.dueDate || 8.64e15) - (b.dueDate || 8.64e15))[0];

  // HERO – nächster TÜV, groß und sofort erkennbar
  const hs = tuv ? tuv.st : 'na';
  const lead = el('div', { class: 'lead' }, el('div', { class: 'eyebrow2' }, 'Nächste Hauptuntersuchung · TÜV / HU-AU'));
  if (tuv && tuv.dueDate) {
    lead.append(el('div', { class: 'date' }, fmtD(tuv.dueDate.toISOString().slice(0, 10))));
    const sub = tuv.st === 'over' ? `seit ${Math.abs(tuv.days)} Tagen überfällig` : `in ${tuv.days} Tagen fällig`;
    const meta = el('div', { class: 'metarow' }, el('span', { class: 'pill ' + tuv.st }, stLabel[tuv.st]), el('span', { class: 'veh' }, sub));
    if (curVeh === 'all') { const vv = vehById(tuv.iv.vehicleId); if (vv) meta.append(el('span', { class: 'veh' }, '· ' + vv.name)); }
    lead.append(meta);
  } else if (tuv) {
    // Termin vorhanden, aber ohne "zuletzt erledigt" nicht berechenbar.
    // Frueher stand hier faelschlich "Kein TÜV erfasst".
    lead.append(el('div', { class: 'date', style: 'font-size:26px;color:var(--muted)' }, 'Datum fehlt noch'));
    lead.append(el('div', { class: 'veh', style: 'margin-bottom:10px' }, 'Trag ein, wann der TÜV zuletzt war – dann rechnet die App den nächsten Termin aus.'));
    lead.append(el('button', { class: 'btn sm', onclick: () => intervalModal(tuv.iv) }, 'Datum eintragen'));
  } else {
    lead.append(el('div', { class: 'date', style: 'font-size:26px;color:var(--muted)' }, 'Kein TÜV erfasst'));
    lead.append(el('button', { class: 'btn sm', onclick: () => { if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; } setView('vehicle'); triggerRender(); } }, 'TÜV-Termin anlegen'));
  }
  // Kachelraster mit ungleichen Groessen: Die TÜV-Kachel ist die wichtigste
  // und nimmt entsprechend Platz ein, die Zaehler sind klein.
  const evs = forVeh(S.events);
  const yNow = new Date().getFullYear();
  const yearCost = evs.filter(e => parseD(e.date) && parseD(e.date).getFullYear() === yNow).reduce((s, e) => s + (+e.cost || 0), 0);
  const laufendJahr = forVeh(S.fixcosts).reduce((s, fc) => s + yearlyAmount(fc), 0);

  const kachel = (klasse, wert, label, unten, onclick) => el('div', {
    class: 'tile ' + klasse, ...(onclick ? { onclick, style: 'cursor:pointer' } : {})
  },
    el('div', { class: 'k' }, label),
    el('div', { class: 'v' }, wert),
    unten ? el('div', { class: 's' }, unten) : null);

  m.append(el('div', { class: 'bento' },
    el('div', { class: 'b-2 b-r2' }, el('div', { class: 'hero ' + hs }, lead, plakette(tuv))),
    kachel('accent', eur(yearCost + laufendJahr), 'Kosten ' + yNow,
      eur(yearCost) + ' Werkstatt · ' + eur(laufendJahr) + ' laufend',
      () => { setView('costs'); triggerRender(); }),
    kachel(counts.over ? 'over' : '', String(counts.over), 'Überfällig',
      counts.over ? 'Handlungsbedarf' : 'nichts offen'),
    kachel(counts.soon ? 'soon' : '', String(counts.soon), 'Bald fällig',
      counts.soon ? 'im Blick behalten' : 'nichts in Sicht'),
    kachel(counts.ok ? 'ok' : '', String(counts.ok), 'In Ordnung', 'aktuell')
  ));

  // Alle Wartungen auf einen Blick, nach Dringlichkeit sortiert: rot zuerst,
  // dann orange, dann gruen. Ein Klick fuehrt direkt zum Bearbeiten.
  const alle = ivs.filter(x => !(tuv && x.iv.id === tuv.iv.id))
    .sort((a, b) => rank(a.st) - rank(b.st) || ((a.days ?? 9e9) - (b.days ?? 9e9)));
  const blk = el('section', { class: 'block' }, el('h2', {}, 'Wartungen & Fälligkeiten'));
  if (!alle.length) {
    blk.append(el('div', { class: 'empty' },
      tuv ? 'Neben dem TÜV sind noch keine Wartungen erfasst.' : 'Noch keine Termine erfasst.',
      el('div', {}, el('button', { class: 'btn', onclick: () => { setView('vehicle'); triggerRender(); } }, '+ Erinnerung anlegen'))));
  } else {
    const grid = el('div', { class: 'itemgrid' });
    alle.forEach(x => grid.append(itemCard(x)));
    blk.append(grid);
  }
  m.append(blk);
}

// Echter 6-Jahres-Farbzyklus der HU-Plakette: 2026 = blau, dann gelb, braun,
// rosa, grün, orange, danach wieder blau usw. (Quelle: ADAC).
const PLAKETTE_CYCLE = ['#2F8FD1', '#FFD400', '#A9754A', '#E85C96', '#4CAF50', '#FF7A00'];
const PLAKETTE_CYCLE_START = 2026;
function plaketteColorForYear(y) { return PLAKETTE_CYCLE[((y - PLAKETTE_CYCLE_START) % 6 + 6) % 6]; }

const PLAKETTE_FONT = "Arial Black, 'Arial Black', Arial, sans-serif";

/* Die kleine Plakette der Fahrzeugkarte.
   Bei 44 px ist die gezeichnete Plakette mit Monatsring und Zahlenkranz nur
   noch ein Fleck – die Striche liegen dann enger als ein Bildpunkt. Deshalb
   hier die reduzierte Form: Farbe des Jahres, gestrichelter Innenring,
   zweistellige Jahreszahl. Die vollstaendige Plakette steht weiter gross auf
   der Fahrzeugseite. Die Farben sind die echten der Rotation, gedaempft auf
   die warme Grundstimmung. */
const PLAKETTE_MATT = [
  ['#B9CDE0', '#2C3F52'],  // blau   2026
  ['#ECD9A0', '#5A4A1C'],  // gelb   2027
  ['#D9C3AC', '#4E3A28'],  // braun  2028
  ['#E7C2CE', '#6B2F44'],  // rosa   2029
  ['#BFD4BC', '#33502F'],  // gruen  2030
  ['#EFC5A4', '#6B3A16']   // orange 2031
];

function plaketteKlein(tuv) {
  if (!tuv || !tuv.dueDate) {
    return el('span', { class: 'plakette-klein',
      style: 'background:#E7E2D8;color:#8B8478' }, '–');
  }
  const jahr = tuv.dueDate.getFullYear();
  const [flaeche, schrift] = PLAKETTE_MATT[((jahr - PLAKETTE_CYCLE_START) % 6 + 6) % 6];
  const monat = String(tuv.dueDate.getMonth() + 1).padStart(2, '0');
  return el('span', {
    class: 'plakette-klein', style: 'background:' + flaeche + ';color:' + schrift,
    title: 'TÜV-Plakette, fällig ' + monat + '/' + jahr
  }, el('span', { class: 'plakette-ring' }), String(jahr % 100).padStart(2, '0'));
}

function plakette(tuv) {
  if (!tuv || !tuv.dueDate) {
    return el('div', { class: 'plakette', html:
      '<svg viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Keine TÜV-Plakette erfasst">' +
      '<circle cx="66" cy="66" r="60" fill="#d8d5ea" stroke="#8a84b8" stroke-width="2"/>' +
      `<text x="66" y="67" text-anchor="middle" dominant-baseline="central" font-family="${PLAKETTE_FONT}" font-size="30" font-weight="900" fill="#6f6b8f">–</text>` +
      '</svg>' });
  }
  const dueMonth = tuv.dueDate.getMonth() + 1;
  const yy = String(tuv.dueDate.getFullYear() % 100).padStart(2, '0');
  const color = plaketteColorForYear(tuv.dueDate.getFullYear());
  const cx = 66, cy = 66;
  const rRing = 61;      // schwarzer Ring
  const rHub = 19;       // Innenkreis mit Jahreszahl
  const rNum = 44;       // Radius der Monatszahlen (weiter außen = mehr Abstand)
  const gapIn = 33, gapOut = 53; // Speiche: Nabe→33, Lücke für Zahl, 53→Ring
  const polar = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const P = (r, deg) => polar(r, deg).map(n => n.toFixed(2)).join(' ');
  const ring = (r1, r2, a1, a2) => `M${P(r1, a1)} L${P(r2, a1)} A${r2} ${r2} 0 0 1 ${P(r2, a2)} L${P(r1, a2)} A${r1} ${r1} 0 0 0 ${P(r1, a1)} Z`;

  // Zahlen laufen wie beim Original GEGEN den Uhrzeigersinn (oben fälliger Monat,
  // links daneben der nächste) und drehen sich mit ihrer Position mit.
  const idx12 = ((12 - dueMonth) % 12 + 12) % 12; // Position der Ziffer 12
  let spokes = '', months = '';
  for (let i = 0; i < 12; i++) {
    const ang = -i * 30;
    const m = ((dueMonth - 1 + i) % 12) + 1;
    const [ax, ay] = polar(rHub, ang).map(n => n.toFixed(2));
    const [bx, by] = polar(gapIn, ang).map(n => n.toFixed(2));
    spokes += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#111" stroke-width="2.4"/>`;
    // Der äußere Speichenabschnitt der 12 entfällt: dort sitzt der Spalt des
    // schwarzen Ecks, der frei bleiben muss (sonst wirkt der Spalt zerstückelt).
    if (i !== idx12) {
      const [ux, uy] = polar(gapOut, ang).map(n => n.toFixed(2));
      const [vx, vy] = polar(rRing, ang).map(n => n.toFixed(2));
      spokes += `<line x1="${ux}" y1="${uy}" x2="${vx}" y2="${vy}" stroke="#111" stroke-width="2.4"/>`;
    }
    const [tx, ty] = polar(rNum, ang).map(n => n.toFixed(2));
    months += `<text x="${tx}" y="${ty}" transform="rotate(${ang} ${tx} ${ty})" text-anchor="middle" dy="0.35em" font-family="${PLAKETTE_FONT}" font-size="14" font-weight="800" fill="#111">${m}</text>`;
  }

  // Schwarzes Eck: außen über drei Zahlen. Es beginnt am Strich der 1, läuft über
  // die 12 und endet am Strich der 11; in der Mitte (auf Höhe der 12) teilt ein
  // einzelner sauberer Spalt den Balken in zwei Hälften. Nach außen endet der
  // Balken an der äußeren Ringlinie, er ragt nicht darüber hinaus.
  const eckMitte = -idx12 * 30;                 // Strich der Ziffer 12
  const eck = ring(52, rRing, eckMitte - 30, eckMitte - 2.2) + ' ' +
              ring(52, rRing, eckMitte + 2.2, eckMitte + 30);

  const svg = `<svg viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="TÜV-Plakette, fällig ${String(dueMonth).padStart(2, '0')}/20${yy}">
    <circle cx="${cx}" cy="${cy}" r="${rRing}" fill="${color}" stroke="#111" stroke-width="4"/>
    <path d="${eck}" fill="#111"/>
    ${spokes}
    ${months}
    <circle cx="${cx}" cy="${cy}" r="${rHub}" fill="${color}" stroke="#111" stroke-width="2.4"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dy="0.35em" font-family="${PLAKETTE_FONT}" font-size="18" font-weight="900" fill="#111">${yy}</text>
  </svg>`;
  return el('div', { class: 'plakette', html: svg });
}

function itemCard(x) {
  const v = vehById(x.iv.vehicleId);
  const rows = el('div', { class: 'rows' });
  if (x.st === 'na') {
    // Ohne "zuletzt erledigt" ist nichts zu rechnen – sagen, was zu tun ist,
    // statt zwei Striche anzuzeigen.
    rows.append(el('div', { style: 'color:var(--muted)' }, 'Noch kein Termin berechenbar.'));
    rows.append(el('div', {}, el('b', {}, 'Zuletzt erledigt eintragen')));
  } else {
    rows.append(el('div', {}, 'Fällig: ', el('b', {}, x.dueDate ? fmtD(x.dueDate.toISOString().slice(0, 10)) : '–')));
    if (x.dueKm != null) rows.append(el('div', {}, 'bei ', el('b', {}, km(x.dueKm))));
    rows.append(el('div', {}, 'Rest: ', el('b', {}, restLabel(x))));
  }
  return el('div', {
    class: 'item ' + x.st, title: 'Zum Bearbeiten anklicken',
    onclick: () => intervalModal(x.iv)
  },
    el('div', { class: 'top' },
      el('span', { class: 'ampel ' + x.st }),
      el('span', { class: 'ic' }, kindIcon(x.iv.kind)),
      el('span', { class: 'nm' }, x.iv.kind)),
    rows,
    el('div', { class: 'foot' }, el('span', { class: 'pill ' + x.st }, stLabel[x.st]),
      (curVeh === 'all' && v) ? el('span', { class: 'veh', style: 'font-size:12px;color:var(--muted)' }, v.name) : el('span')));
}
function restLabel(x) {
  const parts = [];
  if (x.days != null) parts.push(x.days < 0 ? `${Math.abs(x.days)} T. über` : `${x.days} T.`);
  if (x.kmLeft != null) parts.push(x.kmLeft < 0 ? `${new Intl.NumberFormat('de-DE').format(Math.abs(x.kmLeft))} km über` : `${new Intl.NumberFormat('de-DE').format(x.kmLeft)} km`);
  return parts.join(' · ') || '–';
}
const statPlain = (val, lbl) => el('div', { class: 'card stat' }, el('div', { class: 'k' }, lbl), el('div', { class: 'v', style: 'font-size:22px' }, val));

/* ===== views/vehicle ===== */
/* Alles zu einem Fahrzeug auf einer Seite: Stammdaten, saemtliche
   Faelligkeiten und die Notizen. Ist oben "Alle Fahrzeuge" gewaehlt,
   erscheint stattdessen die Liste zum Auswaehlen und Anlegen. */
function vFahrzeug(m) {
  // Bei genau einem Fahrzeug ist die Unterscheidung "Alle Fahrzeuge" gegenstandslos –
  // dann direkt die Detailansicht zeigen statt einer Liste mit einer Zeile.
  const v = curVeh === 'all'
    ? (S.vehicles.length === 1 ? S.vehicles[0] : null)
    : vehById(curVeh);
  if (!v) return liste(m);

  // Loeschen sitzt nicht mehr im Kopf: Es ist der seltenste und der einzige
  // unumkehrbare Handgriff auf dieser Seite und stand bisher gleich gross
  // neben "Bearbeiten". Jetzt liegt es im Bearbeiten-Fenster.
  const art = fahrzeugArt(v);
  const kopf = headBar(art.name, v.name, 'Bearbeiten', () => vehicleModal(v));

  m.append(el('div', { class: 'fz-kopfband' },
    kopf,
    el('div', { class: 'fz-merkmale' },
      el('span', { class: 'art-zeichen art-kreis gross', title: art.name },
        icon(art.zeichen, 21)),
      v.plate ? el('span', { class: 'plate-anzeige' },
        el('span', { class: 'plate-eu' }, el('span', { class: 'plate-d' }, 'D')),
        el('span', { class: 'txt' }, v.plate)) : null,
      v.model ? el('span', { class: 'fz-modell' }, v.model) : null,
      // Der Kilometerstand ist die Angabe, die sich am haeufigsten aendert
      // und an der die halbe Wartungsrechnung haengt. Er gehoert nach vorn
      // und muss sich von hier aus eintragen lassen.
      el('button', { class: 'km-knopf', onclick: () => kmModal(v),
        title: 'Kilometerstand eintragen oder korrigieren' },
        icon('tacho', 17),
        el('span', { class: 'km-wert' },
          v.km != null && v.km !== '' ? km(v.km) : 'km-Stand eintragen'),
        v.kmDate ? el('span', { class: 'km-datum' }, fmtD(v.kmDate)) : null))));

  m.append(stammdaten(v));
  m.append(faelligkeiten(v));
  m.append(reifen(v));
  m.append(papiere(v));
  m.append(notizen(v));
}

/* --- Abschnitt Papiere ---
   Nur die wichtigen, und nur als Zugriff. Die vollstaendige Ablage steht
   unter Dokumente; hier geht es darum, den Fahrzeugschein zu finden, ohne
   die Seite zu wechseln. */
function papiere(v) {
  const blk = el('section', { class: 'block' });
  blk.append(el('div', { class: 'abschnitt-kopf' },
    el('h2', {}, 'Papiere'),
    el('button', { class: 'btn ghost sm', onclick: () => docModal(null, v.id) },
      '+ Dokument')));

  const meine = S.docs.filter(d => d.vehicleId === v.id);
  const karte = el('div', { class: 'dok-karte' });

  // Ein Moped bis 50 cm³ braucht keine Hauptuntersuchung – es als fehlendes
  // Papier anzumahnen waere schlicht falsch.
  const moped = fahrzeugArt(v).wert === 'motorrad'
    && v.displacement && +v.displacement <= 50;

  PAPIERE.filter(k => !(moped && k === 'HU/AU-Bericht')).forEach(k => {
    const treffer = meine.filter(d => (d.category || '') === k
      || (k === 'Versicherungsnachweis' && d.category === 'Versicherung')
      || (k === 'Kaufvertrag' && d.category === 'Vertrag'));
    if (treffer.length) {
      treffer
        .sort((a, b) => (parseD(b.date) || 0) - (parseD(a.date) || 0))
        .forEach((d, i) => karte.append(el('div', { class: 'dok-zeile' + (i ? '' : ' neu') },
          el('span', { class: 'dok-art' }, i ? '' : k),
          el('button', { class: 'dok-titel', title: 'Öffnen', onclick: () => openDoc(d.id) },
            el('span', { class: 'dok-name' }, d.title || d.name || 'Dokument'),
            el('span', { class: 'dok-meta' }, d.date ? fmtD(d.date) : '')),
          el('button', { class: 'iconbtn', onclick: () => docModal(d) }, 'Bearbeiten'))));
    } else {
      karte.append(el('div', { class: 'dok-zeile fehlt' },
        el('span', { class: 'dok-art' }, k),
        el('span', { class: 'dok-leer' }, 'nicht hinterlegt'),
        el('button', { class: 'iconbtn', onclick: () => docModal(null, v.id, k) },
          'Hochladen')));
    }
  });

  const weitere = meine.length - meine.filter(d => PAPIERE.includes(d.category)).length;
  if (weitere > 0) {
    karte.append(el('div', { class: 'dok-fehlt' },
      el('span', {}, weitere + (weitere === 1 ? ' weiteres Dokument' : ' weitere Dokumente')),
      el('button', { class: 'iconbtn', onclick: () => { setView('docs'); triggerRender(); } },
        'Alle ansehen')));
  }

  blk.append(karte);
  return blk;
}

/* --- Abschnitt Reifen ---

   Ein Satz, nicht ein einzelner Reifen: gewechselt, gelagert und gekauft wird
   satzweise. Die entscheidende Angabe ist das Herstellungsdatum aus dem
   DOT-Code. Reifen altern auch ohne zu fahren – am Anhaenger, der elf Monate
   im Jahr steht, ist das Alter der Grund fuer den Tausch, nicht die
   Profiltiefe. */

const REIFEN_ALT = 6;    // Jahre, ab denen ein Satz als alt gilt
const REIFEN_SEHR_ALT = 10;

/** Herstellungsdatum aus dem DOT-Code: zwei Ziffern Woche, zwei Ziffern Jahr. */
function dotDatum(dot) {
  const t = String(dot || '').replace(/\D/g, '');
  if (t.length !== 4) return null;
  const woche = +t.slice(0, 2), jj = +t.slice(2);
  if (!woche || woche > 53) return null;
  // Zweistellige Jahre: alles, was in der Zukunft laege, gehoert ins
  // vorige Jahrhundert. Ein Reifen von 2098 ist kein Reifen.
  const jahr = jj + (2000 + jj > new Date().getFullYear() ? 1900 : 2000);
  const d = new Date(jahr, 0, 1 + (woche - 1) * 7);
  return { jahr, woche, datum: d };
}

function reifenAlter(dot) {
  const d = dotDatum(dot);
  if (!d) return null;
  return (new Date() - d.datum) / (365.25 * 86400000);
}

function reifen(v) {
  const blk = el('section', { class: 'block' });
  blk.append(el('div', { class: 'abschnitt-kopf' },
    el('h2', {}, 'Reifen'),
    el('button', { class: 'btn ghost sm', onclick: () => reifenModal(v) }, '+ Satz')));

  const saetze = (S.tyres || []).filter(r => r.vehicleId === v.id)
    .sort((a, b) => (b.montiert === 'ja') - (a.montiert === 'ja')
      || String(a.season || '').localeCompare(String(b.season || '')));

  if (!saetze.length) {
    blk.append(el('div', { class: 'card empty' },
      'Noch kein Reifensatz erfasst. Marke, Größe und das Herstellungsdatum '
      + 'vom DOT-Code der Reifenflanke genügen für den Anfang.',
      el('div', {}, el('button', { class: 'btn', onclick: () => reifenModal(v) },
        '+ Ersten Satz anlegen'))));
    return blk;
  }

  const raster = el('div', { class: 'reifen-raster' });
  saetze.forEach(r => raster.append(reifenKarte(v, r)));
  blk.append(raster);
  return blk;
}

function reifenKarte(v, r) {
  const jahre = reifenAlter(r.dot);
  const d = dotDatum(r.dot);
  const tempo100 = (v.art === 'anhaenger' && v.tempo100 === 'ja');

  // Zustand: Alter zuerst, dann Profil. Beides kann den Satz erledigen.
  let stufe = 'ok', satz = null;
  if (jahre != null && jahre >= REIFEN_SEHR_ALT) {
    stufe = 'over'; satz = Math.floor(jahre) + ' Jahre alt – ersetzen';
  } else if (jahre != null && tempo100 && jahre >= REIFEN_ALT) {
    stufe = 'over'; satz = Math.floor(jahre) + ' Jahre – für 100 km/h zu alt';
  } else if (jahre != null && jahre >= REIFEN_ALT) {
    stufe = 'soon'; satz = Math.floor(jahre) + ' Jahre alt – im Auge behalten';
  }
  if (r.treadMm != null && r.treadMm !== '') {
    if (+r.treadMm < 1.6) { stufe = 'over'; satz = 'Profil unter 1,6 mm'; }
    else if (+r.treadMm < 3 && stufe !== 'over') {
      stufe = 'soon'; satz = satz || 'Profil unter 3 mm';
    }
  }

  const zeile = (label, wert) => wert == null || wert === '' ? null
    : el('div', { class: 'sd-feld' },
      el('span', { class: 'sd-label' }, label),
      el('span', { class: 'sd-wert' }, wert));

  return el('article', { class: 'reifen-karte ' + stufe },
    el('span', { class: 'reifen-band' }),
    el('div', { class: 'reifen-leib' },
      el('div', { class: 'reifen-kopf' },
        el('div', { class: 'reifen-titel' },
          el('h3', {}, [r.brand, r.productName].filter(Boolean).join(' ') || 'Reifensatz'),
          el('span', { class: 'reifen-sub' },
            [r.season, r.size].filter(Boolean).join(' · ') || '–')),
        r.montiert === 'ja'
          ? el('span', { class: 'pill ok' }, 'montiert')
          : el('span', { class: 'pill na' }, 'eingelagert')),

      el('div', { class: 'sd-raster' },
        zeile('Hergestellt', d ? 'KW ' + String(d.woche).padStart(2, '0') + '/' + d.jahr
          + (jahre != null ? ' · ' + Math.floor(jahre) + ' J.' : '') : (r.dot || null)),
        zeile('Profil', r.treadMm ? String(r.treadMm).replace('.', ',') + ' mm' : null),
        zeile(r.montiert === 'ja' ? 'Montiert seit' : 'Zuletzt montiert',
          r.mountedSince ? fmtD(r.mountedSince) : null),
        zeile('Gekauft', r.boughtDate ? fmtD(r.boughtDate) : null),
        zeile(r.montiert === 'ja' ? 'Ersatzsatz liegt' : 'Lagerort', r.storage)),

      satz ? el('div', { class: 'reifen-warnung ' + stufe }, satz) : null,
      r.note ? el('div', { class: 'reifen-notiz' }, r.note) : null,

      el('div', { class: 'reifen-fuss' },
        r.montiert === 'ja' ? el('span', { class: 'leise' }, 'Dieser Satz ist am Fahrzeug')
          : el('button', { class: 'iconbtn', onclick: () => montiere(v, r) }, 'Jetzt montiert'),
        el('button', { class: 'iconbtn', style: 'margin-left:auto',
          onclick: () => reifenModal(v, r) }, 'Bearbeiten'))));
}

/** Diesen Satz ans Fahrzeug, alle anderen dieses Fahrzeugs herunter. */
async function montiere(v, r) {
  const andere = (S.tyres || []).filter(x => x.vehicleId === v.id
    && x.id !== r.id && x.montiert === 'ja');
  for (const x of andere) await put('tyres', { ...x, montiert: '' });
  await put('tyres', { ...r, montiert: 'ja', mountedSince: todayISO() });
  aktualisiere();
  toast('Reifensatz als montiert vermerkt');
  triggerRender();
}

function reifenModal(v, r) {
  const e = r || { id: uid(), vehicleId: v.id, season: 'Sommer' };

  const loeschen = r ? el('div', { class: 'loeschzeile' },
    el('button', { class: 'btn ghost del',
      onclick: () => confirmDel('tyres', e.id, 'Diesen Reifensatz löschen?') },
      'Reifensatz löschen')) : null;

  modal(r ? 'Reifensatz bearbeiten' : 'Reifensatz anlegen', [
    row2(selField('Jahreszeit', 'season', e.season, ['Sommer', 'Winter', 'Ganzjahr']),
      f('Größe', 'size', e.size, 'text', v.tyreSize || 'z. B. 215/70 R15C')),
    row2(f('Marke', 'brand', e.brand, 'text', 'z. B. Continental'),
      f('Produkt', 'productName', e.productName, 'text', 'z. B. VanContact Winter')),

    el('div', { class: 'feldgruppe' },
      el('span', { class: 'marke' }, 'Alter und Zustand'),
      row2(f('DOT (Woche/Jahr)', 'dot', e.dot, 'text', 'z. B. 3419 = KW 34 / 2019'),
        f('Profiltiefe (mm)', 'treadMm', e.treadMm, 'number')),
      el('p', { class: 'dialog-hinweis' },
        'Der DOT-Code steht als vierstellige Zahl auf der Reifenflanke. '
        + 'Reifen altern auch ungefahren – ab sechs Jahren wird es kritisch, '
        + 'bei 100-km/h-Anhängern ist dort die Grenze.')),

    row2(f('Montiert seit', 'mountedSince', e.mountedSince, 'date'),
      f('Gekauft am', 'boughtDate', e.boughtDate, 'date')),
    f('Lagerort', 'storage', e.storage, 'text', 'z. B. Keller links, Garage Regal oben'),
    f('Notiz', 'note', e.note, 'text', 'optional'),
    loeschen
  ], async (data) => {
    // "9999" als DOT hiess bisher: gespeichert, aber nicht deutbar - die
    // Karte zeigte dann den Rohwert und niemand erfuhr, warum kein Alter
    // dasteht. Woche 01 bis 53, vier Ziffern.
    const dotRoh = String(data.dot || '').replace(/\D/g, '');
    const grund = ersteMeldung([
      [leer(data.size) && leer(data.brand), 'Bitte wenigstens Größe oder Marke angeben.'],
      [!leer(data.dot) && dotRoh.length !== 4,
       'Der DOT-Code sind vier Ziffern: Woche und Jahr, z. B. 3419 für KW 34 / 2019.'],
      [!leer(data.dot) && dotRoh.length === 4 && (+dotRoh.slice(0, 2) < 1 || +dotRoh.slice(0, 2) > 53),
       'Die ersten beiden Ziffern des DOT sind die Kalenderwoche (01 bis 53).'],
      [istNegativ(data.treadMm) || zuGross(data.treadMm, 30), 'Die Profiltiefe wirkt nicht plausibel.'],
      [zuLang(data.brand, GRENZE.text) || zuLang(data.productName, GRENZE.text), 'Marke oder Produkt sind zu lang.']
    ]);
    if (grund) { toast(grund); return false; }
    await put('tyres', { ...e, ...data, montiert: e.montiert || '' });
    aktualisiere();
    toast('Reifensatz gespeichert');
  });
}

/* --- Uebersicht, wenn kein einzelnes Fahrzeug gewaehlt ist --- */
function liste(m) {
  m.append(headBar('Fahrzeuge', 'Alle Fahrzeuge', '+ Fahrzeug hinzufügen', () => vehicleModal()));
  if (!S.vehicles.length) {
    m.append(el('div', { class: 'card empty' },
      el('div', { style: 'font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px' }, 'Willkommen im Fuhrpark'),
      el('div', {}, 'Lege zuerst dein Fahrzeug an. Danach schlägt dir die App direkt die üblichen Wartungsintervalle vor – TÜV, Ölwechsel, Bremsflüssigkeit und weitere.'),
      el('div', {}, el('button', { class: 'btn', onclick: () => vehicleModal() }, '+ Erstes Fahrzeug anlegen'))));
    return;
  }
  const t = table(['', 'Fahrzeug', 'Kennzeichen', 'Modell', 'km-Stand', 'Offene Termine', '']);
  S.vehicles.forEach(v => {
    const art = fahrzeugArt(v);
    const offen = S.intervals.filter(iv => iv.vehicleId === v.id)
      .map(iv => intStatus(iv).st).filter(s => s === 'over' || s === 'soon').length;
    const hinein = () => { setCurVeh(v.id); triggerRender(); };
    // Die ganze Zeile fuehrt ins Fahrzeug. Einen Knopf zu treffen, wenn
    // daneben die ganze Zeile dasselbe meint, ist unnoetige Zielarbeit.
    t.tBody.append(el('tr', {
      class: 'anklickbar', title: v.name + ' öffnen',
      onclick: hinein, tabindex: '0',
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); hinein(); } }
    },
      tdEl(el('span', { class: 'art-zeichen', title: art.name }, icon(art.zeichen, 19))),
      td(v.name), td(v.plate || '–'), td(v.model || '–'), td(km(v.km), 'num'),
      tdEl(offen ? el('span', { class: 'pill soon' }, String(offen)) : el('span', { style: 'color:var(--muted)' }, '–')),
      tdEl(el('div', { class: 'rowact' },
        el('button', { class: 'iconbtn', onclick: e => { e.stopPropagation(); vehicleModal(v); } },
          'Bearbeiten')))));
  });
  m.append(t.wrap);
}

/* --- Kilometerstand eintragen oder korrigieren ---
   Geschrieben wird in den km-Verlauf, nicht direkt ans Fahrzeug: Der Server
   traegt von dort den juengsten Stand am Fahrzeug nach. So bleibt
   nachvollziehbar, wann welcher Stand galt, statt dass ein Wert den anderen
   spurlos ersetzt. */
function kmModal(v) {
  const verlauf = (S.kmlog || [])
    .filter(k => k.vehicleId === v.id && k.km)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));

  const bisher = v.km != null && v.km !== ''
    ? el('p', { class: 'dialog-hinweis' },
      'Bisher ' + km(v.km) + (v.kmDate ? ' vom ' + fmtD(v.kmDate) : '')
      + '. Ein Stand mit jüngerem Datum ersetzt ihn.')
    : el('p', { class: 'dialog-hinweis' }, 'Für dieses Fahrzeug ist noch kein Stand erfasst.');

  const letzte = verlauf.length ? el('div', { class: 'km-verlauf' },
    el('span', { class: 'marke' }, 'Bisherige Stände'),
    ...verlauf.slice(0, 5).map(k => el('div', { class: 'km-zeile' },
      el('span', { class: 'km-zeile-datum' }, fmtD(k.date)),
      el('span', { class: 'km-zeile-wert' }, km(k.km)),
      k.note ? el('span', { class: 'km-zeile-notiz' }, k.note) : null))) : null;

  // Merkt sich, FUER WELCHEN WERT der Rueckschritt gemeldet wurde. Nur ein
  // Merker "schon gewarnt" wuerde jeden weiteren Vertipper durchlassen.
  let gewarntFuer = null;

  modal('Kilometerstand · ' + v.name, [
    bisher,
    row2(f('Datum', 'date', todayISO(), 'date'), f('km-Stand', 'km', '', 'number')),
    f('Notiz', 'note', '', 'text', 'z. B. abgelesen beim Tanken'),
    letzte
  ], async (data) => {
    const stand = +data.km;
    const meldung = ersteMeldung([
      [leer(data.km) || !isFinite(stand) || stand <= 0, 'Bitte einen Kilometerstand eintragen.'],
      [leer(data.date), 'Bitte ein Datum angeben.'],
      [zuGross(stand, GRENZE.km), 'Der Kilometerstand wirkt vertippt – bitte prüfen.']
    ]);
    if (meldung) { toast(meldung); return false; }

    // Ein Kilometerstand geht nur vorwaerts. Ein vergessener Zehner macht aus
    // 156.000 die 15.600 - und damit jede kilometerbasierte Faelligkeit
    // falsch, lautlos. Deshalb hier eine Rueckfrage statt stiller Uebernahme.
    // Bestaetigen bleibt moeglich: Tachotausch und Korrektur gibt es wirklich.
    const bisher = (S.kmlog || [])
      .filter(k => k.vehicleId === v.id && k.km && String(k.date) <= String(data.date))
      .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
    const vergleich = bisher ? +bisher.km : (v.km != null && v.km !== '' ? +v.km : null);
    if (vergleich != null && stand < vergleich && gewarntFuer !== stand) {
      gewarntFuer = stand;
      toast('Das sind ' + km(vergleich - stand) + ' weniger als bisher (' + km(vergleich)
        + '). Nochmal auf Speichern, wenn das stimmt.');
      return false;
    }

    await put('kmlog', {
      id: uid(), vehicleId: v.id, date: data.date, km: stand, note: data.note
    });
    aktualisiere();
    toast('Kilometerstand gespeichert');
  });
}

/* --- Abschnitt Stammdaten --- */
function stammdaten(v) {
  // Beschriftung und Wert standen bisher in einer Zeile nebeneinander, beide
  // in derselben Groesse. Dann sucht das Auge bei jeder Angabe neu, wo das
  // eine aufhoert und das andere anfaengt. Jetzt steht die Beschriftung klein
  // und gesperrt ueber dem Wert – man liest eine Spalte Werte und schaut nur
  // nach oben, wenn man wissen will, was es ist.
  const zeile = (label, wert) => el('div', { class: 'sd-feld' },
    el('span', { class: 'sd-label' }, label),
    el('span', { class: 'sd-wert' }, wert));
  const zahl = n => (n == null || n === '') ? null : new Intl.NumberFormat('de-DE').format(n);

  // Nur ausgefuellte Angaben zeigen – leere Felder als lange Strichliste
  // waeren nur Rauschen. Bearbeiten fuehrt zum vollstaendigen Formular.
  const karte = (titel, eintraege) => {
    const gefuellt = eintraege.filter(([, wert]) => wert != null && wert !== '' && wert !== '–');
    if (!gefuellt.length) return null;
    return el('div', { class: 'sd-karte' },
      titel ? el('div', { class: 'sd-kopf' }, titel) : null,
      el('div', { class: 'sd-raster' },
        ...gefuellt.map(([label, wert]) => zeile(label, String(wert)))));
  };

  const blk = el('section', { class: 'block' }, el('h2', {}, 'Stammdaten'));
  const karten = [
    karte(null, [
      ['Kennzeichen', v.plate], ['Modell', v.model],
      ['Erstzulassung', v.firstReg ? fmtD(v.firstReg) : null],
      ['km-Stand', v.km != null && v.km !== '' ? km(v.km) + (v.kmDate ? ' (' + fmtD(v.kmDate) + ')' : '') : null],
      ['VIN', v.vin], ['Farbe', v.color]
    ]),
    karte('Technik', [
      ['HSN/TSN', [v.hsn, v.tsn].filter(Boolean).join(' / ') || null],
      ['Kraftstoff', v.fuelType], ['Getriebe', v.gearbox],
      ['Leistung', v.powerKw ? v.powerKw + ' kW (' + Math.round(v.powerKw * 1.35962) + ' PS)' : null],
      ['Hubraum', zahl(v.displacement) ? zahl(v.displacement) + ' cm³' : null],
      ['Schadstoffklasse', v.emissionClass], ['Reifengröße', v.tyreSize],
      ['Verbrauch', v.consumption],
      ['Verbandkasten bis', v.firstAidExpiry ? fmtD(v.firstAidExpiry)
        + (parseD(v.firstAidExpiry) < new Date() ? ' — abgelaufen' : '') : null]
    ]),
    karte('Gewichte', [
      ['Leergewicht', zahl(v.weightEmpty) ? zahl(v.weightEmpty) + ' kg' : null],
      ['Zul. Gesamtgewicht', zahl(v.weightMax) ? zahl(v.weightMax) + ' kg' : null],
      ['Zuladung', (v.weightMax && v.weightEmpty) ? zahl(v.weightMax - v.weightEmpty) + ' kg' : null],
      ['Anhängelast', zahl(v.trailerLoad) ? zahl(v.trailerLoad) + ' kg' : null],
      ['Stützlast', zahl(v.noseWeight) ? zahl(v.noseWeight) + ' kg' : null],
      ['Sitzplätze', v.seats]
    ]),
    // Nur beim Anhaenger, sonst waere die Karte bei jedem Auto leer.
    v.art === 'anhaenger' ? karte('Anhänger', [
      ['Aufbau', v.bodyType],
      ['Bremse', v.brakeType],
      ['100 km/h', v.tempo100],
      ['HU-Rhythmus', (+v.weightMax > 3500) ? 'jährlich (über 3,5 t)' : 'alle 24 Monate']
    ]) : null,
    karte('Versicherung & Kauf', [
      ['Versicherung', v.insurance], ['Versicherungsnummer', v.insuranceNo],
      ['Kaufdatum', v.purchaseDate ? fmtD(v.purchaseDate) : null],
      ['Kaufpreis', v.purchasePrice ? eur(v.purchasePrice) : null],
      ['Gekauft bei', v.dealer]
    ])
  ].filter(Boolean);

  if (!karten.length) {
    blk.append(el('div', { class: 'card empty' }, 'Noch keine Angaben erfasst.',
      el('div', {}, el('button', { class: 'btn ghost', onclick: () => vehicleModal(v) }, 'Daten ergänzen'))));
    return blk;
  }
  blk.append(el('div', { class: 'grid', style: 'gap:12px' }, ...karten));
  if (v.note) blk.append(el('div', { class: 'sd-karte sd-notiz' }, v.note));
  return blk;
}

/* --- Abschnitt Faelligkeiten: hier stehen sie vollstaendig --- */
function faelligkeiten(v) {
  const blk = el('section', { class: 'block' });
  blk.append(el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap' },
    el('h2', { style: 'margin:0' }, 'Fälligkeiten'),
    el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
      el('button', { class: 'btn ghost sm', onclick: () => vorlagenModal(v) }, 'Aus Vorlage'),
      el('button', { class: 'btn ghost sm', onclick: () => intervalModal() }, '+ Erinnerung'))));

  const list = S.intervals.filter(iv => iv.vehicleId === v.id).map(iv => ({ iv, ...intStatus(iv) }))
    .sort((a, b) => rank(a.st) - rank(b.st) || ((a.days ?? 9e9) - (b.days ?? 9e9)));

  if (!list.length) {
    blk.append(el('div', { class: 'card empty' },
      'Noch keine Termine. Am schnellsten geht es über die Vorlage mit den üblichen Wartungsintervallen.',
      el('div', { style: 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px' },
        el('button', { class: 'btn', onclick: () => vorlagenModal(v) }, 'Aus Vorlage anlegen'),
        el('button', { class: 'btn ghost', onclick: () => intervalModal() }, '+ Einzeln anlegen'))));
    return blk;
  }

  const zahl = n => new Intl.NumberFormat('de-DE').format(n);
  // Eine Zeile je Termin. Jeder Wert traegt ein Symbol, das seine Bedeutung
  // anzeigt, und im Tooltip den ausgeschriebenen Namen. Das haelt die Zeile
  // niedrig und macht trotzdem erkennbar, was welche Angabe ist.
  const wert = (symbol, titel, text, klasse) => text ? el('span', {
    class: 'fw' + (klasse ? ' ' + klasse : ''), title: titel + ': ' + text
  }, el('span', { class: 'fw-s' }, symbol), el('span', {}, text)) : null;

  const wrap = el('div', { class: 'faellig-liste' });
  list.forEach(x => {
    const iv = x.iv;
    const rhythmus = [iv.intervalKm ? zahl(iv.intervalKm) + ' km' : null,
                      iv.intervalMonths ? iv.intervalMonths + ' Mon.' : null]
                      .filter(Boolean).join(' / ');
    // Nur das Datum: Der km-Stand der letzten Wartung wuerde die Zeile
    // umbrechen lassen und steht im Tooltip sowie im Bearbeiten-Fenster.
    const zuletzt = iv.lastDate ? fmtD(iv.lastDate) : '';
    const zuletztVoll = [iv.lastDate ? fmtD(iv.lastDate) : null,
                         iv.lastKm ? 'bei ' + zahl(iv.lastKm) + ' km' : null]
                         .filter(Boolean).join(' · ');
    const faellig = [x.dueDate ? fmtD(x.dueDate.toISOString().slice(0, 10)) : null,
                     x.dueKm != null ? km(x.dueKm) : null]
                     .filter(Boolean).join(' · ');
    const rest = [];
    if (x.days != null) rest.push(x.days < 0 ? `${Math.abs(x.days)} T. über` : `${x.days} T.`);
    if (x.kmLeft != null) rest.push(x.kmLeft < 0 ? `${zahl(Math.abs(x.kmLeft))} km über` : `${zahl(x.kmLeft)} km`);

    wrap.append(el('div', { class: 'faellig ' + x.st },
      el('div', { class: 'ff-name' },
        el('span', { class: 'ampel ' + x.st }),
        el('span', { class: 'ic' }, kindIcon(iv.kind)),
        el('span', { class: 'nm' }, iv.kind)),
      // Rhythmus steht bewusst nicht in der Zeile – er wuerde sie umbrechen
      // lassen und ist im Bearbeiten-Fenster ohnehin zu sehen. Im Tooltip
      // der Faelligkeit wird er mitgenannt.
      el('div', { class: 'ff-werte' },
        wert('✓', 'Zuletzt erledigt' + (zuletztVoll !== zuletzt ? ' — ' + zuletztVoll : ''), zuletzt),
        wert('▸', 'Nächste Fälligkeit' + (rhythmus ? ' (Rhythmus ' + rhythmus + ')' : ''), faellig || '–', 'stark'),
        wert('⏱', 'Verbleibend', rest.join(' · '), x.st === 'over' ? 'warn' : '')),
      el('span', { class: 'pill ' + x.st }, stLabel[x.st]),
      // Nur Bearbeiten. Das Loeschen liegt im Bearbeiten-Fenster – es ist der
      // seltenste Handgriff und muss nicht in jeder Zeile danebenstehen.
      el('div', { class: 'rowact ff-akt' },
        el('button', { class: 'iconbtn', onclick: () => intervalModal(iv) }, 'Bearbeiten'))));
  });
  blk.append(el('div', { class: 'ff-legende' },
    el('span', {}, '✓ zuletzt erledigt'),
    el('span', {}, '▸ nächste Fälligkeit'),
    el('span', {}, '⏱ verbleibend')));
  blk.append(wrap);
  return blk;
}

/* --- Vorlage: uebliche Wartungsintervalle mit zwei Klicks anlegen --- */
setVorlageOeffnen(v => vorlagenModal(v));

function vorlagenModal(v) {
  const vorhanden = new Set(S.intervals.filter(iv => iv.vehicleId === v.id)
    .map(iv => (iv.kind || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '')));
  const passend = vorlagenFuer(v).filter(t => passtZuFahrzeug(t, v));

  const mod = $('#modal');
  mod.innerHTML = '';
  const body = el('div', { class: 'body' });
  body.append(el('div', { style: 'font-size:13px;color:var(--muted)' },
    'Richtwerte als Startpunkt – verbindlich ist der Wartungsplan deines Herstellers ' +
    '(Serviceheft, Betriebsanleitung oder Werkstatt). Werte lassen sich danach jederzeit ändern. ' +
    'Bei Zeit- und Kilometergrenze gilt, was zuerst eintritt.'));

  const felder = [];
  passend.forEach(t => {
    const schluessel = t.kind.toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
    const schonDa = vorhanden.has(schluessel);
    const box = el('input', { type: 'checkbox' });
    box.checked = t.standard && !schonDa;
    box.disabled = schonDa;
    const zeile = el('label', {
      style: 'display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:12px;cursor:' + (schonDa ? 'default' : 'pointer') + (schonDa ? ';opacity:.55' : '')
    },
      box,
      el('div', { style: 'flex:1;min-width:0' },
        el('div', { style: 'font-weight:700;font-size:14px' },
          t.kind + (schonDa ? ' — bereits angelegt' : '')),
        el('div', { style: 'font-size:12px;color:var(--muted);margin-top:2px' },
          [t.km ? new Intl.NumberFormat('de-DE').format(t.km) + ' km' : null,
           t.monate ? t.monate + ' Monate' : null].filter(Boolean).join(' / ') || 'ohne festen Abstand'),
        el('div', { style: 'font-size:11.5px;color:var(--muted);margin-top:3px' }, t.hinweis)));
    felder.push({ t, box, schonDa });
    body.append(zeile);
  });

  const anlegen = el('button', { class: 'btn' }, 'Ausgewählte anlegen');
  anlegen.onclick = async () => {
    const gewaehlt = felder.filter(x => x.box.checked && !x.schonDa);
    if (!gewaehlt.length) { toast('Nichts ausgewählt.'); return; }
    anlegen.disabled = true;
    for (const { t } of gewaehlt) {
      await put('intervals', {
        id: uid(), vehicleId: v.id, kind: t.kind,
        intervalKm: t.km, intervalMonths: t.monate,
        lastDate: null, lastKm: null
      });
    }
    aktualisiere();
    closeModal();
    triggerRender();
    toast(gewaehlt.length + ' Termine angelegt – bitte „zuletzt erledigt" ergänzen.');
  };

  mod.append(
    el('header', {}, el('h3', {}, 'Wartungsintervalle aus Vorlage'), el('button', { class: 'x', onclick: closeModal }, '×')),
    body,
    el('footer', {}, el('button', { class: 'btn ghost', onclick: closeModal }, 'Abbrechen'), anlegen));
  $('#overlay').classList.add('show');
}

/* --- Abschnitt Notizen --- */
function notizen(v) {
  const blk = el('section', { class: 'block' });
  blk.append(el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px' },
    el('h2', { style: 'margin:0' }, 'Notizen'),
    el('button', { class: 'btn ghost sm', onclick: () => noteModal() }, '+ Notiz')));

  const list = S.notes.filter(n => n.vehicleId === v.id)
    .slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (!list.length) {
    blk.append(el('div', { class: 'card empty' }, 'Noch keine Notizen. Halte hier fest, was dir zum Fahrzeug einfällt.'));
    return blk;
  }
  const wrap = el('div', { class: 'grid', style: 'gap:8px' });
  list.forEach(n => {
    // Haengt ein Beleg an der Notiz, muss er von hier aus erreichbar sein -
    // sonst waere er abgelegt und trotzdem verloren.
    const dok = n.docId ? S.docs.find(d => d.id === n.docId) : null;
    wrap.append(el('div', { class: 'notiz' },
      el('span', { class: 'dt num' }, fmtD(n.date)),
      el('span', { class: 'txt' }, n.text || '–'),
      el('span', { class: 'rowact' },
        dok ? el('button', { class: 'iconbtn', title: dok.name || 'Beleg',
          onclick: () => openDoc(dok.id) }, iconMit('beleg', ' Beleg')) : null,
        el('button', { class: 'iconbtn', onclick: () => noteModal(n) }, 'Bearbeiten'),
        el('button', { class: 'iconbtn del', onclick: () => confirmDel('notes', n.id, 'Notiz löschen?') }, '✕'))));
  });
  blk.append(wrap);
  return blk;
}

/* ===== views/events ===== */
/* Der Verlauf zeigt ausschliesslich, was tatsaechlich passiert ist.
   Faelligkeiten stehen bewusst nicht hier: Sie sind Vorhersagen aus einer
   Regel, keine Tatsachen mit Betrag und Beleg. Beides gemeinsam auf einer
   Achse liest sich widerspruechlich. Faelligkeiten wohnen im Dashboard und
   auf der Fahrzeugseite. */
function vEvents(m) {
  m.append(headBar('Werkstatt & Wartung', 'Wartungshistorie', '+ Eintrag hinzufügen', () => {
    if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; }
    eventModal();
  }));

  const liste = forVeh(S.events).slice()
    .sort((a, b) => (parseD(b.date) || 0) - (parseD(a.date) || 0));

  if (!liste.length) {
    m.append(el('div', { class: 'empty' },
      'Noch nichts erfasst. Scanne einen Beleg oder trag den ersten Werkstattbesuch von Hand ein.',
      el('div', {}, el('button', { class: 'btn', onclick: () => {
        if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; }
        eventModal();
      } }, '+ Ersten Eintrag anlegen'))));
    return;
  }

  // Nach Jahren gruppieren: gibt der langen Liste Struktur und beantwortet
  // nebenbei die Frage, was ein Jahr gekostet hat.
  const jahre = new Map();
  liste.forEach(e => {
    const d = parseD(e.date);
    const j = d ? d.getFullYear() : 'Ohne Datum';
    if (!jahre.has(j)) jahre.set(j, []);
    jahre.get(j).push(e);
  });

  jahre.forEach((eintraege, jahr) => {
    const summe = eintraege.reduce((s, e) => s + (+e.cost || 0), 0);
    m.append(el('div', { class: 'jahr-kopf' },
      el('span', { class: 'jahr' }, String(jahr)),
      el('span', { class: 'jahr-linie' }),
      el('span', { class: 'jahr-meta' },
        eintraege.length + (eintraege.length === 1 ? ' Eintrag' : ' Einträge')),
      summe ? el('span', { class: 'jahr-summe' }, eur(summe)) : null));

    const wrap = el('div', { class: 'verlauf' });
    eintraege.forEach(e => wrap.append(zeile(e)));
    m.append(wrap);
  });

  function zeile(e) {
    const v = vehById(e.vehicleId);
    const doc = e.docId ? S.docs.find(d => d.id === e.docId) : null;
    const d = parseD(e.date);
    const unten = [
      e.shop,
      e.km ? new Intl.NumberFormat('de-DE').format(e.km) + ' km' : null,
      curVeh === 'all' && v ? v.name : null
    ].filter(Boolean).join(' · ');

    return el('div', { class: 'vz', onclick: () => eventAnsicht(e) },
      el('div', { class: 'vz-datum' },
        el('span', { class: 'tag-tag' }, d ? String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' : '–')),
      el('div', { class: 'vz-mitte' },
        el('div', { class: 'vz-kopf' },
          el('span', { class: 'tag ' + artKlasse(e.type) }, e.type || 'Eintrag'),
          el('span', { class: 'vz-titel' }, e.desc || '–')),
        unten ? el('div', { class: 'vz-sub' }, unten) : null),
      el('div', { class: 'vz-rechts' },
        e.cost ? el('span', { class: 'vz-betrag' }, eur(e.cost)) : el('span'),
        doc ? el('a', { class: 'link vz-beleg', onclick: ev => { ev.stopPropagation(); openDoc(doc.id); } }, 'Beleg') : null),
      // Nur Bearbeiten – das Loeschen liegt im Dialog dahinter, wie ueberall.
      el('div', { class: 'rowact vz-akt' },
        el('button', { class: 'iconbtn', onclick: ev => { ev.stopPropagation(); eventModal(e); } }, 'Bearbeiten')));
  }
}

/* Die Leseansicht eines Eintrags.

   Ein Klick auf einen Werkstattbesuch fuehrte bisher sofort ins Formular.
   Meistens will man aber nur nachsehen, was damals gemacht wurde und was es
   gekostet hat – und dabei nicht aus Versehen etwas verstellen. Deshalb
   erscheint zuerst, was drinsteht; "Bearbeiten" fuehrt von hier weiter. */
function eventAnsicht(e) {
  const v = vehById(e.vehicleId);
  const doc = e.docId ? S.docs.find(d => d.id === e.docId) : null;
  const zahl = n => new Intl.NumberFormat('de-DE').format(n);

  const feld = (label, wert) => (wert == null || wert === '') ? null
    : el('div', { class: 'sd-feld' },
      el('span', { class: 'sd-label' }, label),
      el('span', { class: 'sd-wert' }, wert));

  const felder = [
    feld('Datum', fmtD(e.date)),
    feld('Art', e.type),
    feld('Fahrzeug', v ? (v.name || v.plate) : null),
    feld('km-Stand', e.km ? zahl(e.km) + ' km' : null),
    feld('Kosten', e.cost ? eur(e.cost) : null),
    feld('Werkstatt / Ort', e.shop)
  ].filter(Boolean);

  const bearbeiten = el('button', { class: 'btn ghost', onclick: () => eventModal(e) },
    'Bearbeiten');
  const ok = el('button', { class: 'btn', onclick: closeModal }, 'OK');

  modal(e.desc || e.type || 'Eintrag', [
    el('div', { class: 'sd-karte' }, el('div', { class: 'sd-raster' }, ...felder)),

    doc ? el('div', { class: 'lese-beleg' },
      el('span', { class: 'marke' }, 'Beleg'),
      el('button', { class: 'iconbtn', onclick: () => { closeModal(); openDoc(doc.id); } },
        doc.name || 'Beleg öffnen')) : null,

    e.note ? el('div', { class: 'lese-notiz' },
      el('span', { class: 'marke' }, 'Notiz'),
      el('p', {}, e.note)) : null
  ], async () => {}, { knoepfe: [bearbeiten, ok] });
}

/* Werkstattfeld mit Vorschlagsliste. Freier Text bleibt moeglich – wer
   selbst geschraubt hat, tippt "Eigenbau". Aber wer dieselbe Werkstatt zum
   dritten Mal eintraegt, soll sie nicht dreimal verschieden schreiben. */
function werkstattFeld(wert) {
  const namen = werkstattNamen();
  const liste = el('datalist', { id: 'werkstattliste' });
  namen.forEach(n => liste.append(el('option', { value: n })));

  const eingabe = el('input', {
    name: 'shop', type: 'text', list: 'werkstattliste',
    placeholder: 'z. B. Eigenbau oder Werkstattname'
  });
  if (wert) eingabe.value = wert;

  return el('div', { class: 'field' },
    el('label', {}, 'Werkstatt / Ort'), eingabe, liste);
}

/* Die Eintragsarten. "Ausbau" gibt es nur beim Camper: Was dort verbaut wird,
   ist weder Wartung noch Reparatur – es ist Geld, das ins Fahrzeug wandert und
   das man am Ende zusammenzaehlen will. Bei einem Auto waere der Eintrag nur
   eine Zeile mehr zum Ueberlesen. */
const EREIGNISARTEN = ['Wartung', 'Reparatur', 'TÜV/AU', 'Reifen', 'Sonstiges'];
const EREIGNISART_AUSBAU = 'Ausbau';
function ereignisarten(v) {
  return istCamper(v)
    ? ['Wartung', 'Reparatur', EREIGNISART_AUSBAU, 'TÜV/AU', 'Reifen', 'Sonstiges']
    : EREIGNISARTEN;
}

/**
 * Die Arten zum Fahrzeug – und die bereits gewaehlte bleibt immer dabei.
 * Sonst verschwaende ein Wechsel des Fahrzeugs einen vorhandenen Eintrag,
 * etwa wenn ein Ausbaueintrag nachtraeglich einem Auto zugeordnet wird.
 */
function ergaenzeArten(vehicleId, gewaehlt) {
  const arten = ereignisarten(vehById(vehicleId));
  return (gewaehlt && !arten.includes(gewaehlt)) ? arten.concat([gewaehlt]) : arten;
}
function eventModal(ev) {
  const e = ev || { id: uid(), vehicleId: curVeh !== 'all' ? curVeh : S.vehicles[0]?.id, date: todayISO() };
  let pickedFile = null;

  // Die Liste haengt am gewaehlten Fahrzeug und muss sich mitaendern, wenn man
  // im selben Dialog das Fahrzeug wechselt.
  const fahrzeugWahl = vehPick(e.vehicleId);
  const typFeld = selField('Typ', 'type', e.type, ergaenzeArten(e.vehicleId, e.type));
  fahrzeugWahl.querySelector('select').onchange = ev2 => {
    const gewaehlt = typFeld.querySelector('select').value;
    const neu = ergaenzeArten(ev2.target.value, gewaehlt);
    const s = typFeld.querySelector('select');
    s.innerHTML = '';
    s.append(el('option', { value: '' }, '– wählen –'));
    neu.forEach(a => {
      const o = el('option', { value: a }, a);
      if (a === gewaehlt) o.selected = true;
      s.append(o);
    });
  };

  const existingDoc = e.docId ? S.docs.find(d => d.id === e.docId) : null;
  const fileField = el('div', { class: 'field' }, el('label', {}, 'Rechnung / Beleg (PDF oder Bild)'),
    el('input', { type: 'file', accept: 'application/pdf,image/*', onchange: ev2 => { pickedFile = ev2.target.files[0] || null; chip.textContent = pickedFile ? ('Ausgewählt: ' + pickedFile.name) : (existingDoc ? ('Aktuell: ' + existingDoc.name) : 'Keine Datei'); } }));
  const chip = el('div', { class: 'filechip' }, existingDoc ? ('Aktuell: ' + existingDoc.name) : 'Keine Datei');
  fileField.append(chip);
  attachAnalyzer(fileField, () => pickedFile, { mode: 'event' });
  modal(ev ? 'Eintrag bearbeiten' : 'Eintrag hinzufügen', [
    fahrzeugWahl,
    row2(f('Datum', 'date', e.date, 'date'), typFeld),
    f('Beschreibung', 'desc', e.desc, 'text', 'z. B. Ölwechsel + Ölfilter'),
    row2(f('km-Stand', 'km', e.km, 'number'), f('Kosten (€)', 'cost', e.cost, 'number')),
    werkstattFeld(e.shop),
    fileField,
    f('Notiz', 'note', e.note, 'textarea'),
    ev ? el('div', { class: 'loeschzeile' },
      el('button', {
        class: 'btn ghost del',
        onclick: () => confirmDel('events', e.id, 'Diesen Eintrag löschen?')
      }, 'Eintrag löschen')) : null
  ], async (data) => {
    // Ein Eintrag ohne jede Angabe war bisher speicherbar und stand danach
    // als "Eintrag –" in der Liste. Etwas muss drinstehen.
    const meldung = ersteMeldung([
      [leer(data.date), 'Bitte ein Datum angeben.'],
      [leer(data.type), 'Bitte einen Typ wählen – danach richtet sich die Auswertung.'],
      [leer(data.desc) && leer(data.cost) && leer(data.shop),
       'Bitte wenigstens eine Beschreibung, einen Betrag oder eine Werkstatt angeben.'],
      [zuLang(data.desc, GRENZE.text), 'Die Beschreibung darf höchstens ' + GRENZE.text + ' Zeichen haben.'],
      [zuLang(data.shop, GRENZE.text), 'Die Werkstatt darf höchstens ' + GRENZE.text + ' Zeichen haben.'],
      [istNegativ(data.cost), 'Ein Betrag kann nicht negativ sein.'],
      [istNegativ(data.km), 'Ein Kilometerstand kann nicht negativ sein.'],
      [zuGross(data.cost, GRENZE.betrag), 'Der Betrag wirkt vertippt – bitte prüfen.'],
      [zuGross(data.km, GRENZE.km), 'Der Kilometerstand wirkt vertippt – bitte prüfen.'],
      [zuLang(data.note, GRENZE.notiz), 'Die Notiz ist zu lang.']
    ]);
    if (meldung) { toast(meldung); return false; }

    let docId = e.docId || null;
    if (pickedFile) {
      toast('Beleg wird abgelegt …');
      const d = await belegAblegen({
        vehicleId: data.vehicleId, file: pickedFile,
        title: data.desc || pickedFile.name, date: data.date,
        category: data.type === 'TÜV/AU' ? 'HU/AU-Bericht' : 'Rechnung'
      });
      docId = d.id;
    }
    await put('events', { ...e, ...data, docId });
    aktualisiere();
    toast('Eintrag gespeichert');
  });
}

/**
 * Farbe je Ereignisart. Eine lange Liste aus gleich aussehenden Zeilen laesst
 * sich schlecht ueberfliegen; die Art ist das Merkmal, nach dem man sucht –
 * "wo war nochmal der TUEV" oder "was waren Reparaturen".
 */
function artKlasse(typ) {
  return {
    'Wartung': 'a-wartung',
    'Reparatur': 'a-reparatur',
    'TÜV/AU': 'a-tuev',
    'Reifen': 'a-reifen',
    'Ausbau': 'a-ausbau'
  }[typ] || 'a-sonst';
}

/* ===== views/costs ===== */
/* Saemtliche Auswertungen an einem Ort: einmalige Werkstattkosten aus dem
   Verlauf und die laufenden Posten wie Versicherung oder Steuer. */
function vKosten(m) {
  m.append(headBar('Auswertung', 'Kosten', '+ Laufender Posten', () => {
    if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; }
    fixcostModal();
  }));

  const jahr = new Date().getFullYear();
  const evs = forVeh(S.events);
  const werkstattGesamt = evs.reduce((s, e) => s + (+e.cost || 0), 0);
  const werkstattJahr = evs.filter(e => parseD(e.date) && parseD(e.date).getFullYear() === jahr)
    .reduce((s, e) => s + (+e.cost || 0), 0);
  const laufendJahr = forVeh(S.fixcosts).reduce((s, fc) => s + yearlyAmount(fc), 0);

  // Summen. Jede Kachel laesst sich aufklappen – eine Summe ohne das, woraus
  // sie besteht, kann man nur glauben, nicht pruefen.
  const jahrEvents = evs.filter(e => parseD(e.date) && parseD(e.date).getFullYear() === jahr);
  m.append(el('div', { class: 'summen' },
    el('div', { class: 'grid', style: 'grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px' },
      kachel('gesamt', eur(werkstattJahr + laufendJahr), 'Kosten ' + jahr + ' insgesamt', true),
      kachel('werkstatt', eur(werkstattJahr), 'davon Werkstatt ' + jahr),
      kachel('laufend', eur(laufendJahr), 'davon laufend / Jahr'),
      kachel('seitbeginn', eur(werkstattGesamt), 'Werkstatt seit Beginn')),
    detailFeld(jahr, jahrEvents, evs, werkstattJahr, laufendJahr)));

  // Laufende Posten
  const lb = el('section', { class: 'block' }, el('h2', {}, 'Laufende Posten'));
  const laufend = forVeh(S.fixcosts).slice().sort((a, b) => (a.kind || '').localeCompare(b.kind || ''));
  if (!laufend.length) {
    lb.append(el('div', { class: 'card empty' }, 'Noch keine laufenden Kosten erfasst. Trag z. B. Versicherung oder Kfz-Steuer ein.',
      el('div', {}, el('button', { class: 'btn', onclick: () => { if (!S.vehicles.length) { toast('Lege zuerst ein Fahrzeug an.'); return; } fixcostModal(); } }, '+ Ersten Posten anlegen'))));
  } else {
    const t = table(curVeh === 'all' ? ['Fahrzeug', 'Art', 'Betrag', 'Rhythmus', 'Pro Jahr', ''] : ['Art', 'Betrag', 'Rhythmus', 'Pro Jahr', '']);
    laufend.forEach(fc => {
      const v = vehById(fc.vehicleId);
      const zellen = [
        td(fc.kind), td(eur(fc.amount), 'num'), td(fc.interval || '–'), td(eur(yearlyAmount(fc)), 'num'),
        // Nur Bearbeiten – das Loeschen liegt im Dialog dahinter.
        tdEl(el('div', { class: 'rowact' },
          el('button', { class: 'iconbtn', onclick: () => fixcostModal(fc) }, 'Bearbeiten')))
      ];
      if (curVeh === 'all') zellen.unshift(td(v ? v.name : '–'));
      t.tBody.append(el('tr', {}, ...zellen));
    });
    lb.append(t.wrap);
  }
  m.append(lb);

  // Aufschluesselung pro Fahrzeug, nur sinnvoll bei mehreren. Jede Zeile
  // laesst sich oeffnen – dahinter stehen die einzelnen Rechnungen.
  if (curVeh === 'all' && S.vehicles.length > 1) {
    const b2 = el('section', { class: 'block' }, el('h2', {}, 'Pro Fahrzeug'));
    const t = table(['Fahrzeug', 'Werkstatt ' + jahr, 'Laufend / Jahr', 'Summe ' + jahr, 'Werkstatt gesamt']);
    S.vehicles.forEach(v => {
      const ve = S.events.filter(e => e.vehicleId === v.id);
      const gesamt = ve.reduce((s, e) => s + (+e.cost || 0), 0);
      const jj = ve.filter(e => parseD(e.date) && parseD(e.date).getFullYear() === jahr).reduce((s, e) => s + (+e.cost || 0), 0);
      const lf = S.fixcosts.filter(fc => fc.vehicleId === v.id).reduce((s, fc) => s + yearlyAmount(fc), 0);
      t.tBody.append(zeileAuf('fz:' + v.id,
